# Alpha / feature dropout fused forward, same (output, mask) contract as
# native_dropout so the backward can reapply the saved mask:
#   alpha:   out = x * mask * a + b,  a = 1/sqrt((alpha^2 p + 1)(1 - p)),
#            b = (mask - 1) * alpha * a + alpha * a * p  -> grad = grad*mask*a
#   feature: out = x * mask / (1 - p), mask has shape (N, C, 1, ...)
- func: native_alpha_dropout(Tensor input, float p) -> (Tensor output, Tensor mask)
