# bytes are dequantized as (q - zero_point) * scale, the convolution runs in
# the float domain, and the result is requantized into [-128, 127] under the
# output qparams.  Bias arrives in the float domain and is added after the
# accumulation.  groups == 1 only.
# Quantized 2D convolution with explicit affine qparams.  The weight is
# quantized per output channel (scales/zero_points over [O]); the compute
# shader dequantizes input and weight on read, accumulates in the float
# domain, adds the float bias, and requantizes into the output qparams.
# Weight and bias are pre-packed on the host into the shader's access layout
# through quantized_conv2d_prepack; run via quantized_conv2d_run.
- func: quantized_conv2d_prepack(Tensor weight, Tensor weight_scales, Tensor weight_zero_points, Tensor? bias=None, bool transposed=False) -> (Tensor weight_packed, Tensor bias_packed)
  variants: function
  dispatch:
    CPU: quantized_conv2d_prepack_cpu

- func: quantized_conv2d_unpack(Tensor weight_packed, Tensor bias_packed, SymInt[] weight_sizes, bool transposed=False, bool depthwise=False) -> (Tensor weight, Tensor bias)
  variants: function
  dispatch:
    CPU: quantized_conv2d_unpack_cpu

- func: quantized_conv2d_run(Tensor input, Tensor weight_packed, Tensor bias_packed, SymInt[] weight_sizes, float input_scale, int input_zero_point, float out_scale, int out_zero_point, int[] stride=1, int[] padding=0, int[] dilation=1, int[] output_padding=0, int groups=1, bool transposed=False, Scalar? output_min=None, Scalar? output_max=None) -> Tensor
  variants: function
  dispatch:
    Vulkan: quantized_conv2d_run

- func: quantized_conv2d(Tensor input, Tensor weight, Tensor? bias, float input_scale, int input_zero_point, float weight_scale, int weight_zero_point, float out_scale, int out_zero_point, int[] stride=1, int[] padding=0, int[] dilation=1, int groups=1) -> Tensor
