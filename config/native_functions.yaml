  variants: function
  dispatch:
    CPU: embedding_dense_backward_cpu


# Bagged embedding lookup: `indices` is one flat run of table rows and
# `offsets` cuts it into bags that are reduced with sum / mean / max
# (mode 0 / 1 / 2).  Outputs, in order:
#   output        [num_bags, embedding_dim] reduced rows;
#   offset2bag    [len(indices)] owning bag per index position, -1 for a
#                 position no bag covers;
#   bag_size      [num_bags] contributing (non padding_idx) entries per bag;
#   max_indices   [num_bags, embedding_dim] argmax rows in max mode, an
#                 all-zero [num_bags] placeholder otherwise.
# The last three are bookkeeping the backward consumes; they are always
# materialized and always Int64, whatever index dtype the caller used.
# padding_idx = -1 disables padding-row exclusion.  scale_grad_by_freq divides
# each row's accumulated gradient by that row's own occurrence count in
# `indices`, the same inverse-frequency convention `embedding` uses.
- func: _embedding_bag(Tensor weight, Tensor indices, Tensor offsets, bool scale_grad_by_freq=False, int mode=0, bool sparse=False, Tensor? per_sample_weights=None, bool include_last_offset=False, int padding_idx=-1) -> (Tensor output, Tensor offset2bag, Tensor bag_size, Tensor max_indices)
  variants: function
  dispatch:
    CPU: _embedding_bag_cpu
    CUDA: _embedding_bag_cuda

# Same reduction with no autograd formula attached, for inference graphs that
# should not pay for the backward bookkeeping being kept alive.
- func: _embedding_bag_forward_only(Tensor weight, Tensor indices, Tensor offsets, bool scale_grad_by_freq=False, int mode=0, bool sparse=False, Tensor? per_sample_weights=None, bool include_last_offset=False, int padding_idx=-1) -> (Tensor output, Tensor offset2bag, Tensor bag_size, Tensor max_indices)
  variants: function
  dispatch:
    CPU: _embedding_bag_forward_only_cpu
    CUDA: _embedding_bag_forward_only_cuda

- func: _embedding_bag_dense_backward(Tensor grad, Tensor indices, Tensor offset2bag, Tensor bag_size, Tensor maximum_indices, int num_weights, bool scale_grad_by_freq, int mode, Tensor? per_sample_weights=None, int padding_idx=-1) -> Tensor
  variants: function
  dispatch:
    CPU: _embedding_bag_dense_backward_cpu
    CUDA: _embedding_bag_dense_backward_cuda

- func: _embedding_bag_per_sample_weights_backward(Tensor grad, Tensor weight, Tensor indices, Tensor offsets, Tensor offset2bag, int mode, int padding_idx=-1) -> Tensor
