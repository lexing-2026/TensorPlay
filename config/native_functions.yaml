# Decode-time LLM primitives.  These are inference-oriented native kernels:
# `silu_mul` is the elementwise SwiGLU epilogue, while `fused_rope` rotates Q
# and K in one launch.  `rotary_embedding` is the single-tensor form used by
# callers that do not have a Q/K pair.  The tables use interleaved pairs
# [x0, x1] and have shape [max_seq, head_dim / 2] (or [head_dim / 2]).
