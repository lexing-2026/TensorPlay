# Elementwise quantized arithmetic over Int8 tensors with explicit affine
# qparams: each operand is dequantized as (q - zero_point) * scale, the float
# operation is applied, and the result is requantized into [-128, 127] with
# q = clamp(nearbyint(y / out_scale) + out_zero_point).  Division by zero
# follows IEEE float rules in the dequantized domain.
