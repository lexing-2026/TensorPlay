# torch.gradient (ATen Gradient.cpp): upstream registers gradient.* with no
# dispatch section, i.e. the default CompositeImplicitAutograd -- forward is a
# pure composition of differentiable primitives (narrow/sub/mul/div/cat), no
# derivatives.yaml entry exists and every returned tensor keeps the grad_fn
# recorded by the inner calls (backward AND double-backward for free).  The
# same composition lives in backend/cpu/GradientKernels.cpp registered once
# under the backend-neutral Composite key; OperatorHandle::getKernel serves it
# to every dense backend until overridden (p10/include/Dispatcher.h).
# spacing/dim are non-optional lists on purpose: empty = "all dims with unit
# step"; the Python wrapper (functional.gradient) normalizes torch's scalar /
# tensor / tuple surface into these lists.
