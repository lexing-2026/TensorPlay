- name: adaptive_avg_pool3d(Tensor input, int[] output_size) -> Tensor
  input: adaptive_avg_pool3d_backward(grad, input)

- name: adaptive_avg_pool2d(Tensor input, int[] output_size) -> Tensor
  input: adaptive_avg_pool2d_backward_any(grad, input)

# backward scatters onto the saved indices instead of recomputing the argmax.
- name: adaptive_max_pool2d_with_indices(Tensor input, int[] output_size) -> (Tensor output, Tensor indices)
  input: adaptive_max_pool2d_with_indices_backward(grad, input, output_size, indices)

- name: adaptive_max_pool3d(Tensor input, int[] output_size) -> (Tensor output, Tensor indices)
  input: adaptive_max_pool3d_backward(grad, input, indices)
  output_differentiability: [True, False]

# argmax positions; kernel_size is unused by the backward.
- name: fractional_max_pool2d(Tensor self, int[] kernel_size, int[] output_size, Tensor random_samples) -> (Tensor output, Tensor indices)
  self: fractional_max_pool2d_backward(grad, self, kernel_size, output_size, indices)

- name: fractional_max_pool3d(Tensor self, int[] kernel_size, int[] output_size, Tensor random_samples) -> (Tensor output, Tensor indices)
  self: fractional_max_pool3d_backward(grad, self, kernel_size, output_size, indices)

# max_pool_double_backward (a gather of grad at the recorded indices); the
# native backward kernels implement exactly that gather. indices is int64 and
# therefore not differentiable.
- name: max_unpool2d(Tensor self, Tensor indices, int[] output_size) -> Tensor
  self: max_unpool2d_backward(grad, indices, output_size)

- name: max_unpool3d(Tensor self, Tensor indices, int[] output_size, int[] stride, int[] padding) -> Tensor
  self: max_unpool3d_backward(grad, indices, output_size)

# The backward kernels of the pooling family are linear in grad_output and read
# the forward input only for its shape or through the argmax indices, so their
# derivative in grad_output is the adjoint: the forward pool for averages, a
# gather at the saved indices for maxima, a scatter-add for unpooling.
- name: max_pool2d_with_indices_backward(Tensor grad_output, Tensor input, int[] kernel_size, int[] stride=[], int[] padding=[], int[] dilation=[], bool ceil_mode=false, Tensor? indices=None) -> Tensor
  grad_output: max_pool_with_indices_double_backward(grad, input, kernel_size, stride, padding, dilation, ceil_mode, indices, 2)
  input: zeros_like(input)

- name: max_pool3d_with_indices_backward(Tensor grad_output, Tensor input, int[] kernel_size, int[] stride=[], int[] padding=[], int[] dilation=[], bool ceil_mode=false, Tensor? indices=None) -> Tensor
  grad_output: max_pool_with_indices_double_backward(grad, input, kernel_size, stride, padding, dilation, ceil_mode, indices, 3)
  input: zeros_like(input)

- name: avg_pool2d_backward(Tensor grad_output, Tensor input, int[] kernel_size, int[] stride=[], int[] padding=[], bool ceil_mode=false, bool count_include_pad=true, int? divisor_override=None) -> Tensor
  grad_output: avg_pool2d(grad, kernel_size, stride, padding, ceil_mode, count_include_pad, divisor_override)
  input: zeros_like(input)

- name: avg_pool3d_backward(Tensor grad_output, Tensor input, int[] kernel_size, int[] stride=[], int[] padding=[], bool ceil_mode=false, bool count_include_pad=true, int? divisor_override=None) -> Tensor
  grad_output: avg_pool3d(grad, kernel_size, stride, padding, ceil_mode, count_include_pad, divisor_override)
  input: zeros_like(input)

- name: adaptive_avg_pool2d_backward(Tensor grad_output, Tensor input) -> Tensor
  grad_output: adaptive_avg_pool2d(grad, trailing_extents(grad_output.shape(), 2))
  input: zeros_like(input)

- name: adaptive_avg_pool3d_backward(Tensor grad_output, Tensor input) -> Tensor
  grad_output: adaptive_avg_pool3d(grad, trailing_extents(grad_output.shape(), 3))
  input: zeros_like(input)

- name: adaptive_max_pool2d_with_indices_backward(Tensor grad_output, Tensor input, int[] output_size, Tensor indices) -> Tensor
  grad_output: max_pool_double_backward(grad, indices, 2)
  input: zeros_like(input)

- name: adaptive_max_pool2d_backward(Tensor grad_output, Tensor input) -> Tensor
  grad_output: adaptive_max_pool2d_double_backward(grad, input, grad_output.shape())
  input: zeros_like(input)

# The scatter onto the saved positions; its derivative in grad_output is the
# adjoint gather at those same positions.
- name: adaptive_max_pool3d_backward(Tensor grad_output, Tensor input, Tensor indices) -> Tensor
  grad_output: max_pool_double_backward(grad, indices, 3)
  input: zeros_like(input)

- name: fractional_max_pool2d_backward(Tensor grad_output, Tensor self, int[] kernel_size, int[] output_size, Tensor indices) -> Tensor
  grad_output: max_pool_double_backward(grad, indices, 2)
  self: zeros_like(self)

- name: fractional_max_pool3d_backward(Tensor grad_output, Tensor self, int[] kernel_size, int[] output_size, Tensor indices) -> Tensor
  grad_output: max_pool_double_backward(grad, indices, 3)
  self: zeros_like(self)

- name: max_unpool2d_backward(Tensor grad_output, Tensor indices, int[] output_size) -> Tensor
  grad_output: max_pool_scatter(grad, indices, output_size, 2)

- name: max_unpool3d_backward(Tensor grad_output, Tensor indices, int[] output_size) -> Tensor
  grad_output: max_pool_scatter(grad, indices, output_size, 3)

# corresponding *_backward with an output_mask selecting the needed result.
# The masked-out slot is returned as zeros and never consumed.
- name: grid_sampler_2d(Tensor input, Tensor grid, int interpolation_mode, int padding_mode, bool align_corners) -> Tensor
  input: std::get<0>(grid_sampler_2d_backward(grad, input, grid, interpolation_mode, padding_mode, align_corners, grad_input_mask))
  grid: std::get<1>(grid_sampler_2d_backward(grad, input, grid, interpolation_mode, padding_mode, align_corners, grad_input_mask))

- name: grid_sampler_3d(Tensor input, Tensor grid, int interpolation_mode, int padding_mode, bool align_corners) -> Tensor
  input: std::get<0>(grid_sampler_3d_backward(grad, input, grid, interpolation_mode, padding_mode, align_corners, grad_input_mask))
  grid: std::get<1>(grid_sampler_3d_backward(grad, input, grid, interpolation_mode, padding_mode, align_corners, grad_input_mask))

- name: batch_norm(Tensor input, Tensor? weight, Tensor? bias, Tensor? running_mean, Tensor? running_var, bool training, float momentum, float eps) -> Tensor
  input: std::get<0>(batch_norm_backward(grad, input, weight, running_mean, running_var, training, eps))
  weight: std::get<1>(batch_norm_backward(grad, input, weight, running_mean, running_var, training, eps))
  bias: std::get<2>(batch_norm_backward(grad, input, weight, running_mean, running_var, training, eps))

