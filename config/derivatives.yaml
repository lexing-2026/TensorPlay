# Rank-generic convolution: one backward call per requested slot, with the
# output mask narrowing the work to exactly that slot.
- name: convolution(Tensor input, Tensor weight, Tensor? bias, int[] stride, int[] padding, int[] dilation, bool transposed, int[] output_padding, int groups) -> Tensor
  input: std::get<0>(convolution_backward(grad, input, weight, std::nullopt, stride, padding, dilation, transposed, output_padding, groups, {true, false, false}))
  weight: std::get<1>(convolution_backward(grad, input, weight, std::nullopt, stride, padding, dilation, transposed, output_padding, groups, {false, true, false}))
  bias: std::get<2>(convolution_backward(grad, input, weight, std::nullopt, stride, padding, dilation, transposed, output_padding, groups, {false, false, true}))

- name: convolution_overrideable(Tensor input, Tensor weight, Tensor? bias, int[] stride, int[] padding, int[] dilation, bool transposed, int[] output_padding, int groups) -> Tensor
  input: std::get<0>(convolution_backward_overrideable(grad, input, weight, stride, padding, dilation, transposed, output_padding, groups, {true, false, false}))
  weight: std::get<1>(convolution_backward_overrideable(grad, input, weight, stride, padding, dilation, transposed, output_padding, groups, {false, true, false}))
  bias: std::get<2>(convolution_backward_overrideable(grad, input, weight, stride, padding, dilation, transposed, output_padding, groups, {false, false, true}))

# Only the reduced rows carry a gradient; offset2bag / bag_size / max_indices
# are integer bookkeeping the two backward kernels read back.
- name: _embedding_bag(Tensor weight, Tensor indices, Tensor offsets, bool scale_grad_by_freq=False, int mode=0, bool sparse=False, Tensor? per_sample_weights=None, bool include_last_offset=False, int padding_idx=-1) -> (Tensor output, Tensor offset2bag, Tensor bag_size, Tensor max_indices)
  weight: _embedding_bag_dense_backward(grad, indices, offset2bag, bag_size, max_indices, weight.size(0), scale_grad_by_freq, mode, per_sample_weights, padding_idx)
  per_sample_weights: embedding_bag_psw_backward(grad, weight, indices, offsets, offset2bag, per_sample_weights, mode, padding_idx)

# The bag backward adds bag rows into table rows; the transpose reads table
# rows back into bags.  A per-sample weight's slope dots a bag row with a table
# row.
- name: _embedding_bag_dense_backward(Tensor grad_output, Tensor indices, Tensor offset2bag, Tensor bag_size, Tensor maximum_indices, SymInt num_weights, bool scale_grad_by_freq, int mode, Tensor? per_sample_weights=None, int padding_idx=-1) -> Tensor
  grad_output: embedding_bag_dense_double_backward(grad, indices, offset2bag, bag_size, maximum_indices, num_weights, scale_grad_by_freq, mode, per_sample_weights, padding_idx)
  per_sample_weights: embedding_bag_dense_double_backward_per_sample_weights(grad, grad_output, indices, offset2bag, num_weights, scale_grad_by_freq, mode, padding_idx)

# The per-sample-weight gradient dots each bag row with its table row, so its
# derivatives scatter the incoming per-position gradient the other way.
- name: _embedding_bag_per_sample_weights_backward(Tensor grad_output, Tensor weight, Tensor indices, Tensor offsets, Tensor offset2bag, int mode, int padding_idx=-1) -> Tensor
  grad_output: embedding_bag_psw_double_backward_grad_output(grad, weight, indices, offset2bag, grad_output.shape(), padding_idx)
  weight: embedding_bag_psw_double_backward_weight(grad, grad_output, indices, offset2bag, weight.shape(), padding_idx)

