# Each point of a pair moves its distance by the slope of the p-norm; the
# second operand's gradient is the same question asked the other way round.
- name: cdist(Tensor x1, Tensor x2, float p=2, *, int? compute_mode=None) -> Tensor
  x1: _cdist_backward(grad.contiguous(), x1, x2, p, result)
  x2: _cdist_backward(transpose(grad, -1, -2).contiguous(), x2, x1, p, transpose(result, -1, -2).contiguous())

