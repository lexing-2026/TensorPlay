# ---------------------------------------------------------------------------
# Activations / upsample — derivative formulas use
# self.sym_sizes() -> self.shape()).
# ---------------------------------------------------------------------------

- name: gelu(Tensor self, str approximate="none") -> Tensor
  self: tensorplay::tpx::ops::gelu_backward(grad, self, approximate)

- name: hardtanh(Tensor self, Scalar min_val=-1, Scalar max_val=1) -> Tensor
  self: hardtanh_backward(grad, self, min_val, max_val)

- name: relu6(Tensor self) -> Tensor
  self: hardtanh_backward(grad, self, 0, 6)

- name: hardswish(Tensor self) -> Tensor
  self: hardswish_backward(grad, self)

- name: sec(Tensor self) -> Tensor
  self: grad * self.sec().conj() * self.tan().conj()
  result: auto_element_wise

- name: csc(Tensor self) -> Tensor
  self: grad * -self.csc().conj() * self.cot().conj()
  result: auto_element_wise

- name: cot(Tensor self) -> Tensor
  self: grad * -self.csc().conj() * self.csc().conj()
  result: auto_element_wise

- name: tanhshrink(Tensor self) -> Tensor
  self: grad * self.tanh().conj() * self.tanh().conj()
  result: auto_element_wise

- name: squared_difference(Tensor self, Tensor other) -> Tensor
  self: grad * 2 * (self - other).conj()
  other: grad * -2 * (self - other).conj()

- name: swish(Tensor self) -> Tensor
  self: silu_backward_recordable(grad, self)

- name: hardsigmoid(Tensor self) -> Tensor
  self: hardsigmoid_backward(grad, self)

- name: matrix_exp(Tensor self) -> Tensor
  self: matrix_exp_backward(self, grad)

- name: linalg_matrix_exp(Tensor self) -> Tensor
  self: matrix_exp_backward(self, grad)

# Factorizations and solvers (LinalgBackward.h).  The pivots, the packed
# factors a solver hands back for reuse and the info codes carry no gradient.
- name: _linalg_det(Tensor A) -> (Tensor result, Tensor LU, Tensor pivots)
  A: linalg_det_backward(grad, result, A)
  output_differentiability: [True, False, False]

- name: linalg_inv_ex(Tensor A, *, bool check_errors=False) -> (Tensor result, Tensor info)
  A: linalg_inv_backward(grad, result)
  output_differentiability: [True, False]

- name: linalg_pinv.atol_rtol_tensor(Tensor self, *, Tensor? atol=None, Tensor? rtol=None, bool hermitian=False) -> Tensor
  self: pinv_backward(grad, result, self)

- name: linalg_lu_factor_ex(Tensor A, *, bool pivot=True, bool check_errors=False) -> (Tensor LU, Tensor pivots, Tensor info)
  A: lu_factor_ex_backward(grad, LU, pivots, pivot)
  output_differentiability: [True, False, False]

- name: linalg_lu_solve(Tensor LU, Tensor pivots, Tensor B, *, bool left=True, bool adjoint=False) -> Tensor
  LU: linalg_lu_solve_LU(grad, LU, pivots, result, left, adjoint)
  B: linalg_lu_solve_B(grad, LU, pivots, left, adjoint)

- name: _linalg_solve_ex(Tensor A, Tensor B, *, bool left=True, bool check_errors=False) -> (Tensor result, Tensor LU, Tensor pivots, Tensor info)
  A: std::get<0>(linalg_solve_backward(grad, result, A, B, LU, pivots, left, grad_input_mask))
  B: std::get<1>(linalg_solve_backward(grad, result, A, B, LU, pivots, left, grad_input_mask))
  output_differentiability: [True, False, False, False]

- name: linalg_solve_triangular(Tensor A, Tensor B, *, bool upper, bool left=True, bool unitriangular=False) -> Tensor
  A: std::get<0>(linalg_solve_triangular_backward(grad, A, result, upper, left, unitriangular, grad_input_mask))
  B: std::get<1>(linalg_solve_triangular_backward(grad, A, result, upper, left, unitriangular, grad_input_mask))

- name: linalg_cholesky_ex(Tensor A, *, bool upper=False, bool check_errors=False) -> (Tensor L, Tensor info)
  A: cholesky_backward(grad, upper, L)
  output_differentiability: [True, False]

- name: cholesky(Tensor self, bool upper=False) -> Tensor
  self: cholesky_backward(grad, upper, result)

- name: cholesky_solve(Tensor self, Tensor input2, bool upper=False) -> Tensor
  self: std::get<0>(cholesky_solve_backward(grad, self, input2, result, upper, grad_input_mask))
  input2: std::get<1>(cholesky_solve_backward(grad, self, input2, result, upper, grad_input_mask))

- name: cholesky_inverse(Tensor self, bool upper=False) -> Tensor
  self: cholesky_inverse_backward(grad, self, upper, result)

- name: prelu(Tensor self, Tensor weight) -> Tensor
  self: std::get<0>(prelu_backward(grad, self, weight))
  weight: std::get<1>(prelu_backward(grad, self, weight))

- name: leaky_relu(Tensor self, Scalar negative_slope=0.01) -> Tensor
  self: leaky_relu_backward(grad, self, negative_slope, false)

# Scalar upper=0.3333333333333333, bool training=False, bool inplace=False)
- name: rrelu_with_noise(Tensor self, Tensor(b!) noise, Scalar lower=0.125, Scalar upper=0.3333333333333333, bool training=False, Generator? generator=None) -> Tensor
  self: rrelu_with_noise_backward(grad, self, noise, lower, upper, training, false)
  result: auto_element_wise

# In-place overloads share the functional node; ``self`` is the value
# captured before the update, so the formula is the functional one.
- name: rrelu_with_noise_(Tensor(a!) self, Tensor(b!) noise, Scalar lower=0.125, Scalar upper=0.3333333333333333, bool training=False, Generator? generator=None) -> Tensor(a!)
  self: rrelu_with_noise_backward(grad, self, noise, lower, upper, training, false)

# self_is_result is false here: the second pass differentiates an
# out-of-place call whose self is the input itself.
- name: rrelu_with_noise_backward(Tensor grad_output, Tensor self, Tensor noise, Scalar lower, Scalar upper, bool training, bool self_is_result) -> Tensor
  grad_output: rrelu_with_noise_backward(grad, self, noise, lower, upper, training, false)
  self: zeros_like(grad)

# the numerically stable branch split (no exp overflow for large |self|).
- name: log_sigmoid(Tensor self) -> Tensor
  self: log_sigmoid_backward(grad, self)

- name: elu(Tensor self, Scalar alpha=1, Scalar scale=1, Scalar input_scale=1) -> Tensor
  self: elu_backward(grad, alpha, scale, input_scale, false, self)

- name: celu(Tensor self, Scalar alpha=1.0) -> Tensor
