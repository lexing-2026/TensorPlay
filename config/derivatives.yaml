- name: upsample_linear1d(Tensor self, int[] output_size, bool align_corners, float? scales=None) -> Tensor
  self: upsample_linear1d_backward(grad, output_size, self.shape(), align_corners, scales)

- name: upsample_bilinear2d(Tensor self, int[] output_size, bool align_corners, float? scales_h=None, float? scales_w=None) -> Tensor
  self: upsample_bilinear2d_backward(grad, output_size, self.shape(), align_corners, scales_h, scales_w)

- name: upsample_bicubic2d(Tensor self, int[] output_size, bool align_corners, float? scales_h=None, float? scales_w=None) -> Tensor
  self: upsample_bicubic2d_backward(grad, output_size, self.shape(), align_corners, scales_h, scales_w)

- name: upsample_trilinear3d(Tensor self, int[] output_size, bool align_corners, float? scales_d=None, float? scales_h=None, float? scales_w=None) -> Tensor
  self: upsample_trilinear3d_backward(grad, output_size, self.shape(), align_corners, scales_d, scales_h, scales_w)

# ATen expresses masked_fill's derivative as masked_fill(grad, mask, 0).
- name: masked_fill(Tensor self, Tensor mask, Scalar value) -> Tensor
  self: masked_fill(grad, mask, 0)

# ===========================================================================
# Tier-1 indexing/masking/scan autograd rules. Formulas follow
# third_party/pytorch/tools/autograd/derivatives.yaml (cited per entry),
# expressed with TensorPlay-native operators.
# ===========================================================================

# derivatives.yaml:1096 grad.masked_fill(mask, 0)
- name: masked_fill(Tensor self, Tensor mask, Scalar value) -> Tensor
  self: grad.masked_fill(mask, 0)

# derivatives.yaml:1096 (in-place shares the functional rule)
- name: masked_fill_(Tensor(a!) self, Tensor mask, Scalar value) -> Tensor(a!)
  self: grad.masked_fill(mask, 0)

# derivatives.yaml:1101 (value grad omitted: needs masked_fill_backward helper)
- name: masked_fill.Tensor(Tensor self, Tensor mask, Tensor value) -> Tensor
  self: grad.masked_fill(mask, 0)

# derivatives.yaml:1818/1822
- name: tril(Tensor self, int diagonal=0) -> Tensor
  self: grad.tril(diagonal)

- name: triu(Tensor self, int diagonal=0) -> Tensor
  self: grad.triu(diagonal)

# derivatives.yaml:531 + torch/csrc/autograd/FunctionsManual.cpp:1136
# cumsum_backward = grad.flip(dim).cumsum(dim).flip(dim)
- name: cumsum(Tensor self, int dim, ScalarType? dtype=None) -> Tensor
  self: tensorplay::tpx::ops::flip(tensorplay::tpx::ops::cumsum(tensorplay::tpx::ops::flip(grad, {dim}), dim), {dim})

# gather_backward composite (TensorAdvancedIndexing.cpp:2118):
# new_zeros(self.sizes()).scatter_add_(dim, index, grad)
- name: gather(Tensor self, int dim, Tensor index) -> Tensor
  self: zeros_like(self).scatter_add(dim, index, grad)

# derivatives.yaml:1529-1531
- name: scatter_add(Tensor self, int dim, Tensor index, Tensor src) -> Tensor
  self: grad
  src: grad.gather(dim, index)

# index_select_backward composite: zeros(input_sizes).index_add(dim, index, grad)
- name: index_select(Tensor self, int dim, Tensor index) -> Tensor
  self: zeros_like(self).index_add(dim, index, grad)

# derivatives.yaml:864+ self: grad; source: grad.index_select(dim, index)
- name: index_add(Tensor self, int dim, Tensor index, Tensor source) -> Tensor
  self: grad
  source: tensorplay::tpx::ops::index_select(grad, dim, index)

# ===========================================================================
# Tier 2-4 autograd rules. Formulas follow
# third_party/pytorch/tools/autograd/derivatives.yaml where expressible with
# TensorPlay-native operators; otherwise omitted (no entry = no autograd).
# ===========================================================================

# derivatives.yaml rsub: other - alpha*self
- name: rsub.Tensor(Tensor self, Tensor other, Scalar alpha=1) -> Tensor
  self: neg(grad) * alpha
  other: grad

- name: rsub.Scalar(Tensor self, Scalar other, Scalar alpha=1) -> Tensor
  self: neg(grad) * alpha

# BinaryOps.cpp true_divide shares div's rules.
- name: true_divide.Tensor(Tensor self, Tensor other) -> Tensor
  self: grad / other
  other: -(grad * result) / other

- name: divide.Tensor(Tensor self, Tensor other) -> Tensor
  self: grad / other
  other: -(grad * result) / other

- name: multiply.Tensor(Tensor self, Tensor other) -> Tensor
  self: grad * other
  other: grad * self

- name: multiply.Scalar(Tensor self, Scalar other) -> Tensor
  self: grad * other

- name: negative(Tensor self) -> Tensor
  self: -grad

- name: positive(Tensor self) -> Tensor
  self: grad

# BinaryOps.cpp fmod: d/dother = -grad * trunc(self/other)
- name: fmod.Tensor(Tensor self, Tensor other) -> Tensor
  self: grad
  other: -(trunc(self / other) * grad)

# UnaryOps.cpp reciprocal: -grad / self^2
- name: reciprocal(Tensor self) -> Tensor
  self: -grad / (self * self)

- name: exp2(Tensor self) -> Tensor
  self: grad * result * 0.69314718055994530942

- name: xlogy.Tensor(Tensor self, Tensor other) -> Tensor
  self: grad * log(other)
  other: self * grad / other

# BinaryOps.cpp logaddexp
- name: logaddexp(Tensor self, Tensor other) -> Tensor
  self: grad * sigmoid(self - other)
  other: grad * sigmoid(other - self)

- name: hypot(Tensor self, Tensor other) -> Tensor
  self: grad * self / result
  other: grad * other / result

- name: deg2rad(Tensor self) -> Tensor
  self: grad * 0.01745329251994329577

- name: rad2deg(Tensor self) -> Tensor
  self: grad * 57.29577951308232087680

# Activation.cpp hardshrink/softshrink masks
# ATen: hardshrink_backward(grad, self, lambd); expressed with dispatched
# primitives as relu(sign(abs(self) - lambd)) == strict (abs > lambd) mask.
- name: hardshrink(Tensor self, Scalar lambd=0.5) -> Tensor
  self: grad * relu(sign(abs(self) - lambd))

- name: softshrink(Tensor self, Scalar lambd=0.5) -> Tensor
  self: grad * sign(self) * relu(sign(abs(self) - lambd))

# Activation.cpp:525 selu / :541 celu
- name: selu(Tensor self) -> Tensor
  self: grad * (self > 0) * 1.0507009873554804934193349852946 + grad * (self <= 0) * (self * 1.0507009873554804934193349852946 * 1.6732632423543772848170429916717).exp()

- name: celu(Tensor self, Scalar alpha=1.0) -> Tensor
  self: grad * (self > 0) + grad * (self <= 0) * ((self / alpha).exp() * alpha / alpha)

# threshold_backward(grad, self, threshold), mirrors clamp_backward style
- name: threshold(Tensor self, Scalar threshold, Scalar value) -> Tensor
  self: threshold_backward(grad, self, threshold)

# clamp_min/clamp_max via comparisons (NaN caveat vs ATen helpers noted)
- name: clamp_min.Scalar(Tensor self, Scalar min) -> Tensor
  self: grad * (self >= min)

- name: clamp_max.Scalar(Tensor self, Scalar max) -> Tensor
  self: grad * (self <= max)

- name: clamp_min.Tensor(Tensor self, Tensor min) -> Tensor
  self: grad * (self >= min)

- name: clamp_max.Tensor(Tensor self, Tensor max) -> Tensor
  self: grad * (self <= max)

# TensorTransformations.cpp:36 flip is an involution.
- name: flip(Tensor self, int[] dims) -> Tensor
  self: grad.flip(dims)

# PixelShuffle.cpp pair are inverses of each other.
- name: pixel_shuffle(Tensor self, int upscale_factor) -> Tensor
  self: tensorplay::tpx::ops::pixel_unshuffle(grad, upscale_factor)

- name: pixel_unshuffle(Tensor self, int downscale_factor) -> Tensor
  self: tensorplay::tpx::ops::pixel_shuffle(grad, downscale_factor)

# ReduceOps.cpp:1578 logsumexp
- name: logsumexp(Tensor self, int dim, bool keepdim=false) -> Tensor
  self: grad * exp(self - unsqueeze(result, dim))

# ===========================================================================
# Tier 5 autograd rules (only formulas expressible with native ops; linalg
# decompositions and RNN cells have no derivative entries yet).
# ===========================================================================

# ComplexHelper: conj is its own inverse on the gradient.
- name: conj(Tensor self) -> Tensor
  self: grad.conj()

# polar(r, theta) = r * exp(i*theta): dr = cos(theta)*grad; dtheta = -r*sin(theta)*grad
- name: polar(Tensor abs_, Tensor angle) -> Tensor
  abs_: grad * cos(angle)
  angle: -(abs_ * grad * sin(angle))

