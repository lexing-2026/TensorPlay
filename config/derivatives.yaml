# Loss / helpers
# cross_entropy_loss composes log_softmax + nll through the composite kernel,
# so differentiation records the inner ops (no explicit backward node).

- name: segment_reduce(Tensor data, str reduce, *, Tensor? lengths=None, Tensor? indices=None, Tensor? offsets=None, int axis=0, bool unsafe=False, Scalar? initial=None) -> Tensor
  data: _segment_reduce_backward(grad, result, data, reduce, lengths, offsets, axis, initial)

# The scatter's slope depends only on the data, so the transpose contracts
# grad against the slope the same kernel produces for a unit gradient; the
# scatter itself is a step function of the reduced result.
- name: _segment_reduce_backward(Tensor grad_output, Tensor output, Tensor data, str reduce, *, Tensor? lengths=None, Tensor? offsets=None, int axis=0, Scalar? initial=None) -> Tensor
  grad_output: segment_reduce_backward_grad_output(grad, output, data, reduce, lengths, offsets, axis, initial)
  output: zeros_like(output)
  data: segment_reduce_backward_data(data, reduce)

- name: _trilinear(Tensor i1, Tensor i2, Tensor i3, int[] expand1, int[] expand2, int[] expand3, int[] sumdim, int unroll_dim=1) -> Tensor
  i1: std::get<0>(_trilinear_backward(grad, i1, i2, i3, expand1, expand2, expand3, sumdim, {true, false, false}))
  i2: std::get<1>(_trilinear_backward(grad, i1, i2, i3, expand1, expand2, expand3, sumdim, {false, true, false}))
  i3: std::get<2>(_trilinear_backward(grad, i1, i2, i3, expand1, expand2, expand3, sumdim, {false, false, true}))

