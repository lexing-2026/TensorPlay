  self: zeros_like(self).index_add(dim, index, grad)

# derivatives.yaml:864+ self: grad; source: grad.index_select(dim, index)
- name: index_add(Tensor self, int dim, Tensor index, Tensor source) -> Tensor
  self: grad
  source: tensorplay::tpx::ops::index_select(grad, dim, index)

# ===========================================================================
# Tier 2-4 autograd rules. Formulas follow
# TensorPlay-native operators; otherwise omitted (no entry = no autograd).
# ===========================================================================

# derivatives.yaml rsub: other - alpha*self
- name: rsub.Tensor(Tensor self, Tensor other, Scalar alpha=1) -> Tensor
  self: neg(grad) * alpha
  other: grad

- name: rsub.Scalar(Tensor self, Scalar other, Scalar alpha=1) -> Tensor
  self: neg(grad) * alpha

# BinaryOps.cpp true_divide shares div's rules.
- name: true_divide.Tensor(Tensor self, Tensor other) -> Tensor
  self: grad / other
  other: -(grad * result) / other

- name: divide.Tensor(Tensor self, Tensor other) -> Tensor
  self: div_tensor_self_backward(grad, other, self.dtype())
  other: div_tensor_other_backward(grad, self, other)

- name: divide.Scalar(Tensor self, Scalar other) -> Tensor
  self: grad / scalar_conj_if_complex(other)

- name: true_divide.Scalar(Tensor self, Scalar other) -> Tensor
  self: grad / scalar_conj_if_complex(other)

# A rounded quotient is locally constant, so the mode-taking overloads only
# carry a gradient when no mode was given.
- name: div.Tensor_mode(Tensor self, Tensor other, *, str? rounding_mode) -> Tensor
  self: div_tensor_self_backward(grad, other, self.dtype(), rounding_mode)
  other: div_tensor_other_backward(grad, self, other, rounding_mode)

- name: div.Scalar_mode(Tensor self, Scalar other, *, str? rounding_mode) -> Tensor
  self: div_tensor_self_backward(grad, other, self.dtype(), rounding_mode)

- name: divide.Tensor_mode(Tensor self, Tensor other, *, str? rounding_mode) -> Tensor
  self: div_tensor_self_backward(grad, other, self.dtype(), rounding_mode)
  other: div_tensor_other_backward(grad, self, other, rounding_mode)

- name: divide.Scalar_mode(Tensor self, Scalar other, *, str? rounding_mode) -> Tensor
  self: div_tensor_self_backward(grad, other, self.dtype(), rounding_mode)

- name: subtract.Tensor(Tensor self, Tensor other, *, Scalar alpha=1) -> Tensor
  self: grad
  other: maybe_multiply(grad.neg(), alpha)

- name: subtract.Scalar(Tensor self, Scalar other, Scalar alpha=1) -> Tensor
  self: grad

# The divisor moves the result by one whole multiple per unit step, and the
# multiple is the floored (remainder) or truncated (fmod) quotient.
- name: remainder.Tensor(Tensor self, Tensor other) -> Tensor
  self: grad
  other: -(grad * floor(self / other))

- name: remainder.Scalar(Tensor self, Scalar other) -> Tensor
  self: grad

- name: fmod.Scalar(Tensor self, Scalar other) -> Tensor
  self: grad

# copysign transplants a sign and nothing else, so the gradient comes back
# with whichever sign the result took.
- name: copysign.Tensor(Tensor self, Tensor other) -> Tensor
  self: copysign_tensor_self_backward(grad, self, result)
  other: zeros_like(other)

- name: copysign.Scalar(Tensor self, Scalar other) -> Tensor
  self: copysign_tensor_self_backward(grad, self, result)

- name: multiply.Tensor(Tensor self, Tensor other) -> Tensor
  self: mul_tensor_backward(grad, other, self.dtype())
  other: mul_tensor_backward(grad, self, other.dtype())

- name: multiply.Scalar(Tensor self, Scalar other) -> Tensor
  self: grad * scalar_conj_if_complex(other)

- name: negative(Tensor self) -> Tensor
  self: -grad

- name: positive(Tensor self) -> Tensor
  self: grad

# BinaryOps.cpp fmod: d/dother = -grad * trunc(self/other)
- name: fmod.Tensor(Tensor self, Tensor other) -> Tensor
  self: grad
  other: -(trunc(self / other) * grad)

# UnaryOps.cpp reciprocal: -grad / self^2
- name: reciprocal(Tensor self) -> Tensor
  self: -grad * (result * result).conj()

- name: exp2(Tensor self) -> Tensor
  self: grad * (result.conj() * 0.6931471805599453)

- name: xlogy(Tensor self, Tensor other) -> Tensor
  self: where(logical_and(eq(self, 0), le(other, 0)), zeros_like(grad), xlogy(grad, other))
  other: self * grad / other

- name: xlog1py(Tensor self, Tensor other) -> Tensor
  self: where(logical_and(eq(self, 0), le(other, -1)), zeros_like(grad), xlog1py(grad, other))
  other: self * grad / (other + 1)

# BinaryOps.cpp logaddexp
- name: logaddexp(Tensor self, Tensor other) -> Tensor
  self: grad * sigmoid(self - other)
  other: grad * sigmoid(other - self)

- name: hypot(Tensor self, Tensor other) -> Tensor
  self: grad * self / result
  other: grad * other / result

- name: deg2rad(Tensor self) -> Tensor
  self: grad * 0.01745329251994329577

- name: rad2deg(Tensor self) -> Tensor
  self: grad * 57.29577951308232087680

# shrink_backward_kernel ((self >= -lambd && self <= lambd) ? 0 : grad),
# exposed here as the native hardshrink_backward / softshrink_backward ops.
- name: hardshrink(Tensor self, Scalar lambd=0.5) -> Tensor
  self: hardshrink_backward(grad, self, lambd)

- name: softshrink(Tensor self, Scalar lambd=0.5) -> Tensor
  self: softshrink_backward(grad, self, lambd)

# Activation.cpp:525 selu / :541 celu
- name: selu(Tensor self) -> Tensor
  self: grad * (self > 0) * 1.0507009873554804934193349852946 + grad * (self <= 0) * (self * 1.0507009873554804934193349852946 * 1.6732632423543772848170429916717).exp()

- name: celu(Tensor self, Scalar alpha=1.0) -> Tensor
  self: grad * (self > 0) + grad * (self <= 0) * ((self / alpha).exp() * alpha / alpha)

# threshold_backward(grad, self, threshold) uses the same threshold rule.
- name: threshold(Tensor self, Scalar threshold, Scalar value) -> Tensor
  self: threshold_backward(grad, self, threshold)

- name: clamp_min.Scalar(Tensor self, Scalar min) -> Tensor
  self: grad * (self >= min)

- name: clamp_max.Scalar(Tensor self, Scalar max) -> Tensor
  self: grad * (self <= max)

# Both operands are differentiable here, and a tie belongs to neither alone:
# the gradient splits evenly where self and the bound coincide.
- name: clamp_min.Tensor(Tensor self, Tensor min) -> Tensor
  self: where(self < min, zeros_like(grad), where(eq(self, min), grad / 2, grad))
  min: where(self > min, zeros_like(grad), where(eq(self, min), grad / 2, grad))

- name: clamp_max.Tensor(Tensor self, Tensor max) -> Tensor
  self: where(self > max, zeros_like(grad), where(eq(self, max), grad / 2, grad))
  max: where(self < max, zeros_like(grad), where(eq(self, max), grad / 2, grad))

# TensorTransformations.cpp:36 flip is an involution.
- name: flip(Tensor self, int[] dims) -> Tensor
  self: grad.flip(dims)

# PixelShuffle.cpp pair are inverses of each other.
- name: pixel_shuffle(Tensor self, int upscale_factor) -> Tensor
  self: tensorplay::tpx::ops::pixel_unshuffle(grad, upscale_factor)

- name: pixel_unshuffle(Tensor self, int downscale_factor) -> Tensor
  self: tensorplay::tpx::ops::pixel_shuffle(grad, downscale_factor)

# ReduceOps.cpp:1578 logsumexp
- name: logsumexp(Tensor self, int dim, bool keepdim=false) -> Tensor
  self: grad * exp(self - unsqueeze(result, dim))

# ===========================================================================
# Tier 5 autograd rules (only formulas expressible with native ops; linalg
# decompositions and RNN cells have no derivative entries yet).
# ===========================================================================

# ComplexHelper: conj is its own inverse on the gradient.
- name: conj(Tensor self) -> Tensor
  self: grad.conj()

# adjoint is transpose(-2,-1) composed with conj; both are self-inverse on
- name: adjoint(Tensor self) -> Tensor
  self: grad.adjoint()

# polar(r, theta) = r * exp(i*theta): dr = cos(theta)*grad; dtheta = -r*sin(theta)*grad
- name: polar(Tensor abs_, Tensor angle) -> Tensor
  abs_: grad * cos(angle)
  angle: -(abs_ * grad * sin(angle))

