# ATen: selu is elu with fixed constants; torch's derivatives.yaml expresses it
# through elu_backward(scale=lambda, alpha=lambda*alpha_, input_scale=1).
- name: selu(Tensor self) -> Tensor
  self: elu_backward(grad, 1.6732632423543772848170429916717, 1.0507009873554804934193349852946, 1, false, self)

# ATen: - name: softplus(Tensor self, Scalar beta=1, Scalar threshold=20)
- name: softplus(Tensor self, Scalar beta=1, Scalar threshold=20) -> Tensor
  self: softplus_backward(grad, self, beta, threshold)

# ATen: - name: glu(Tensor self, int dim=-1) -> Tensor
- name: glu(Tensor self, int dim=-1) -> Tensor
