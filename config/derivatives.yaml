- name: permute(Tensor self, int[] dims) -> Tensor
  self: tensorplay::tpx::ops::permute_backward(grad, self, dims)

- name: squeeze(Tensor self) -> Tensor
  self: tensorplay::tpx::ops::squeeze_backward(grad, self)

- name: squeeze.dim(Tensor self, int dim) -> Tensor
  self: unsqueeze_to(grad, {dim}, self.shape())

- name: squeeze.dims(Tensor self, int[] dim) -> Tensor
  self: unsqueeze_to(grad, dim, self.shape())

- name: unsqueeze(Tensor self, int dim) -> Tensor
  self: grad.squeeze(dim)

- name: transpose(Tensor self, int dim0, int dim1) -> Tensor
  self: grad.transpose(dim0, dim1)

- name: t(Tensor self) -> Tensor
  self: grad.t()

# The complex optimizer path uses the same storage-reinterpretation views as
# views, so higher-order optimizer differentiation does not insert a copy.
- name: view_as_real(Tensor self) -> Tensor
  self: tensorplay::tpx::ops::view_as_complex(grad)

- name: view_as_complex(Tensor self) -> Tensor
  self: tensorplay::tpx::ops::view_as_real(grad)

# backward node and the scale folds in here. F.dropout rejects p == 1
# the denominator is never zero, so 1 - p is never zero.
- name: native_dropout(Tensor input, float p) -> (Tensor output, Tensor mask)
  input: native_dropout_backward(grad, mask, 1.0 / (1.0 - p))

# Alpha dropout keeps the kept-elements slope at `a`; the affine offset b
# contributes no gradient. a = 1/sqrt((alpha^2 p + 1)(1 - p)) is recomputed
# in the backward kernel from the scalar p.
- name: native_alpha_dropout(Tensor input, float p) -> (Tensor output, Tensor mask)
  input: _alpha_dropout_backward(grad, mask, p)

- name: native_feature_dropout(Tensor input, float p) -> (Tensor output, Tensor mask)
  input: _feature_dropout_backward(grad, mask, p)

- name: add.Tensor(Tensor self, Tensor other, *, Scalar alpha=1) -> Tensor
  self: grad
  other: maybe_multiply(grad, alpha)

# implementations.  Keep the same backward formulas as the functional
# overloads; the generated wrapper attaches the new history to the mutated
# non-leaf tensor and rejects leaf mutation under GradMode.
- name: add_.Tensor(Tensor(a!) self, Tensor other, *, Scalar alpha=1) -> Tensor(a!)
  self: grad
  other: maybe_multiply(grad, alpha)

- name: add_.Scalar(Tensor(a!) self, Scalar other, Scalar alpha=1) -> Tensor(a!)
  self: grad

# materializes the ReLU mask from the output in its backward graph.  The
# TensorPlay native primitive has the same output contract for the equal-shape
# residual case used by ResNet.
- name: add_relu(Tensor self, Tensor other) -> Tensor
  self: threshold_backward(grad, result, 0)
  other: threshold_backward(grad, result, 0)

# Cross.cpp/CrossKernel.cpp use the same conjugate-aware formulas as
# default while delegating the actual three-component calculation to the same
# native backend kernel.
- name: cross(Tensor self, Tensor other, int? dim=None) -> Tensor
  self: tensorplay::tpx::ops::cross(tensorplay::tpx::ops::conj(other), grad, dim)
  other: tensorplay::tpx::ops::cross(grad, tensorplay::tpx::ops::conj(self), dim)

- name: linalg_cross(Tensor self, Tensor other, int dim=-1) -> Tensor
  self: tensorplay::tpx::ops::linalg_cross(tensorplay::tpx::ops::conj(other), grad, dim)
  other: tensorplay::tpx::ops::linalg_cross(grad, tensorplay::tpx::ops::conj(self), dim)

- name: sub.Tensor(Tensor self, Tensor other, *, Scalar alpha=1) -> Tensor
  self: grad
  other: maybe_multiply(grad.neg(), alpha)

- name: sub_.Tensor(Tensor(a!) self, Tensor other, *, Scalar alpha=1) -> Tensor(a!)
  self: grad
  other: maybe_multiply(grad.neg(), alpha)

- name: sub_.Scalar(Tensor(a!) self, Scalar other, Scalar alpha=1) -> Tensor(a!)
  self: grad

- name: mul.Tensor(Tensor self, Tensor other) -> Tensor
  self: mul_tensor_backward(grad, other, self.dtype())
  other: mul_tensor_backward(grad, self, other.dtype())

- name: mul_.Tensor(Tensor(a!) self, Tensor other) -> Tensor(a!)
  self: grad * ops::conj(other)
  other: grad * ops::conj(self)

- name: mul_.Scalar(Tensor(a!) self, Scalar other) -> Tensor(a!)
  self: grad * scalar_conj_if_complex(other)

- name: div.Tensor(Tensor self, Tensor other) -> Tensor
  self: div_tensor_self_backward(grad, other, self.dtype())
  other: div_tensor_other_backward(grad, self, other)

- name: div_.Tensor(Tensor(a!) self, Tensor other) -> Tensor(a!)
  self: grad / ops::conj(other)
  other: -(grad * self) * ops::conj(self / other / other)

- name: div_.Scalar(Tensor(a!) self, Scalar other) -> Tensor(a!)
  self: grad / scalar_conj_if_complex(other)

- name: addcmul(Tensor self, Tensor tensor1, Tensor tensor2, *, Scalar value=1) -> Tensor
  self: grad
  tensor1: grad * tensor2 * value
  tensor2: grad * tensor1 * value

- name: addcmul_(Tensor(a!) self, Tensor tensor1, Tensor tensor2, *, Scalar value=1) -> Tensor(a!)
  self: grad
  tensor1: grad * tensor2 * value
  tensor2: grad * tensor1 * value

- name: addcdiv(Tensor self, Tensor tensor1, Tensor tensor2, *, Scalar value=1) -> Tensor
  self: grad
  tensor1: grad / tensor2 * value
  tensor2: -grad * tensor1 / (tensor2 * tensor2) * value

- name: addcdiv_(Tensor(a!) self, Tensor tensor1, Tensor tensor2, *, Scalar value=1) -> Tensor(a!)
  self: grad
  tensor1: grad / tensor2 * value
  tensor2: -grad * tensor1 / (tensor2 * tensor2) * value

- name: where.self(Tensor condition, Tensor self, Tensor other) -> Tensor
  self: where(condition, grad, zeros_like(self))
  other: where(condition, zeros_like(other), grad)

- name: where.ScalarSelf(Tensor condition, Scalar self, Tensor other) -> Tensor
  other: where(condition, zeros_like(other), grad)

- name: where.ScalarOther(Tensor condition, Tensor self, Scalar other) -> Tensor
  self: where(condition, grad, zeros_like(self))

- name: maximum(Tensor self, Tensor other) -> Tensor
  self: where(eq(self, other), grad / 2, where(gt(self, other), grad, zeros_like(self)))
  other: where(eq(self, other), grad / 2, where(lt(self, other), grad, zeros_like(other)))

- name: minimum(Tensor self, Tensor other) -> Tensor
  self: where(eq(self, other), grad / 2, where(lt(self, other), grad, zeros_like(self)))
  other: where(eq(self, other), grad / 2, where(gt(self, other), grad, zeros_like(other)))

- name: fused_mul_add(Tensor self, Tensor other, Tensor addend) -> Tensor
  self: grad * other
  other: grad * self
  addend: grad

- name: fused_mul_add.Scalar(Tensor self, Scalar other, Scalar addend) -> Tensor
  self: grad * other

- name: neg(Tensor self) -> Tensor
  self: grad.neg()

- name: add.Scalar(Tensor self, Scalar other, Scalar alpha=1) -> Tensor
  self: grad

- name: clamp(Tensor self, Scalar? min=None, Scalar? max=None) -> Tensor
  self: clamp_backward(grad, self, min, max)

# Explicit derivative formulas for generated autograd nodes.
- name: clamp_min(Tensor self, Scalar min) -> Tensor
  self: where(self > min, grad, zeros_like(self))

- name: clamp_max(Tensor self, Scalar max) -> Tensor
  self: where(self < max, grad, zeros_like(self))

- name: clamp_min_(Tensor(a!) self, Scalar min) -> Tensor(a!)
  self: where(self > min, grad, zeros_like(self))

- name: clamp_max_(Tensor(a!) self, Scalar max) -> Tensor(a!)
  self: where(self < max, grad, zeros_like(self))

- name: sub.Scalar(Tensor self, Scalar other, Scalar alpha=1) -> Tensor
  self: grad

- name: mul.Scalar(Tensor self, Scalar other) -> Tensor
  self: grad * scalar_conj_if_complex(other)

- name: div.Scalar(Tensor self, Scalar other) -> Tensor
  self: grad / scalar_conj_if_complex(other)

- name: embedding(Tensor weight, Tensor indices, int padding_idx=-1, bool scale_grad_by_freq=false, bool sparse=false) -> Tensor
  weight: tensorplay::tpx::ops::embedding_dense_backward(grad, indices, weight.size(0), padding_idx, scale_grad_by_freq)

# (tools/autograd/derivatives.yaml): reshape falls back to a copy when the
# incoming grad is not viewable, so non-contiguous grads never error here.
- name: view(Tensor self, int[] shape) -> Tensor
  self: grad.reshape(self.shape())

- name: clone(Tensor self, *, MemoryFormat? memory_format=None) -> Tensor
  self: grad

- name: contiguous(Tensor self, *, MemoryFormat memory_format=Contiguous) -> Tensor
  self: grad

- name: select.int(Tensor self, int dim, SymInt index) -> Tensor
  self: tensorplay::tpx::ops::select_backward(grad, self, dim, index)

- name: slice(Tensor self, int dim=0, int? start=None, int? end=None, int step=1) -> Tensor
  self: tensorplay::tpx::ops::slice_backward(grad, self, dim, start, end, step)

# The two scatter-back ops above are linear in grad_output, and their own
# derivative is the gather they undo.  Without these entries the chain stops
# at the backward node: a second derivative taken through select/slice/narrow
# would come back as zeros rather than as an error.
- name: select_backward(Tensor grad_output, Tensor self, int dim, int index) -> Tensor
  grad_output: tensorplay::tpx::ops::select(grad, dim, index)

- name: slice_backward(Tensor grad_output, Tensor self, int dim=0, int? start=None, int? end=None, int step=1) -> Tensor
  grad_output: tensorplay::tpx::ops::slice(grad, dim, start, end, step)

# Narrow is a slice(dim, start, start+length);
# our kernel materializes the slice view, backward reuses the slice formula.
- name: narrow(Tensor self, int dim, int start, int length) -> Tensor
  self: tensorplay::tpx::ops::slice_backward(grad, self, dim, start, start + length, 1)

# windows scattered back onto `dim`, accumulating where step < size overlaps.
- name: unfold(Tensor self, int dimension, int size, int step) -> Tensor
  self: unfold_backward(grad, self.shape(), dimension, size, step)

# Unflatten is a view; backward is the
# inverse reshape, recorded through reshape's own derivative.
- name: unflatten.int(Tensor self, int dim, int[] sizes) -> Tensor
  self: grad.reshape(self.shape())

# matmul's backward branches on the input dims (dot / vec@mat / mat@vec /
# batched), which the formula DSL cannot express.  The hand-written node in
# tpx/include/ManualNodes.h (MatmulBackward, registered via
# MANUAL_DERIVATIVES) composes recordable primitives so create_graph /
# double-backward sees a graph through `@`.

- name: mm(Tensor self, Tensor mat2) -> Tensor
  self: grad.mm(mat2.t())
  mat2: self.t().mm(grad)

# Native F.linear (CPU kernel; other backends fall through to the composite).
# Per-slot compositions keep double-backward alive.
# linear_backward contract (tools/autograd/derivatives.yaml:2388-2391).
- name: linear(Tensor input, Tensor weight, Tensor? bias=None) -> Tensor
  input: linear_backward_input(grad, input, weight)
  weight: linear_backward_weight(grad, input, weight)
  bias: linear_backward_bias(grad)

- name: addmm(Tensor self, Tensor mat1, Tensor mat2, *, Scalar beta=1, Scalar alpha=1) -> Tensor
  self: maybe_multiply(grad, beta)
  mat1: maybe_multiply(grad.mm(mat2.t()), alpha)
  mat2: maybe_multiply(mat1.t().mm(grad), alpha)

- name: _to_sparse_semi_structured(Tensor dense) -> (Tensor packed, Tensor meta)
  dense: _sparse_semi_structured_to_dense(grad, meta)

- name: _sparse_semi_structured_to_dense(Tensor packed, Tensor meta) -> Tensor
  packed: _sparse_semi_structured_gather_grad(grad, packed, meta)

- name: _sparse_semi_structured_mm(Tensor mat1, Tensor mat1_meta, Tensor mat2, *, ScalarType? out_dtype=None) -> Tensor
  mat1: _sparse_semi_structured_gather_grad(grad.to(mat2.dtype()).mm(mat2.t()), mat1, mat1_meta)
  mat2: _sparse_semi_structured_mm_right(grad.t().to(mat1.dtype()), mat1, mat1_meta).t()

- name: _sparse_semi_structured_mm_right(Tensor mat2, Tensor mat1, Tensor mat1_meta, *, ScalarType? out_dtype=None) -> Tensor
  mat2: _sparse_semi_structured_mm(mat1, mat1_meta, grad.t().to(mat1.dtype())).t()
  mat1: _sparse_semi_structured_gather_grad(mat2.t().mm(grad.to(mat2.dtype())), mat1, mat1_meta)

- name: _sparse_semi_structured_addmm(Tensor input, Tensor mat1, Tensor mat1_meta, Tensor mat2, *, Scalar alpha=1, Scalar beta=1, ScalarType? out_dtype=None) -> Tensor
  input: maybe_multiply(grad.sum({1}).to(input.dtype()), beta)
  mat1: _sparse_semi_structured_gather_grad(maybe_multiply(grad.to(mat2.dtype()).mm(mat2.t()), alpha), mat1, mat1_meta)
  mat2: maybe_multiply(_sparse_semi_structured_mm_right(grad.t().to(mat1.dtype()), mat1, mat1_meta).t(), alpha)

- name: bmm(Tensor self, Tensor mat2) -> Tensor
  self: grad.matmul(mat2.transpose(-2, -1))
  mat2: self.transpose(-2, -1).matmul(grad)

- name: baddbmm(Tensor self, Tensor batch1, Tensor batch2, *, Scalar beta=1, Scalar alpha=1) -> Tensor
  self: maybe_multiply(grad, beta)
  batch1: maybe_multiply(grad.matmul(batch2.transpose(-2, -1)), alpha)
  batch2: maybe_multiply(batch1.transpose(-2, -1).matmul(grad), alpha)

- name: mv(Tensor self, Tensor vec) -> Tensor
  self: grad.outer(vec)
  vec: self.t().mv(grad)

- name: dot(Tensor self, Tensor tensor) -> Tensor
  self: grad * tensor
  tensor: grad * self

- name: outer(Tensor self, Tensor vec2) -> Tensor
  self: grad.mv(vec2)
  vec2: grad.t().mv(self)

- name: inner(Tensor self, Tensor other) -> Tensor
  self: inner_backward_self(grad, self, other)
  other: inner_backward_other(grad, self, other)

- name: movedim(Tensor self, int[] source, int[] destination) -> Tensor
  self: movedim(grad, destination, source)

- name: diagonal(Tensor self, int offset=0, int dim1=0, int dim2=1) -> Tensor
  self: diagonal_backward(grad, self.shape(), offset, dim1, dim2)

- name: sin(Tensor self) -> Tensor
  self: grad * self.cos().conj()

- name: cos(Tensor self) -> Tensor
  self: grad * -self.sin().conj()

- name: abs(Tensor self) -> Tensor
  # |z| maps C->R; conj(conj(z)/|z|) == z/|z| == sgn(z), so the plain sgn form
  # already carries the conjugated Jacobian.
  self: grad * self.sign()

# Rounding ops are piecewise-constant: zero gradient, but the entry keeps the
# graph connected so consumers (e.g. grid_sample nearest d/dgrid) still get a
# defined grad instead of silently detaching.
- name: floor(Tensor self) -> Tensor
  self: zeros_like(grad)

- name: ceil(Tensor self) -> Tensor
  self: zeros_like(grad)

- name: round(Tensor self) -> Tensor
  self: zeros_like(grad)

- name: trunc(Tensor self) -> Tensor
  self: zeros_like(grad)


- name: pow.Tensor_Scalar(Tensor self, Scalar exponent) -> Tensor
  self: pow_backward(grad, self, exponent)

- name: exp(Tensor self) -> Tensor
  self: grad * result.conj()

- name: log(Tensor self) -> Tensor
  self: grad / self.conj()

- name: square(Tensor self) -> Tensor
  self: grad * 2 * self.conj()

- name: sqrt(Tensor self) -> Tensor
  self: grad / (2 * result.conj())

- name: rsqrt(Tensor self) -> Tensor
  self: -0.5 * grad * result.pow(3).conj()

- name: sum(Tensor self, *, ScalarType dtype=Undefined) -> Tensor
  self: expand(grad, self.shape())

- name: mean(Tensor self, *, ScalarType dtype=Undefined) -> Tensor
  # grad.expand(...) / N is equivalent; scalar div keeps broadcasting and
  # avoids the ambiguous expand overloads in the generated autograd header.
  self: grad / self.numel()

- name: mean.dim(Tensor self, int[] dim, bool keepdim=false, *, ScalarType dtype=Undefined) -> Tensor
  # Recordable composition (unsqueeze reduced dims back in + scale by the
  # kept-element count); the former opaque mean_dim_backward kernel broke
  # double-backward the same way matmul's did.
  self: tensorplay::tpx::broadcast_mean_backward(grad, self, dim, keepdim)

# native that composes dispatched ops).  Same structure here: a recordable
# tpx-level helper so create_graph sees through max/min(dim).
- name: max.dim(Tensor self, int64_t dim, bool keepdim=False) -> (Tensor values, Tensor indices)
  self: tensorplay::tpx::value_selecting_reduction_backward(grad, dim, indices, self, keepdim)

- name: min.dim(Tensor self, int64_t dim, bool keepdim=False) -> (Tensor values, Tensor indices)
  self: tensorplay::tpx::value_selecting_reduction_backward(grad, dim, indices, self, keepdim)

- name: sum.dim_IntList(Tensor self, int[] dim, bool keepdim=false, *, ScalarType dtype=Undefined) -> Tensor
  self: _sum_dim_backward(grad, self, dim, keepdim)

- name: reshape(Tensor self, int[] shape) -> Tensor
  self: grad.reshape(self.shape())

- name: log_softmax(Tensor self, int dim, ScalarType dtype=Undefined) -> Tensor
  self: grad - self.log_softmax(dim, dtype).exp() * grad.sum({dim}, true)

- name: softmax(Tensor self, int dim, ScalarType dtype=Undefined) -> Tensor
  self: (grad - (grad * result).sum({dim}, true)) * result

- name: nll_loss(Tensor self, Tensor target, Tensor? weight=None, int reduction=1, int ignore_index=-100) -> (Tensor output, Tensor total_weight)
  self: nll_loss_backward(grad, self, target, weight, reduction, ignore_index, total_weight)

- name: nll_loss2d(Tensor self, Tensor target, Tensor? weight=None, int reduction=1, int ignore_index=-100) -> (Tensor output, Tensor total_weight)
  self: nll_loss2d_backward(grad, self, target, weight, reduction, ignore_index, total_weight)

# its native backward (target is class indices, non-differentiable);
# multilabel_margin_loss is composite over multilabel_margin_loss_forward,
# whose backward consumes the saved is_target mask.
- name: multi_margin_loss(Tensor self, Tensor target, Scalar p=1, Scalar margin=1, Tensor? weight=None, int reduction=1) -> Tensor
  self: multi_margin_loss_backward(grad, self, target, p, margin, weight, reduction)

- name: multilabel_margin_loss_forward(Tensor self, Tensor target, int reduction) -> (Tensor output, Tensor is_target)
  self: multilabel_margin_loss_backward(grad, self, target, reduction, is_target)

# CTC: grad flows only to log_probs; the backward consumes the saved forward
# outputs (raw per-sequence NLL keeps +inf for impossible alignments so the
- name: _ctc_loss(Tensor log_probs, Tensor targets, Tensor input_lengths, Tensor target_lengths, int blank=0, bool zero_infinity=False) -> (Tensor neg_log_likelihood, Tensor log_alpha)
  log_probs: _ctc_loss_backward(grad, log_probs, targets, input_lengths, target_lengths, neg_log_likelihood, log_alpha, blank, zero_infinity)

- name: mse_loss(Tensor self, Tensor target, int reduction=1) -> Tensor
  self: mse_loss_backward(grad, self, target, reduction)

- name: relu(Tensor self) -> Tensor
  self: threshold_backward(grad, result, 0)

# max_pool2d / max_pool3d are Composite over *_with_indices (see the schema);
# autograd records the with_indices node and uses its
# indices-scatter derivative below, so no recompute formula is needed here.
- name: max_pool2d_with_indices(Tensor input, int[] kernel_size, int[] stride=[], int[] padding=[], int[] dilation=[], bool ceil_mode=false) -> (Tensor output, Tensor indices)
  input: max_pool2d_with_indices_backward(grad, input, kernel_size, stride, padding, dilation, ceil_mode, indices)

- name: max_pool3d_with_indices(Tensor input, int[] kernel_size, int[] stride=[], int[] padding=[], int[] dilation=[], bool ceil_mode=false) -> (Tensor output, Tensor indices)
  input: max_pool3d_with_indices_backward(grad, input, kernel_size, stride, padding, dilation, ceil_mode, indices)

- name: avg_pool2d(Tensor input, int[] kernel_size, int[] stride=[], int[] padding=[], bool ceil_mode=false, bool count_include_pad=true, int? divisor_override=None) -> Tensor
  input: avg_pool2d_backward(grad, input, kernel_size, stride, padding, ceil_mode, count_include_pad, divisor_override)

- name: avg_pool3d(Tensor input, int[] kernel_size, int[] stride=[], int[] padding=[], bool ceil_mode=false, bool count_include_pad=true, int? divisor_override=None) -> Tensor
  input: avg_pool3d_backward(grad, input, kernel_size, stride, padding, ceil_mode, count_include_pad, divisor_override)

- name: adaptive_avg_pool3d(Tensor input, int[] output_size) -> Tensor
  input: adaptive_avg_pool3d_backward(grad, input)

- name: adaptive_avg_pool2d(Tensor input, int[] output_size) -> Tensor
  input: adaptive_avg_pool2d_backward(grad, input)

# backward scatters onto the saved indices instead of recomputing the argmax.
- name: adaptive_max_pool2d_with_indices(Tensor input, int[] output_size) -> (Tensor output, Tensor indices)
  input: adaptive_max_pool2d_with_indices_backward(grad, input, output_size, indices)

- name: adaptive_max_pool3d(Tensor input, int[] output_size) -> Tensor
  input: adaptive_max_pool3d_backward(grad, input)

# argmax positions; kernel_size is unused by the backward.
- name: fractional_max_pool2d(Tensor self, int[] kernel_size, int[] output_size, Tensor random_samples) -> (Tensor output, Tensor indices)
  self: fractional_max_pool2d_backward(grad, self, kernel_size, output_size, indices)

- name: fractional_max_pool3d(Tensor self, int[] kernel_size, int[] output_size, Tensor random_samples) -> (Tensor output, Tensor indices)
  self: fractional_max_pool3d_backward(grad, self, kernel_size, output_size, indices)

# max_pool_double_backward (a gather of grad at the recorded indices); the
# native backward kernels implement exactly that gather. indices is int64 and
# therefore not differentiable.
- name: max_unpool2d(Tensor self, Tensor indices, int[] output_size) -> Tensor
  self: max_unpool2d_backward(grad, indices, output_size)

- name: max_unpool3d(Tensor self, Tensor indices, int[] output_size, int[] stride, int[] padding) -> Tensor
  self: max_unpool3d_backward(grad, indices, output_size)

# corresponding *_backward with an output_mask selecting the needed result.
# The masked-out slot is returned as zeros and never consumed.
- name: grid_sampler_2d(Tensor input, Tensor grid, int interpolation_mode, int padding_mode, bool align_corners) -> Tensor
  input: std::get<0>(grid_sampler_2d_backward(grad, input, grid, interpolation_mode, padding_mode, align_corners, {true, false}))
  grid: std::get<1>(grid_sampler_2d_backward(grad, input, grid, interpolation_mode, padding_mode, align_corners, {false, true}))

- name: grid_sampler_3d(Tensor input, Tensor grid, int interpolation_mode, int padding_mode, bool align_corners) -> Tensor
  input: std::get<0>(grid_sampler_3d_backward(grad, input, grid, interpolation_mode, padding_mode, align_corners, {true, false}))
  grid: std::get<1>(grid_sampler_3d_backward(grad, input, grid, interpolation_mode, padding_mode, align_corners, {false, true}))

- name: batch_norm(Tensor input, Tensor? weight, Tensor? bias, Tensor? running_mean, Tensor? running_var, bool training, float momentum, float eps) -> Tensor
  input: std::get<0>(batch_norm_backward(grad, input, weight, running_mean, running_var, training, eps))
  weight: std::get<1>(batch_norm_backward(grad, input, weight, running_mean, running_var, training, eps))
  bias: std::get<2>(batch_norm_backward(grad, input, weight, running_mean, running_var, training, eps))

- name: layer_norm(Tensor input, int[] normalized_shape, Tensor? weight=None, Tensor? bias=None, float eps=1e-5) -> Tensor
  input: std::get<0>(layer_norm_backward(grad, input, normalized_shape, weight, bias, eps))
  weight: std::get<1>(layer_norm_backward(grad, input, normalized_shape, weight, bias, eps))
  bias: std::get<2>(layer_norm_backward(grad, input, normalized_shape, weight, bias, eps))

- name: group_norm(Tensor input, int num_groups, Tensor? weight=None, Tensor? bias=None, float eps=1e-5) -> Tensor
  input: std::get<0>(group_norm_backward(grad, input, num_groups, weight, bias, eps))
  weight: std::get<1>(group_norm_backward(grad, input, num_groups, weight, bias, eps))
  bias: std::get<2>(group_norm_backward(grad, input, num_groups, weight, bias, eps))

- name: instance_norm(Tensor input, Tensor? weight, Tensor? bias, Tensor? running_mean, Tensor? running_var, bool use_input_stats, float momentum, float eps) -> Tensor
  input: std::get<0>(instance_norm_backward(grad, input, weight, bias, running_mean, running_var, use_input_stats, eps))
  weight: std::get<1>(instance_norm_backward(grad, input, weight, bias, running_mean, running_var, use_input_stats, eps))
  bias: std::get<2>(instance_norm_backward(grad, input, weight, bias, running_mean, running_var, use_input_stats, eps))

- name: constant_pad_nd(Tensor self, int[] pad, Scalar value=0) -> Tensor
  self: constant_pad_nd_backward(grad, pad)

# Rank-generic convolution: one backward call per requested slot, with the
# output mask narrowing the work to exactly that slot.
- name: convolution(Tensor input, Tensor weight, Tensor? bias, int[] stride, int[] padding, int[] dilation, bool transposed, int[] output_padding, int groups) -> Tensor
