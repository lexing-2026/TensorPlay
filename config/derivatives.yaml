  self: upsample_trilinear3d_backward(grad, output_size, self.shape(), align_corners, scales_d, scales_h, scales_w)

# Upsampling backward kernels are linear in grad_output: the adjoint of the
# backward (a sum over the output cells each input cell fed) is the forward
