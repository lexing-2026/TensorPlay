  grad_output: conv_grad_weight_wrt_grad_output(grad, input, stride, padding, dilation, true, output_padding, groups)
  input: conv_grad_weight_wrt_input(grad, grad_output, input, stride, padding, dilation, true, output_padding, groups)
  weight: zeros_like(weight)

- name: conv_transpose3d_grad_bias(Tensor grad_output, Tensor input, Tensor weight, int[] stride, int[] padding, int[] output_padding, int groups, int[] dilation) -> Tensor
  grad_output: conv_grad_bias_wrt_grad_output(grad, grad_output)
  input: zeros_like(input)
  weight: zeros_like(weight)

# is the col2im kernel plus input-shape bookkeeping; same for col2im_backward.
- name: im2col(Tensor self, int[] kernel_size, int[] dilation, int[] padding, int[] stride) -> Tensor
  self: im2col_backward(grad, self.shape(), kernel_size, dilation, padding, stride)

- name: col2im(Tensor self, int[] output_size, int[] kernel_size, int[] dilation, int[] padding, int[] stride) -> Tensor
  self: col2im_backward(grad, self.shape(), output_size, kernel_size, dilation, padding, stride)

- name: im2col_backward(Tensor grad_output, int[] input_size, int[] kernel_size, int[] dilation, int[] padding, int[] stride) -> Tensor
  grad_output: im2col(grad, kernel_size, dilation, padding, stride)

- name: col2im_backward(Tensor grad_output, int[] input_size, int[] output_size, int[] kernel_size, int[] dilation, int[] padding, int[] stride) -> Tensor
  grad_output: col2im(grad, output_size, kernel_size, dilation, padding, stride)

# Vision ROI / deformable operators. nms and box_iou are intentionally
# non-differentiable and therefore have no entries here.
- name: roi_align(Tensor input, Tensor rois, float spatial_scale, int pooled_height, int pooled_width, int sampling_ratio, bool aligned) -> Tensor
  input: roi_align_backward(grad, rois, spatial_scale, pooled_height, pooled_width, sampling_ratio, aligned, input.shape())

- name: roi_pool(Tensor input, Tensor rois, float spatial_scale, int pooled_height, int pooled_width) -> Tensor
  input: roi_pool_backward(grad, input, rois, spatial_scale, pooled_height, pooled_width)

- name: ps_roi_align(Tensor input, Tensor rois, float spatial_scale, int pooled_height, int pooled_width, int sampling_ratio) -> Tensor
  input: ps_roi_align_backward(grad, rois, spatial_scale, pooled_height, pooled_width, sampling_ratio, input.shape())

- name: ps_roi_pool(Tensor input, Tensor rois, float spatial_scale, int pooled_height, int pooled_width) -> Tensor
  input: ps_roi_pool_backward(grad, rois, spatial_scale, pooled_height, pooled_width, input.shape())

# roi_align and ps_roi_align are linear in the input, and their backward
# kernels scatter with exactly the bilinear weights the forward gathers with,
# so the backward differentiates in grad_output to the forward itself.
- name: roi_align_backward(Tensor grad_output, Tensor rois, float spatial_scale, int pooled_height, int pooled_width, int sampling_ratio, bool aligned, int[] input_size) -> Tensor
  grad_output: roi_align(grad, rois, spatial_scale, pooled_height, pooled_width, sampling_ratio, aligned)

- name: ps_roi_align_backward(Tensor grad_output, Tensor rois, float spatial_scale, int pooled_height, int pooled_width, int sampling_ratio, int[] input_size) -> Tensor
  grad_output: ps_roi_align(grad, rois, spatial_scale, pooled_height, pooled_width, sampling_ratio)

# The remaining ROI backward kernels have no derivative of their own.
- name: roi_pool_backward(Tensor grad_output, Tensor input, Tensor rois, float spatial_scale, int pooled_height, int pooled_width) -> Tensor
  grad_output: not_implemented_grad("roi_pool_backward")
  input: not_implemented_grad("roi_pool_backward")

- name: ps_roi_pool_backward(Tensor grad_output, Tensor rois, float spatial_scale, int pooled_height, int pooled_width, int[] input_size) -> Tensor
  grad_output: not_implemented_grad("ps_roi_pool_backward")

- name: deform_conv2d(Tensor input, Tensor weight, Tensor offset, Tensor mask, Tensor? bias, int[2] stride, int[2] padding, int[2] dilation, int groups, int offset_groups, bool use_mask) -> Tensor
  input: std::get<0>(deform_conv2d_backward(grad, input, weight, offset, mask, bias, stride, padding, dilation, groups, offset_groups, use_mask, {true, false, false, false, false}))
  weight: std::get<1>(deform_conv2d_backward(grad, input, weight, offset, mask, bias, stride, padding, dilation, groups, offset_groups, use_mask, {false, true, false, false, false}))
  offset: std::get<2>(deform_conv2d_backward(grad, input, weight, offset, mask, bias, stride, padding, dilation, groups, offset_groups, use_mask, {false, false, true, false, false}))
  mask: std::get<3>(deform_conv2d_backward(grad, input, weight, offset, mask, bias, stride, padding, dilation, groups, offset_groups, use_mask, {false, false, false, true, false}))
  bias: std::get<4>(deform_conv2d_backward(grad, input, weight, offset, mask, bias, stride, padding, dilation, groups, offset_groups, use_mask, {false, false, false, false, true}))

- name: reflection_pad_nd(Tensor self, int[] pad) -> Tensor
  self: reflection_pad_nd_backward(grad, self, pad)

- name: replication_pad_nd(Tensor self, int[] pad) -> Tensor
  self: replication_pad_nd_backward(grad, self, pad)

- name: reflection_pad1d(Tensor self, SymInt[2] padding) -> Tensor
  self: reflection_pad1d_backward(grad, self, padding)

- name: reflection_pad2d(Tensor self, SymInt[4] padding) -> Tensor
  self: reflection_pad2d_backward(grad, self, padding)

- name: reflection_pad3d(Tensor self, SymInt[6] padding) -> Tensor
  self: reflection_pad3d_backward(grad, self, padding)

- name: replication_pad1d(Tensor self, SymInt[2] padding) -> Tensor
  self: replication_pad1d_backward(grad, self, padding)

- name: replication_pad2d(Tensor self, SymInt[4] padding) -> Tensor
  self: replication_pad2d_backward(grad, self, padding)

- name: replication_pad3d(Tensor self, SymInt[6] padding) -> Tensor
  self: replication_pad3d_backward(grad, self, padding)

- name: circular_pad_nd(Tensor self, int[] pad) -> Tensor
  self: circular_pad_nd_backward(grad, self, pad)

# Padding backward kernels are linear in grad_output and use self only for its
# shape: the adjoint of cropping the padded gradient back is padding again.
- name: reflection_pad_nd_backward(Tensor grad_output, Tensor self, int[] pad) -> Tensor
  grad_output: reflection_pad_nd(grad, pad)
  self: zeros_like(self)

- name: replication_pad_nd_backward(Tensor grad_output, Tensor self, int[] pad) -> Tensor
  grad_output: replication_pad_nd(grad, pad)
  self: zeros_like(self)

- name: circular_pad_nd_backward(Tensor grad_output, Tensor self, int[] pad) -> Tensor
  grad_output: circular_pad_nd(grad, pad)
  self: zeros_like(self)

- name: constant_pad_nd_backward(Tensor grad_output, int[] pad) -> Tensor
  grad_output: constant_pad_nd(grad, pad, Scalar(0))

- name: reflection_pad1d_backward(Tensor grad_output, Tensor self, SymInt[2] padding) -> Tensor
  grad_output: reflection_pad1d(grad, padding)
  self: zeros_like(self)

- name: replication_pad1d_backward(Tensor grad_output, Tensor self, SymInt[2] padding) -> Tensor
  grad_output: replication_pad1d(grad, padding)
  self: zeros_like(self)

- name: reflection_pad2d_backward(Tensor grad_output, Tensor self, SymInt[4] padding) -> Tensor
  grad_output: reflection_pad2d(grad, padding)
  self: zeros_like(self)

- name: replication_pad2d_backward(Tensor grad_output, Tensor self, SymInt[4] padding) -> Tensor
  grad_output: replication_pad2d(grad, padding)
  self: zeros_like(self)

- name: reflection_pad3d_backward(Tensor grad_output, Tensor self, SymInt[6] padding) -> Tensor
  grad_output: reflection_pad3d(grad, padding)
  self: zeros_like(self)

- name: replication_pad3d_backward(Tensor grad_output, Tensor self, SymInt[6] padding) -> Tensor
  grad_output: replication_pad3d(grad, padding)
  self: zeros_like(self)

- name: sigmoid(Tensor self) -> Tensor
  self: sigmoid_backward(grad, result)
  result: auto_element_wise

- name: silu(Tensor self) -> Tensor
  self: silu_backward_recordable(grad, self)

- name: tanh(Tensor self) -> Tensor
  self: tanh_backward(grad, result)
  result: auto_element_wise

- name: atan2(Tensor self, Tensor other) -> Tensor
  self: grad * other / (self * self + other * other)
  other: grad * -self / (self * self + other * other)

- name: lerp(Tensor self, Tensor end, Scalar weight) -> Tensor
  self: grad * (Scalar(1) - weight)
  end: grad * weight

- name: lerp.Tensor(Tensor self, Tensor end, Tensor weight) -> Tensor
  self: grad * (1 - weight)
  end: grad * weight
  weight: grad * (end - self)

- name: var(Tensor self, int correction=1) -> Tensor
  self: grad * 2 * (self - self.mean()) / (self.numel() - correction)

- name: std(Tensor self, int correction=1) -> Tensor
  self: grad * (self - self.mean()) / (result * (self.numel() - correction))

- name: scaled_dot_product_attention(Tensor query, Tensor key, Tensor value, Tensor? attn_mask=None, float dropout_p=0.0, bool is_causal=False, *, float? scale=None, bool enable_gqa=False) -> Tensor
  query: std::get<0>(scaled_dot_product_attention_backward(grad, query, key, value, attn_mask, dropout_p, is_causal, scale, enable_gqa))
  key: std::get<1>(scaled_dot_product_attention_backward(grad, query, key, value, attn_mask, dropout_p, is_causal, scale, enable_gqa))
  value: std::get<2>(scaled_dot_product_attention_backward(grad, query, key, value, attn_mask, dropout_p, is_causal, scale, enable_gqa))

