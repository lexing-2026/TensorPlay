- name: fft_fft2(Tensor self, int[]? s=None, int[] dim=[-2,-1], str norm="backward") -> Tensor
  self: tensorplay::tpx::ops::fft_fft2_backward(grad, self, s, dim, norm)

- name: fft_ifft2(Tensor self, int[]? s=None, int[] dim=[-2,-1], str norm="backward") -> Tensor
  self: tensorplay::tpx::ops::fft_ifft2_backward(grad, self, s, dim, norm)

- name: fft_rfft2(Tensor self, int[]? s=None, int[] dim=[-2,-1], str norm="backward") -> Tensor
  self: tensorplay::tpx::ops::fft_rfft2_backward(grad, self, s, dim, norm)

- name: fft_irfft2(Tensor self, int[]? s=None, int[] dim=[-2,-1], str norm="backward") -> Tensor
  self: tensorplay::tpx::ops::fft_irfft2_backward(grad, self, s, dim, norm)

- name: fft_fft(Tensor self, SymInt n=-1, int dim=-1, str norm="backward") -> Tensor
  self: tensorplay::tpx::ops::fft_fft_backward(grad, self, dim, norm)

- name: fft_ifft(Tensor self, SymInt n=-1, int dim=-1, str norm="backward") -> Tensor
  self: tensorplay::tpx::ops::fft_ifft_backward(grad, self, dim, norm)

- name: fft_rfft(Tensor self, SymInt n=-1, int dim=-1, str norm="backward") -> Tensor
  self: tensorplay::tpx::ops::fft_rfft_backward(grad, self, dim, norm, n)

- name: fft_irfft(Tensor self, SymInt n=-1, int dim=-1, str norm="backward") -> Tensor
  self: tensorplay::tpx::ops::fft_irfft_backward(grad, self, dim, norm)

# Each spectral backward kernel applies the adjoint of its transform and is
# linear in the incoming gradient, so differentiating it applies the
# transform itself.  The input enters only through its shape.
- name: fft_fft_backward(Tensor grad_output, Tensor self, int dim, str norm) -> Tensor
  grad_output: tensorplay::tpx::ops::fft_fft(grad, size_along(grad_output.sizes(), dim), dim, norm)
  self: non_differentiable

- name: fft_ifft_backward(Tensor grad_output, Tensor self, int dim, str norm) -> Tensor
  grad_output: tensorplay::tpx::ops::fft_ifft(grad, size_along(grad_output.sizes(), dim), dim, norm)
  self: non_differentiable

- name: fft_rfft_backward(Tensor grad_output, Tensor self, int dim, str norm, int n=-1) -> Tensor
  grad_output: tensorplay::tpx::ops::fft_rfft(grad, n, dim, norm)
  self: non_differentiable

- name: fft_irfft_backward(Tensor grad_output, Tensor self, int dim, str norm) -> Tensor
  grad_output: tensorplay::tpx::ops::fft_irfft(grad, size_along(grad_output.sizes(), dim), dim, norm)
  self: non_differentiable

- name: fft_fft2_backward(Tensor grad_output, Tensor self, int[]? s=None, int[] dim=[-2,-1], str norm="backward") -> Tensor
  grad_output: tensorplay::tpx::ops::fft_fft2(grad, s, dim, norm)
  self: non_differentiable

- name: fft_ifft2_backward(Tensor grad_output, Tensor self, int[]? s=None, int[] dim=[-2,-1], str norm="backward") -> Tensor
  grad_output: tensorplay::tpx::ops::fft_ifft2(grad, s, dim, norm)
  self: non_differentiable

- name: fft_rfft2_backward(Tensor grad_output, Tensor self, int[]? s=None, int[] dim=[-2,-1], str norm="backward") -> Tensor
  grad_output: tensorplay::tpx::ops::fft_rfft2(grad, s, dim, norm)
  self: non_differentiable

- name: fft_irfft2_backward(Tensor grad_output, Tensor self, int[]? s=None, int[] dim=[-2,-1], str norm="backward") -> Tensor
  grad_output: tensorplay::tpx::ops::fft_irfft2(grad, s, dim, norm)
  self: non_differentiable

# The primitive transforms are linear.  A complex transform's adjoint is the
# transform of the other direction with the same scaling; the real ones also
# account for the half spectrum (see the helpers).
- name: _fft_r2c(Tensor self, int[] dim, int normalization, bool onesided) -> Tensor
  self: fft_r2c_backward(grad, dim, normalization, onesided, size_along(self.sizes(), dim.back()))
  result: auto_linear

- name: _fft_c2r(Tensor self, int[] dim, int normalization, SymInt last_dim_size) -> Tensor
  self: fft_c2r_backward(grad, dim, normalization)
  result: auto_linear

- name: _fft_c2c(Tensor self, SymInt[] dim, int normalization, bool forward) -> Tensor
  self: tensorplay::tpx::ops::_fft_c2c(grad, dim, normalization, !forward)
  result: auto_linear

- name: stft(Tensor self, int n_fft, int? hop_length=None, int? win_length=None, Tensor? window=None, bool center=True, str pad_mode="reflect", bool normalized=False, bool onesided=True, bool return_complex=True) -> Tensor
  self: tensorplay::tpx::ops::stft_backward(grad, self, n_fft, hop_length, win_length, window, center, pad_mode, normalized, onesided)
  window: stft_window_backward(grad, self, n_fft, hop_length, win_length, window, center, pad_mode, normalized, onesided)

# stft_backward applies the adjoint of the windowed, framed transform and is
# linear in the incoming gradient, so differentiating it runs the transform;
# with respect to the window it is stft's own window gradient with the roles
# of the gradient and the signal exchanged.
- name: stft_backward(Tensor grad_output, Tensor self, int n_fft, int? hop_length=None, int? win_length=None, Tensor? window=None, bool center=True, str pad_mode="reflect", bool normalized=False, bool onesided=True) -> Tensor
  grad_output: tensorplay::tpx::ops::stft(grad, n_fft, hop_length, win_length, window, center, pad_mode, normalized, onesided, true)
  window: stft_window_backward(grad_output, grad, n_fft, hop_length, win_length, window, center, pad_mode, normalized, onesided)
  self: non_differentiable

- name: flip(Tensor self, int[] dims=[]) -> Tensor
  self: tensorplay::tpx::ops::flip(grad, dims)

# TensorTransformations.cpp rot90 is an involution up to sign:
# differentiates as grad.rot90(-k, dims).
- name: rot90(Tensor self, int k=1, int[] dims=[0,1]) -> Tensor
  self: tensorplay::tpx::ops::rot90(grad, -k, dims)

- name: log10(Tensor self) -> Tensor
  self: grad / self * 0.43429448190325176

- name: log1p(Tensor self) -> Tensor
  self: log1p_backward(grad, self)

- name: frac(Tensor self) -> Tensor
  self: grad

- name: diff(Tensor self, int n=1, int dim=-1, Tensor? prepend=None, Tensor? append=None) -> Tensor
  self: tensorplay::tpx::ops::neg(grad)

- name: to_dense(Tensor self) -> Tensor
  self: grad.sparse_mask(self)

# silu 旧式 `grad * self.sigmoid() * (self + 1)` 漏 (1 - sigmoid) 因子，
# 有限差分验证: x=0.49 处旧值 0.9239 vs 真值 0.7354。

- name: sinh(Tensor self) -> Tensor
  self: grad * self.cosh().conj()

# (去 .conj() 复数分支;M_2_SQRTPI/M_LN2 常量内联为数值)。

- name: acos(Tensor self) -> Tensor
  self: grad * -((-self * self + 1).rsqrt()).conj()

- name: asin(Tensor self) -> Tensor
  self: grad * (-self * self + 1).rsqrt().conj()

- name: atan(Tensor self) -> Tensor
  self: grad / (self * self + 1).conj()

- name: tan(Tensor self) -> Tensor
  self: grad * (1 + result.pow(2)).conj()

- name: erf(Tensor self) -> Tensor
  self: 1.1283791670205586 * exp(-(self.pow(2))) * grad

- name: erfc(Tensor self) -> Tensor
  self: -1.1283791670205586 * exp(-(self.pow(2))) * grad

- name: lgamma(Tensor self) -> Tensor
  self: grad * digamma(self)

- name: log2(Tensor self) -> Tensor
  self: grad / (self.conj() * 0.6931471805599453)

- name: cosh(Tensor self) -> Tensor
  self: grad * self.sinh().conj()

- name: asinh(Tensor self) -> Tensor
  self: grad * (self.pow(2) + 1).rsqrt().conj()

- name: acosh(Tensor self) -> Tensor
  self: acosh_backward(grad, self)

- name: atanh(Tensor self) -> Tensor
  self: grad * 1 / (1 - self.pow(2)).conj()

# In-place arc variants reuse the out-of-place formula.  The saved `self` is
# captured before the mutation (gen_tpx hoists a clone,
# gen_variable_type's `original_self = self.clone()`), so the slope is
# provides them via the closed-form slope (spec: test_composite_funcs).
- name: acos_(Tensor(a!) self) -> Tensor(a!)
  self: grad * -((-self * self + 1).rsqrt()).conj()

- name: asin_(Tensor(a!) self) -> Tensor(a!)
  self: grad * (-self * self + 1).rsqrt().conj()

- name: atan_(Tensor(a!) self) -> Tensor(a!)
  self: grad / (self * self + 1).conj()

- name: acosh_(Tensor(a!) self) -> Tensor(a!)
  self: acosh_backward(grad, self)

- name: asinh_(Tensor(a!) self) -> Tensor(a!)
  self: grad * (self.pow(2) + 1).rsqrt().conj()

- name: atanh_(Tensor(a!) self) -> Tensor(a!)
  self: grad * 1 / (1 - self.pow(2)).conj()

- name: logit(Tensor self, Scalar? eps=None) -> Tensor
  self: logit_backward_recordable(grad, self, eps)

- name: expm1(Tensor self) -> Tensor
  self: grad * (result.conj() + 1)

- name: angle(Tensor self) -> Tensor
  self: angle_backward(grad, self)

# straight back to the parts: dL/dr = g.real, dL/di = g.imag.
- name: complex(Tensor real, Tensor imag) -> Tensor
  real: grad.real()
  imag: grad.imag()

# conjugated Jacobians; see FunctionsManual.cpp.
- name: pow.Tensor_Tensor(Tensor self, Tensor exponent) -> Tensor
  self: pow_backward_self(grad, self, exponent)
  exponent: pow_backward_exponent(grad, self, exponent, result)

# A number raised to a tensor: only the exponent carries a gradient.
- name: pow.Scalar(Scalar self, Tensor exponent) -> Tensor
  exponent: pow_backward_exponent(grad, self, exponent, result)

# self * 2^other: the value is scaled by the same power of two, and the
# exponent moves the result by the result itself times ln 2.
- name: ldexp(Tensor self, Tensor other) -> Tensor
  self: ldexp(grad, other)
  other: grad * result * 0.6931471805599453

# The lower incomplete gamma function and its complement are differentiated
# in their second argument only.
- name: igamma(Tensor self, Tensor other) -> Tensor
  self: not_implemented_grad("igamma with respect to its first argument")
  other: grad * exp((self - 1) * log(other) - other - lgamma(self))

- name: igammac(Tensor self, Tensor other) -> Tensor
  self: not_implemented_grad("igammac with respect to its first argument")
  other: -grad * exp((self - 1) * log(other) - other - lgamma(self))

# Tensor bounds: inside them the value passes through, a value sitting on a
# bound shares its gradient with it, and reversed bounds hand everything to
# max (the result is max there).
- name: clamp.Tensor(Tensor self, Tensor? min=None, Tensor? max=None) -> Tensor
  self: clamp_tensor_backward_self(grad, self, min, max)
  min: clamp_tensor_backward_min(grad, self, min, max)
  max: clamp_tensor_backward_max(grad, self, min, max)

- name: prod(Tensor self, *, ScalarType dtype=Undefined) -> Tensor
  self: prod_backward(grad, self, result)

# ---- Shape & view derivative formulas
# `repeat_backward(grad, repeats, self.sym_sizes())`); the helpers are ports

- name: expand(Tensor self, int[] size, *, bool implicit=False) -> Tensor
  self: sum_to_size(grad, self.shape())
  result: auto_linear

- name: expand_as(Tensor self, Tensor other) -> Tensor
  self: sum_to_size(grad, self.shape())
  result: auto_linear

- name: repeat(Tensor self, int[] repeats) -> Tensor
  self: repeat_backward(grad, repeats, self.shape())

- name: fill.Scalar(Tensor self, Scalar value) -> Tensor
  self: tensorplay::tpx::ops::zeros_like(grad)

- name: fill.Tensor(Tensor self, Tensor value) -> Tensor
  self: tensorplay::tpx::ops::zeros_like(grad)
  value: grad.sum()

# Trapezoid family: weights w_j = dx * [0.5, 1, ..., 1, 0.5] for the sum
# form (x form uses coordinate differences); the cumulative form backprops a
# reversed cumsum of grad times the same weights.
- name: trapezoid(Tensor y, Tensor? x=None, *, Scalar dx=1, int dim=-1) -> Tensor
  y: _trapezoid_backward(grad, x, y.shape(), dx, dim)
  x: trapezoid_x_backward(grad, y, x, dim)

- name: cumulative_trapezoid(Tensor y, Tensor? x=None, *, Scalar dx=1, int dim=-1) -> Tensor
  y: _cumulative_trapezoid_backward(grad, x, dx, dim)
  x: cumulative_trapezoid_x_backward(grad, y, x, dim)

# Both backward kernels weight the incoming gradient by the trapezoid rule's
# coefficients, so differentiating one integrates again; with respect to the
# sample points it is the integral's own x-gradient with the roles of the
# gradient and the samples exchanged.
- name: _trapezoid_backward(Tensor grad_output, Tensor? x, int[] ysizes, Scalar dx, int dim) -> Tensor
  grad_output: trapezoid(grad, x, dx, dim)
  x: trapezoid_x_backward(grad_output, grad, x, dim)

- name: _cumulative_trapezoid_backward(Tensor grad_output, Tensor? x, Scalar dx, int dim) -> Tensor
  grad_output: cumulative_trapezoid(grad, x, dx, dim)
  x: cumulative_trapezoid_x_backward(grad_output, grad, x, dim)

- name: scatter_reduce(Tensor self, int dim, Tensor index, Tensor src, str reduce, *, bool include_self=True) -> Tensor
  self: scatter_reduce_backward_self_recordable(grad, self, dim, index, src, reduce, include_self)
  src: scatter_reduce_backward_src_recordable(grad, self, dim, index, src, reduce, include_self)

- name: index_reduce(Tensor self, int dim, Tensor index, Tensor source, str reduce, *, bool include_self=True) -> Tensor
  self: index_reduce_backward_self_recordable(grad, self, dim, index, source, reduce, include_self)
  source: index_reduce_backward_src_recordable(grad, self, dim, index, source, reduce, include_self)

# with M = X - weighted_avg. dL/dX = G_M - rowsum(G_M) * (w / wsum) where
# G_M = ((grad + grad^T) M diag(w)) / fact. corrcoef chains through the clip
# mask, the D^-1 C D^-1 normalization and cov's formula.
- name: cov(Tensor self, *, int correction=1, Tensor? fweights=None, Tensor? aweights=None) -> Tensor
  self: cov_backward_recordable(grad, self, correction, fweights, aweights)
  aweights: cov_aweights_backward(grad, self, correction, fweights, aweights)

- name: corrcoef(Tensor self) -> Tensor
  self: corrcoef_backward_recordable(grad, self)

