# gather_backward composite (TensorAdvancedIndexing.cpp:2118):
# new_zeros(self.sizes()).scatter_add_(dim, index, grad)
- name: gather(Tensor self, int dim, Tensor index) -> Tensor
  self: zeros_like(self).scatter_add(dim, index, grad)

# derivatives.yaml:1529-1531
- name: scatter_add(Tensor self, int dim, Tensor index, Tensor src) -> Tensor
  self: grad
  src: grad.gather(dim, index)

# index_select_backward composite: zeros(input_sizes).index_add(dim, index, grad)
