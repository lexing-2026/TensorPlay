# --- scatter / index family (derivatives.yaml:856-880, 1090-1110) ---------

- name: index.Tensor(Tensor self, Tensor?[] indices) -> Tensor
  self: index_backward(grad.new_zeros_symint(self.sym_sizes(), self.options()), indices, grad)
  result: auto_linear

- name: scatter.src(Tensor self, int dim, Tensor index, Tensor src) -> Tensor
  self: scatter(grad, dim, index, Scalar(0))
  src: gather(grad, dim, index)

- name: scatter.value(Tensor self, int dim, Tensor index, Scalar value) -> Tensor
  self: scatter(grad, dim, index, Scalar(0))

- name: index_copy(Tensor self, int dim, Tensor index, Tensor source) -> Tensor
  self: index_fill(grad, dim, index, Scalar(0))
  source: index_select(grad, dim, index)

- name: index_fill.Scalar(Tensor self, int dim, Tensor index, Scalar value) -> Tensor
  self: index_fill(grad, dim, index, Scalar(0))

- name: index_fill.Tensor(Tensor self, int dim, Tensor index, Tensor value) -> Tensor
  self: index_fill(grad, dim, index, Scalar(0))
  value: sum(index_select(grad, dim, std::get<0>(unique(index, false))))

- name: take(Tensor self, Tensor index) -> Tensor
  self: take_backward(grad, self, index)

- name: masked_select(Tensor self, Tensor mask) -> Tensor
  self: masked_select_backward(grad, self, mask)

- name: masked_scatter(Tensor self, Tensor mask, Tensor source) -> Tensor
  self: masked_fill(grad, mask, Scalar(0))
  source: masked_scatter_backward(grad, mask, source.shape())

- name: masked_scatter_backward(Tensor grad_output, Tensor mask, SymInt[] sizes) -> Tensor
  grad_output: zeros_like(grad_output).masked_scatter(mask, grad)
  mask: non_differentiable

# --- scatter-family view ops (derivatives.yaml:1240-1270) ------------------

- name: diag_embed(Tensor self, int offset=0, int dim1=0, int dim2=1) -> Tensor
  self: diagonal(grad, offset, dim1, dim2)

- name: channel_shuffle(Tensor self, int groups) -> Tensor
  self: channel_shuffle(grad, grad.size(1) / groups)

- name: select_scatter(Tensor self, Tensor src, int dim, int index) -> Tensor
  self: select_scatter(grad, zeros_like(src), dim, index)
  src: select(grad, dim, index)

- name: slice_scatter(Tensor self, Tensor src, int dim=0, int? start=None, int? end=None, int step=1) -> Tensor
  self: slice_scatter(grad, zeros_like(src), dim, start, end, step)
  src: slice(grad, dim, start, end, step)

- name: diagonal_scatter(Tensor self, Tensor src, int offset=0, int dim1=0, int dim2=1) -> Tensor
  self: diagonal_scatter(grad, zeros_like(src), offset, dim1, dim2)
  src: diagonal(grad, offset, dim1, dim2)

# --- blas-family (derivatives.yaml:190-210): beta/alpha elide via
# maybe_multiply. ------------------------------------------------------------

- name: addbmm(Tensor self, Tensor batch1, Tensor batch2, *, Scalar beta=1, Scalar alpha=1) -> Tensor
  self: maybe_multiply(grad, beta)
  batch1: maybe_multiply(bmm(expand(unsqueeze(grad, 0), {batch1.size(0), batch1.size(1), batch2.size(2)}), transpose(batch2, 1, 2)), alpha)
  batch2: maybe_multiply(bmm(transpose(batch1, 1, 2), expand(unsqueeze(grad, 0), {batch1.size(0), batch1.size(1), batch2.size(2)})), alpha)

- name: addmv(Tensor self, Tensor mat, Tensor vec, *, Scalar beta=1, Scalar alpha=1) -> Tensor
  self: maybe_multiply(grad, beta)
  mat: maybe_multiply(outer(grad, vec), alpha)
  vec: maybe_multiply(mv(t(mat), grad), alpha)

- name: addr(Tensor self, Tensor vec1, Tensor vec2, *, Scalar beta=1, Scalar alpha=1) -> Tensor
  self: maybe_multiply(grad, beta)
  vec1: maybe_multiply(mv(grad, vec2), alpha)
  vec2: maybe_multiply(mv(t(grad), vec1), alpha)

# --- pointwise / special (derivatives.yaml:1300-1560) ----------------------

- name: logaddexp2(Tensor self, Tensor other) -> Tensor
  self: grad * sigmoid((self - other) * 0.6931471805599453)
  other: grad * sigmoid((other - self) * 0.6931471805599453)

- name: nan_to_num(Tensor self, Scalar nan=0.0, Scalar? posinf=None, Scalar? neginf=None) -> Tensor
  self: grad * isfinite(self).to(grad.dtype())

- name: sinc(Tensor self) -> Tensor
  self: sinc_backward(grad, self)

- name: erfinv(Tensor self) -> Tensor
  self: 0.886226925452758 * exp(erfinv(self).pow(2)) * grad

- name: digamma(Tensor self) -> Tensor
  self: grad * polygamma(1, self)

- name: polygamma(int n, Tensor self) -> Tensor
  self: grad * polygamma(n + 1, self)

- name: i0(Tensor self) -> Tensor
  self: grad * i1(self)

- name: modified_bessel_i0(Tensor self) -> Tensor
  self: grad * modified_bessel_i1(self)

# The exponentially scaled e^-|x| I0(x) differentiates to e^-|x| I1(x) minus
# sgn(x) times itself.  The first-order functions divide by x, whose 0/0 at the
# origin the helpers replace by the finite limit.
- name: i0e(Tensor self) -> Tensor
  self: grad * (i1e(self) - sgn(self) * result)

- name: i1(Tensor self) -> Tensor
  self: i1_backward(grad, self, result)

- name: i1e(Tensor self) -> Tensor
  self: i1e_backward(grad, self, result)

- name: modified_bessel_i1(Tensor self) -> Tensor
  self: i1_backward(grad, self, result)

# K0' = -K1 and K1' = -(K0 + K1 / x).
- name: modified_bessel_k0(Tensor self) -> Tensor
  self: grad * -modified_bessel_k1(self)

- name: modified_bessel_k1(Tensor self) -> Tensor
  self: grad * -(modified_bessel_k0(self) + result * reciprocal(self))

# J0' = -J1 and Y0' = -Y1; the first-order functions follow J1' = J0 - J1 / x
# and Y1' = Y0 - Y1 / x.
- name: bessel_j0(Tensor self) -> Tensor
  self: grad * -bessel_j1(self)

- name: bessel_j1(Tensor self) -> Tensor
  self: bessel_j1_backward(grad, self, result)

- name: bessel_y0(Tensor self) -> Tensor
  self: grad * -bessel_y1(self)

- name: bessel_y1(Tensor self) -> Tensor
  self: bessel_y1_backward(grad, self, result)

# d/dq zeta(s, q) = -s zeta(s + 1, q); the order s has no closed-form
# derivative.
- name: zeta(Tensor self, Tensor other) -> Tensor
  self: not_implemented_grad("zeta with respect to its first argument")
  other: grad * -self * zeta(self + 1, other)

# The regularized incomplete gamma functions differentiate in x to plus and
# minus the gamma density x^(a-1) e^-x / Gamma(a).
- name: gammainc(Tensor a, Tensor x) -> Tensor
  a: not_implemented_grad("gammainc with respect to its first argument")
  x: grad * exp((a - 1) * log(x) - x - lgamma(a))

- name: gammaincc(Tensor a, Tensor x) -> Tensor
  a: not_implemented_grad("gammaincc with respect to its first argument")
  x: -grad * exp((a - 1) * log(x) - x - lgamma(a))

# d/dx exp(x^2)erfc(x) = 2x*erfcx(x) - 2/sqrt(pi)
- name: erfcx(Tensor self) -> Tensor
  self: (2.0 * self * result - 1.1283791670955126) * grad

# The normal density 1/sqrt(2*pi) * exp(-x^2/2) is the derivative of ndtr;
# log_ndtr differentiates to that density divided by ndtr, and `result` is
# already its logarithm.
- name: ndtr(Tensor self) -> Tensor
  self: grad * 0.3989422804014327 * exp(-0.5 * self * self)

- name: log_ndtr(Tensor self) -> Tensor
  self: grad * 0.3989422804014327 * exp(-0.5 * self * self - result)

# Inverse-function rule: 1 / phi(ndtri(y)) = sqrt(2*pi) * exp(ndtri(y)^2/2).
- name: ndtri(Tensor self) -> Tensor
  self: grad * 2.5066282746310002 * exp(0.5 * result * result)

- name: entr(Tensor self) -> Tensor
  self: grad * (-(1 + log(self)))

- name: sgn(Tensor self) -> Tensor
  self: where(eq(self.abs(), 0), zeros_like(grad), (grad - (result * result) * grad.conj()) / (2 * self.abs()))

- name: nextafter(Tensor self, Tensor other) -> Tensor
  self: where(ne(self, other), grad, zeros_like(grad))
  other: zeros_like(other)

