# Slow / THNN convolution spellings: route through the rank-generic
# convolution backward with unit dilation, groups=1 and (for the transposed
# form) the transposed flag set.
- name: thnn_conv2d(Tensor self, Tensor weight, int[2] kernel_size, Tensor? bias=None, int[2] stride=1, int[2] padding=0) -> Tensor
  self: std::get<0>(convolution_backward(grad, self, weight, std::nullopt, stride, padding, {1, 1}, false, {0, 0}, 1, {true, false, false}))
  weight: std::get<1>(convolution_backward(grad, self, weight, std::nullopt, stride, padding, {1, 1}, false, {0, 0}, 1, {false, true, false}))
  bias: std::get<2>(convolution_backward(grad, self, weight, std::nullopt, stride, padding, {1, 1}, false, {0, 0}, 1, {false, false, true}))

- name: _slow_conv2d_forward(Tensor self, Tensor weight, int[2] kernel_size, Tensor? bias, int[2] stride, int[2] padding) -> Tensor
  self: std::get<0>(convolution_backward(grad, self, weight, std::nullopt, stride, padding, {1, 1}, false, {0, 0}, 1, {true, false, false}))
  weight: std::get<1>(convolution_backward(grad, self, weight, std::nullopt, stride, padding, {1, 1}, false, {0, 0}, 1, {false, true, false}))
  bias: std::get<2>(convolution_backward(grad, self, weight, std::nullopt, stride, padding, {1, 1}, false, {0, 0}, 1, {false, false, true}))

- name: slow_conv3d(Tensor self, Tensor weight, int[3] kernel_size, Tensor? bias=None, int[3] stride=1, int[3] padding=0) -> Tensor
  self: std::get<0>(convolution_backward(grad, self, weight, std::nullopt, stride, padding, {1, 1, 1}, false, {0, 0, 0}, 1, {true, false, false}))
  weight: std::get<1>(convolution_backward(grad, self, weight, std::nullopt, stride, padding, {1, 1, 1}, false, {0, 0, 0}, 1, {false, true, false}))
  bias: std::get<2>(convolution_backward(grad, self, weight, std::nullopt, stride, padding, {1, 1, 1}, false, {0, 0, 0}, 1, {false, false, true}))

- name: slow_conv3d_forward(Tensor self, Tensor weight, int[3] kernel_size, Tensor? bias, int[3] stride, int[3] padding) -> Tensor
  self: std::get<0>(convolution_backward(grad, self, weight, std::nullopt, stride, padding, {1, 1, 1}, false, {0, 0, 0}, 1, {true, false, false}))
  weight: std::get<1>(convolution_backward(grad, self, weight, std::nullopt, stride, padding, {1, 1, 1}, false, {0, 0, 0}, 1, {false, true, false}))
  bias: std::get<2>(convolution_backward(grad, self, weight, std::nullopt, stride, padding, {1, 1, 1}, false, {0, 0, 0}, 1, {false, false, true}))

- name: slow_conv_transpose2d(Tensor self, Tensor weight, int[2] kernel_size, Tensor? bias=None, int[2] stride=1, int[2] padding=0, int[2] output_padding=0, int[2] dilation=1) -> Tensor
  self: std::get<0>(convolution_backward(grad, self, weight, std::nullopt, stride, padding, dilation, true, output_padding, 1, {true, false, false}))
  weight: std::get<1>(convolution_backward(grad, self, weight, std::nullopt, stride, padding, dilation, true, output_padding, 1, {false, true, false}))
  bias: std::get<2>(convolution_backward(grad, self, weight, std::nullopt, stride, padding, dilation, true, output_padding, 1, {false, false, true}))

