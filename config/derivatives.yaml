  key: std::get<1>(_scaled_dot_product_attention_backward_with_lse(grad, query, key, value, output, logsumexp, is_causal, impl))
  value: std::get<2>(_scaled_dot_product_attention_backward_with_lse(grad, query, key, value, output, logsumexp, is_causal, impl))

# The saved logsumexp reproduces the softmax probabilities as exp(score - lse);
# masked/causal entries sit at -inf so their probability (and gradient) is 0.
- name: _scaled_dot_product_flash_attention_for_cpu(Tensor query, Tensor key, Tensor value, float dropout_p=0.0, bool is_causal=False, *, Tensor? attn_mask=None, float? scale=None) -> (Tensor output, Tensor logsumexp)
  query: std::get<0>(_scaled_dot_product_flash_attention_for_cpu_backward(grad, query, key, value, output, logsumexp, dropout_p, is_causal, attn_mask, scale))
  key: std::get<1>(_scaled_dot_product_flash_attention_for_cpu_backward(grad, query, key, value, output, logsumexp, dropout_p, is_causal, attn_mask, scale))
  value: std::get<2>(_scaled_dot_product_flash_attention_for_cpu_backward(grad, query, key, value, output, logsumexp, dropout_p, is_causal, attn_mask, scale))

# The fused attention contracts are differentiated from the logsumexp they
# saved: exp(score - lse) reproduces each probability, and the dropout seed
# they recorded reproduces the dropped positions.  Only the output is
# differentiable; the constant, the tables, the sizes and the seeds are not.

- name: _flash_attention_forward(Tensor query, Tensor key, Tensor value, Tensor? cum_seq_q, Tensor? cum_seq_k, SymInt max_q, SymInt max_k, float dropout_p, bool is_causal, bool return_debug_mask, *, float? scale=None, SymInt? window_size_left=None, SymInt? window_size_right=None, Tensor? seqused_k=None, Tensor? alibi_slopes=None, Tensor? block_table=None, int? num_splits=None) -> (Tensor output, Tensor softmax_logsumexp, Tensor rng_state, Tensor unused, Tensor debug_attn_mask)
  output_differentiability: [True, False, False, False, False]
  query: std::get<0>(_flash_attention_backward(grad, query, key, value, output, softmax_logsumexp, cum_seq_q.value_or(Tensor()), cum_seq_k.value_or(Tensor()), max_q, max_k, dropout_p, is_causal, rng_state, unused, scale, window_size_left, window_size_right))
  key: std::get<1>(_flash_attention_backward(grad, query, key, value, output, softmax_logsumexp, cum_seq_q.value_or(Tensor()), cum_seq_k.value_or(Tensor()), max_q, max_k, dropout_p, is_causal, rng_state, unused, scale, window_size_left, window_size_right))
  value: std::get<2>(_flash_attention_backward(grad, query, key, value, output, softmax_logsumexp, cum_seq_q.value_or(Tensor()), cum_seq_k.value_or(Tensor()), max_q, max_k, dropout_p, is_causal, rng_state, unused, scale, window_size_left, window_size_right))

