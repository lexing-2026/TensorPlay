    DTYPE: int
    OPERATOR: pow_count(ivec4(Y), X)
    FORMAT: rgba32i
  - NAME: pow_tensor_scalar_i32
    DTYPE: int
    OPERATOR: pow_count(X, ivec4(Y))
    FORMAT: rgba32i
  - NAME: div_scalar_i32
    DTYPE: int
    OPERATOR: X / Y
    FORMAT: rgba32i
