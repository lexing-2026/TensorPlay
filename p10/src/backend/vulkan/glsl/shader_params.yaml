activation:
  parameter_names_with_default_values:
    OPERATOR: X
    INPLACE: false
  generate_variant_forall:
    INPLACE:
      - VALUE: false
        SUFFIX: ""
      - VALUE: true
        SUFFIX: inplace
  shader_variants:
    - NAME: silu
      OPERATOR: "X / (1.0f + exp(-X))"
    - NAME: mish
      OPERATOR: "X * tanh(log1p_approx(exp(X)))"
    - NAME: relu6
      OPERATOR: "clamp(X, 0.0f, 6.0f)"
    - NAME: hardsigmoid
      OPERATOR: "clamp(X + 3.0f, 0.0f, 6.0f) / 6.0f"
    - NAME: hardswish
      OPERATOR: "X * clamp(X + 3.0f, 0.0f, 6.0f) / 6.0f"

activation_param:
  parameter_names_with_default_values:
    OPERATOR: X
    INPLACE: false
  generate_variant_forall:
    INPLACE:
      - VALUE: false
        SUFFIX: ""
      - VALUE: true
        SUFFIX: inplace
  shader_variants:
    - NAME: leaky_relu
      OPERATOR: "mix((X * P0), X, step(0.0f, X))"
    - NAME: threshold
      OPERATOR: "mix(X, P1, lessThanEqual(X, P0))"
    - NAME: hardshrink
      OPERATOR: "mix(X, vec4(0.0f), lessThanEqual(abs(X), P0))"

gelu:
