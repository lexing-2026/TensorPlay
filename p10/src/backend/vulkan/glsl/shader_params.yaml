  # A negative base has no power in the shader's own arithmetic: the magnitude
  # is raised and an odd exponent puts the sign back.  One texel carries
  # exponents of several kinds, so both the whole-number test and the odd-or-
  # even one are taken lane by lane.  A base of nothing is answered outside the
  # power itself, which names nothing for it.
