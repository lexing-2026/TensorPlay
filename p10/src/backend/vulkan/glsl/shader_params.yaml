binary_op_scalar:
  parameter_names_with_default_values:
    OPERATOR: X + Y
    INPLACE: false
    DTYPE: float
  generate_variant_forall:
    INPLACE:
    - VALUE: false
      SUFFIX: ''
    - VALUE: true
      SUFFIX: inplace
    FORMAT: *id001
  shader_variants:
  - NAME: add_scalar
    OPERATOR: X + Y
  - NAME: add_scalar_i32
    DTYPE: int
    OPERATOR: X + Y
    FORMAT: rgba32i
  - NAME: mul_scalar
    OPERATOR: X * Y
  - NAME: mul_scalar_i32
    DTYPE: int
    OPERATOR: X * Y
    FORMAT: rgba32i
  - NAME: pow_tensor_scalar
    OPERATOR: 'pow_guard(X, Y, (fract(Y) == vec4(0.0)) ? (mod(Y, vec4(2.0)) == vec4(0.0) ? pow(abs(X), Y) : sign(X) * pow(abs(X), Y)) : pow(X, Y))'
  - NAME: rsub_scalar
    OPERATOR: Y - X
  - NAME: rsub_scalar_i32
    DTYPE: int
    OPERATOR: Y - X
    FORMAT: rgba32i
  # The exponent is the payload and the base the broadcast number, so the
  # operand order of the template is reversed here.  A whole-number exponent
  # keeps a negative base signed: pow() itself refuses a negative base, so the
  # magnitude is raised and an even exponent puts the sign back.  A texel holds
  # exponents of all kinds, so whether the answer is whole and which sign it
  # carries is decided lane by lane.
  - NAME: pow_scalar_tensor
    OPERATOR: 'pow_guard(Y, X, mix(pow(Y, X), pow(abs(Y), X) * mix(vec4(1.0), sign(Y), notEqual(mod(X, vec4(2.0)), vec4(0.0))), equal(fract(X), vec4(0.0))))'
  # Two counts need no estimate in between: the exponent is spent one bit at a
  # time over the word itself, so the power lands on the number it names and a
  # fraction of anything but the two words that are their own reciprocals is
  # nothing.  A texel mixes exponents of both kinds, so each lane is spent on
  # its own.
