    OPERATOR: 'pow_guard(X, Y, mix(pow(X, Y), pow(abs(X), Y) * mix(vec4(1.0), sign(X), notEqual(mod(Y, vec4(2.0)), vec4(0.0))), equal(fract(Y), vec4(0.0))))'
