  - NAME: minimum
    OPERATOR: min(X, Y)
  - NAME: minimum_i32
    DTYPE: int
    OPERATOR: min(X, Y)
    FORMAT: rgba32i
  - NAME: atan2
    OPERATOR: atan(X, Y)
  - NAME: remainder
    OPERATOR: X - Y * floor(X / Y)
  - NAME: remainder_i32
    DTYPE: int
    OPERATOR: X - Y * ivec4(floor(vec4(X) / vec4(Y)))
    FORMAT: rgba32i
  - NAME: fmod
    OPERATOR: (X - Y * trunc(X / Y)) - Y * step(abs(Y), abs(X - Y * trunc(X / Y))) * sign(X - Y * trunc(X / Y))
  - NAME: fmod_i32
    DTYPE: int
    OPERATOR: X - Y * (X / Y)
    FORMAT: rgba32i
  - NAME: logaddexp
    OPERATOR: max(X, Y) + log(1.0f + exp(-abs(X - Y)))
  - NAME: sq_diff_i32
    DTYPE: int
