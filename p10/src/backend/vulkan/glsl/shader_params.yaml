  # The remainder carries the sign of the divisor, so it is the difference
  # against the floored quotient, not the truncated one.  Both operand orders
  # are declared: a number beside a payload can be the dividend or the divisor.
  - NAME: mod_scalar
    OPERATOR: X - Y * floor(X / Y)
  - NAME: mod_scalar_i32
    DTYPE: int
    OPERATOR: X - Y * ivec4(floor(vec4(X) / vec4(Y)))
    FORMAT: rgba32i
  - NAME: mod_scalar_tensor
    OPERATOR: Y - X * floor(Y / X)
  - NAME: mod_scalar_tensor_i32
    DTYPE: int
    OPERATOR: ivec4(Y) - X * ivec4(floor(vec4(Y) / vec4(X)))
    FORMAT: rgba32i
  - NAME: mul_scalar_recip
