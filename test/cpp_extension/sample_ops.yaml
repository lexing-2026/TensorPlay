# Sample custom-op definitions for the compile-time (C++) extension path.
# Consumed by tools/codegen/tensorplaygen.py via add_tensorplay_op();
- func: myext::scale_add(Tensor self, float factor, Scalar bias=0) -> Tensor
  dispatch:
    CPU: scale_add_cpu

- func: myext::scale_add_(Tensor(a!) self, float factor) -> Tensor(a!)
  dispatch:
    CPU: scale_add__cpu

- func: myext::sum_dims(Tensor self, int[] dims) -> Tensor
  dispatch:
    CPU: sum_dims_cpu
