name: rocm-wheel

# ROCm is intentionally opt-in. This workflow is dispatched manually after a
# release exists; it does not expand the default CPU/CUDA release matrix.
# Like the publishing matrix, it builds one wheel per supported Python ABI.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
        description: Existing GitHub Release tag to receive the ROCm wheel, e.g. v1.0.0
      variant:
        required: false
        type: string
        description: HIP variant from .github/rocm-variants.json; empty builds the default (gfx1100) variant

permissions: read-all

jobs:
  define-rocm-matrix:
    name: define-rocm-matrix
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.read-matrix.outputs.builds }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          show-progress: false
      - id: read-matrix
        shell: bash
        env:
          WANT_VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          # The HIP lane sweeps the same Python versions as the CPU/CUDA
          # publishing matrix; the extension module is ABI-bound, so each
          # version needs its own compiled wheel. An empty variant input
          # pins the run to the first (default) entry, so adding opt-in
          # variants never widens the default build; arch entries may be
          # a single target or a list baked into one wheel.
          matrix="$(jq -c --slurpfile variants .github/rocm-variants.json --arg want "$WANT_VARIANT" '
            [
              .python_versions[] as $python |
              (if $want == ""
               then $variants[0][0]
               else ($variants[0][] | select(.variant == $want))
               end) as $rocm |
              {
                python: $python,
                variant: $rocm.variant,
                toolkit: $rocm.toolkit,
                arch: (if ($rocm.arch | type) == "array"
                       then ($rocm.arch | join(";"))
                       else $rocm.arch end),
                image: $rocm.image,
                build_name: ("tensorplay-linux-" + $rocm.variant + "-py" + ($python | gsub("\\."; "_")))
              }
            ]' .github/wheel-platforms.json)"
          echo "builds=$matrix" >> "$GITHUB_OUTPUT"

  build-rocm:
    name: ${{ matrix.build_name }}
    needs: define-rocm-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.define-rocm-matrix.outputs.builds) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    container:
      image: ${{ matrix.image }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          show-progress: false

      # The container's system interpreter is too old for the build; every
      # lane pins the matrix Python, which also fixes the wheel's ABI tag.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Set compiler cache location
        shell: bash
        env:
          S3_CACHE_BUCKET: ${{ secrets.S3_CACHE_BUCKET }}
          S3_CACHE_ENDPOINT: ${{ secrets.S3_CACHE_ENDPOINT }}
          S3_CACHE_REGION: ${{ secrets.S3_CACHE_REGION }}
          S3_CACHE_ACCESS_KEY_ID: ${{ secrets.S3_CACHE_ACCESS_KEY_ID }}
          S3_CACHE_SECRET_ACCESS_KEY: ${{ secrets.S3_CACHE_SECRET_ACCESS_KEY }}
        run: |
          # The ROCm lane shares the same compiler-cache arrangement as the
          # main pipeline: sccache against the object-store bucket when the
          # repository carries the credentials, otherwise a disk cache that
          # the cache service moves around.
          if [[ -n "$S3_CACHE_BUCKET" ]]; then
            echo "TP_S3_CACHE=1" >> "$GITHUB_ENV"
            echo "SCCACHE_BUCKET=$S3_CACHE_BUCKET" >> "$GITHUB_ENV"
            echo "SCCACHE_ENDPOINT=$S3_CACHE_ENDPOINT" >> "$GITHUB_ENV"
            echo "SCCACHE_REGION=${S3_CACHE_REGION:-us-east-1}" >> "$GITHUB_ENV"
            echo "SCCACHE_S3_USE_SSL=true" >> "$GITHUB_ENV"
            echo "AWS_ACCESS_KEY_ID=$S3_CACHE_ACCESS_KEY_ID" >> "$GITHUB_ENV"
            echo "AWS_SECRET_ACCESS_KEY=$S3_CACHE_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"
          fi
          echo "CACHE_PATH=$HOME/.cache/sccache" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        id: compiler-cache
        if: ${{ env.TP_S3_CACHE != '1' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CACHE_PATH }}
          key: buildcache-${{ runner.os }}-${{ runner.arch }}-rocm-linux-x86_64-py${{ matrix.python }}-${{ github.sha }}
          restore-keys: |
            buildcache-${{ runner.os }}-${{ runner.arch }}-rocm-linux-x86_64-py${{ matrix.python }}-

      # The wheel links vendored SLEEF/NNPACK trees that CI checkouts do
      # not carry; fetch the pinned revisions before configuring. The
      # container image ships no git, so install it first; container jobs
      # run as root here, with sudo as a fallback for other images.
      - name: Restore vendored build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v git >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" != "0" ]; then SUDO=sudo; fi
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq git 1>/dev/null
          fi
          bash .github/scripts/restore-vendored-deps.sh

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          SUDO=""
          if [ "$(id -u)" != "0" ]; then SUDO=sudo; fi
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq libopenblas-dev 1>/dev/null
          # The container image carries no sccache package; install the
          # pinned release the other lanes use.
          if ! command -v sccache >/dev/null 2>&1; then
            arch="$(dpkg --print-architecture)"
            case "$arch" in
              amd64) sccache_target="x86_64-unknown-linux-musl" ;;
              arm64) sccache_target="aarch64-unknown-linux-musl" ;;
              *) echo "unsupported architecture: $arch" >&2; exit 1 ;;
            esac
            curl -fsSL -o /tmp/sccache.tar.gz \
              "https://github.com/mozilla/sccache/releases/download/v0.8.1/sccache-v0.8.1-${sccache_target}.tar.gz"
            sudo tar -C /tmp -xzf /tmp/sccache.tar.gz
            sudo install -m 0755 "/tmp/sccache-v0.8.1-${sccache_target}/sccache" /usr/local/bin/sccache
            rm -rf /tmp/sccache.tar.gz "/tmp/sccache-v0.8.1-${sccache_target}"
          fi

      - name: Set ROCm wheel version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          build_version="${RELEASE_TAG#v}"
          build_version="${build_version/-rc/rc}"
          echo "TENSORPLAY_BUILD_VERSION=${build_version}+${VARIANT}" >> "$GITHUB_ENV"
          echo "TENSORPLAY_BUILD_NUMBER=1" >> "$GITHUB_ENV"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          SUDO=""
          if [ "$(id -u)" != "0" ]; then SUDO=sudo; fi
          # python -m build creates an isolated venv, and the wheel links
          # host objects, so both the venv module and a C/C++ toolchain
          # must be present even though HIP carries its own device clang.
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq python3-venv build-essential 1>/dev/null
          # Older system pips predate the PEP 668 escape hatch; only pass
          # the flag when the installed pip actually understands it. The
          # tool-cache interpreter the matrix pins does not carry the
          # marker, but the fallback keeps bare images working too.
          PIP_EXTRA=""
          if python3 -m pip install --help 2>&1 | grep -q -- --break-system-packages; then
            PIP_EXTRA="--break-system-packages"
            echo "PIP_EXTRA=--break-system-packages" >> "$GITHUB_ENV"
          fi
          python3 -m pip install $PIP_EXTRA \
            --disable-pip-version-check --upgrade \
            pip build packaging numpy PyYAML typing-extensions

      - name: Build ROCm wheel
        shell: bash
        env:
          USE_CUDA: "OFF"
          USE_ROCM: "ON"
          TP_ROCM_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python3 -m build --wheel

      - name: Compiler cache statistics
        if: always()
        shell: bash
        run: |
          echo "Exact compiler cache hit: ${{ steps.compiler-cache.outputs.cache-hit }}"
          sccache --show-stats || true

      - name: Save compiler cache
        if: ${{ always() && !cancelled() && steps.compiler-cache.outputs.cache-hit != 'true' && env.TP_S3_CACHE != '1' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CACHE_PATH }}
          key: buildcache-${{ runner.os }}-${{ runner.arch }}-rocm-linux-x86_64-py${{ matrix.python }}-${{ github.sha }}

      - name: Verify ROCm wheel metadata
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          python3 - "$VARIANT" <<'PY'
          import sys
          from pathlib import Path

          from packaging.utils import parse_wheel_filename

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one ROCm wheel, found: {wheels}")
          _name, version, _build, _tags = parse_wheel_filename(wheels[0].name)
          local = str(version).partition("+")[2]
          if local != sys.argv[1]:
              raise SystemExit(f"Expected +{sys.argv[1]} wheel, got +{local}")
          print(f"Verified {wheels[0].name}")
          PY

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install ${PIP_EXTRA:-} --force-reinstall dist/*.whl
          cd /tmp
          python3 - <<'PY'
          import tensorplay as tp

          print("ROCm wheel import ok:", getattr(tp, "__version__", "unknown"))
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: tensorplay-rocm-${{ matrix.variant }}-${{ matrix.python }}-wheel
          path: dist/*.whl
          if-no-files-found: error

  publish-rocm:
    name: upload-rocm-wheel
    needs: build-rocm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tensorplay-rocm-*-wheel
          merge-multiple: true
          path: dist

      - name: Verify target release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Upload ROCm wheel to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/*.whl \
            --repo "$GITHUB_REPOSITORY" --clobber
