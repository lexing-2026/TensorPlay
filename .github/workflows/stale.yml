name: stale

# Marks issues/PRs with no activity for 60 days as stale and closes them 14
# days later, mirroring pytorch's stale-bot hygiene. Labeling something
# "good first issue" or "help wanted" exempts it.

on:
  schedule:
    # 01:30 UTC daily.
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "good first issue,help wanted"
          exempt-pr-labels: "good first issue,help wanted"
          stale-issue-message: >-
            This issue has had no activity for 60 days and is now marked
            stale. It will be closed in 14 days unless there is new activity.
            If it is still relevant, please leave a comment.
          stale-pr-message: >-
            This pull request has had no activity for 60 days and is now
            marked stale. It will be closed in 14 days unless there is new
            activity. Feel free to reopen or resubmit once you can continue.
          close-issue-reason: not_planned
          operations-per-run: 100
