name: readme-stats

# The suite size quoted in README.md / README.zh.md is measured, never typed.
# tools/update_readme_stats.py scans the test tree and rewrites the tp-stats
# regions; this workflow owns that number for main. Every change to the tests
# re-measures it and pushes the result back, so the badge and the benchmark
# paragraph cannot drift away from the suite and nobody has to remember to
# update a count by hand.
#
# A scan needs no build: no wheel, no CUDA, no pytest run. That also keeps the
# number independent of the runner -- a collected count would move with the
# compiled extension, the GPU and every optional package a module guards,
# which is exactly the drift this replaces.

on:
  push:
    branches:
      - main
    paths:
      - "test/**"
      - "tools/update_readme_stats.py"
      - "README.md"
      - "README.zh.md"
      - "pytest.ini"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Queue instead of cancelling: a cancelled measurement would leave the
  # committed number older than the tests it describes.
  group: readme-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
          show-progress: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Scan the test tree and rewrite the README regions
        shell: bash
        run: python tools/update_readme_stats.py

      - name: Commit the refreshed numbers
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md README.zh.md; then
            echo "README statistics already match the test tree"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh.md
          git commit -m "docs(readme): refresh the measured suite size"
          # A concurrent push to main can land between the checkout and here;
          # rebase onto it and try again rather than failing the run.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed the refreshed statistics"
              exit 0
            fi
            echo "push attempt $attempt failed; rebasing onto origin"
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          echo "could not push the refreshed statistics" >&2
          exit 1