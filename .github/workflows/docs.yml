name: docs

# Documentation CI. PRs that touch docs/** get a Sphinx build preview as an
# Actions artifact; pushes to main that touch docs/** additionally republish
# the rendered pages into the website-deploy branch, which Vercel deploys to
# https://tensorplay.cn (the website's scripts/generate-docs.mjs converts the
# Sphinx HTML into site content).

on:
  pull_request:
    paths:
      - "docs/**"
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  docs-build:
    name: docs-build
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Sphinx autodoc imports tensorplay._C, so the extension must be built.
      # CPU-only keeps the build fast and GPU-free.
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopenblas-dev 1>/dev/null

      - name: Restore vendored build dependencies
        shell: bash
        run: bash .github/scripts/restore-vendored-deps.sh

      - name: Build and install TensorPlay (CPU only)
        run: |
          python -m pip install --upgrade pip
          USE_CUDA=OFF python -m pip install .

      - name: Install docs requirements
        run: python -m pip install -r docs/requirements.txt

      - name: Build HTML docs
        run: make -C docs html

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/build/html
          if-no-files-found: error

  docs-publish:
    name: docs-publish
    needs: docs-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download HTML artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-html
          path: docs-html

      - name: Checkout website-deploy
        uses: actions/checkout@v4
        with:
          ref: website-deploy
          path: website

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Convert Sphinx HTML into site content
        working-directory: website
        env:
          TENSORPLAY_DOCS_BUILD: ${{ github.workspace }}/docs-html
        run: node scripts/generate-docs.mjs

      - name: Commit and push when content changed
        working-directory: website
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/docs-html public/docs
          if git diff --cached --quiet; then
            echo "No documentation changes to publish"
          else
            git commit -m "chore(docs): publish rendered docs from main@${GITHUB_SHA:0:8}"
            git push
          fi
