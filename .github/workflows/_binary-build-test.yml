name: binary-build-test

# Reusable wheel build plus smoke-test workflow. The wheel stays inside the
# runner, is tested there, and is uploaded directly to the GitHub Release only
# for a release tag. No Actions artifact is created.

on:
  workflow_call:
    inputs:
      build_name:
        required: true
        type: string
        description: Human-readable build name
      build_environment:
        required: true
        type: string
        description: Build environment identifier
      runs_on:
        required: true
        type: string
        description: GitHub runner label
      python_version:
        required: false
        type: string
        default: "3.11"
      cuda:
        required: false
        type: string
        default: "cpu"
        description: Variant tag, cpu or a CUDA tag such as cu124
      cuda_toolkit:
        required: false
        type: string
        default: "12.4.1"
        description: CUDA Toolkit version
      upload_release:
        required: false
        type: boolean
        default: false
        description: Upload the tested wheel to a GitHub Release
      run_cpu_benchmarks:
        required: false
        type: boolean
        default: false
        description: Run CPU operator and compiler performance benchmarks
      cpu_benchmark_suite:
        required: false
        type: string
        default: short
        description: "CPU benchmark suite size: short, long, or all"
      build_version:
        required: false
        type: string
        default: ""
        description: >-
          Explicit PEP 440 base version (nightly/preview channel), for example
          1.0.0.dev20260828. The variant local label (+cu124, +cpu) is appended
          here, following the repository's binary versioning rule. Wheels are uploaded
          to the rolling "nightly" release instead of the current tag.
      build_number:
        required: false
        type: string
        default: "1"
        description: >-
          TENSORPLAY_BUILD_NUMBER for the nightly channel. Values greater than
          1 append a .post<N> suffix, allowing a same-day republish.

jobs:
  build-test:
    name: ${{ inputs.build_name }}
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
    timeout-minutes: 150
    env:
      BUILD_ENVIRONMENT: ${{ inputs.build_environment }}
      SHA1: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          show-progress: false

      # Linux x86_64 wheels link the same accelerated BLAS as the release
      # defaults: MKL static libraries unpacked from the mkl wheels under
      # /opt/intel (MKLROOT), the way the reference project's CI image
      # provisions it. Other platforms keep their vendor defaults.
      - name: Install MKL (linux x86_64)
        if: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d /opt/intel/lib ]; then
            sudo mkdir -p /opt/intel
            pushd "$(mktemp -d)"
            python -m pip install --quiet wheel
            python -m pip download --quiet -d . 'mkl-static==2024.2.0'
            python -m wheel unpack mkl_static-2024.2.0-py2.py3-none-manylinux1_x86_64.whl
            python -m wheel unpack mkl_include-2024.2.0-py2.py3-none-manylinux1_x86_64.whl
            sudo cp -a mkl_static-2024.2.0/mkl_static-2024.2.0.data/data/lib/. /opt/intel/lib/
            sudo cp -a mkl_include-2024.2.0/mkl_include-2024.2.0.data/data/include/. /opt/intel/include/
            popd
          fi
          echo "MKLROOT=/opt/intel" >> "$GITHUB_ENV"

      # Non-x86_64 Linux (arm64) uses OpenBLAS from the runner repositories.
      - name: Install OpenBLAS (linux arm64)
        if: ${{ runner.os == 'Linux' && runner.arch == 'ARM64' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopenblas-dev 1>/dev/null

      # Windows gloo requires a system libuv; provision a prebuilt libuv
      # tarball into the runner's Python prefix and export libuv_ROOT for
      # its find_library call. The Windows Python prints its prefix as a
      # drive path; convert it to an MSYS path before handing it to the
      # shell tools (tar would otherwise read "C:\..." as a remote spec).
      - name: Install libuv (windows)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(cygpath -u "$(python -c 'import sys, pathlib; print(pathlib.Path(sys.prefix))')")"
          curl -sL -o libuv.tar.bz2 https://s3.amazonaws.com/ossci-windows/libuv-1.40.0-h8ffe710_0.tar.bz2
          7z x -aoa libuv.tar.bz2 -o"$PWD" >/dev/null
          mkdir -p "$prefix"
          tar -xf libuv.tar -C "$prefix"
          test -d "$prefix/Library"
          echo "libuv_ROOT=$(cygpath -w "$prefix/Library")" >> "$GITHUB_ENV"

      # The wheel links vendored SLEEF/NNPACK trees that CI checkouts do
      # not carry; fetch the pinned revisions before configuring.
      - name: Restore vendored build dependencies
        shell: bash
        run: bash .github/scripts/restore-vendored-deps.sh

      # Release tags pin the exact version. CUDA wheels use a local version
      # suffix so CPU and CUDA files can coexist in one GitHub Release.
      - name: Set TENSORPLAY_BUILD_VERSION on release tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          build_version="${GITHUB_REF_NAME#v}"
          # Release candidate tags use PEP 440 rc segments:
          # v1.0.0-rc1 -> 1.0.0rc1
          build_version="${build_version/-rc/rc}"
          if [[ "${{ inputs.cuda }}" != "cpu" ]]; then
            build_version="${build_version}+${{ inputs.cuda }}"
          fi
          echo "TENSORPLAY_BUILD_VERSION=${build_version}" >> "$GITHUB_ENV"
          echo "TENSORPLAY_BUILD_NUMBER=1" >> "$GITHUB_ENV"

      # Nightly/preview channel: the caller computed the base version
      # (X.Y.0.dev<date>, see tools/generate_tensorplay_version.py). Variant
      # are appended as-is, CPU gets +cpu except on macOS.
      - name: Set TENSORPLAY_BUILD_VERSION for nightly
        if: ${{ inputs.build_version != '' }}
        shell: bash
        run: |
          set -euo pipefail
          build_version="${{ inputs.build_version }}"
          case "${{ inputs.cuda }}" in
            cpu)
              if [[ "$RUNNER_OS" != "macOS" ]]; then
                build_version="${build_version}+cpu"
              fi
              ;;
            *)
              build_version="${build_version}+${{ inputs.cuda }}"
              ;;
          esac
          echo "TENSORPLAY_BUILD_VERSION=${build_version}" >> "$GITHUB_ENV"
          # The caller's build_number is only non-empty on workflow_dispatch;
          # fall back to 1 so the version metadata never sees an empty value.
          echo "TENSORPLAY_BUILD_NUMBER=${{ inputs.build_number || '1' }}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      # This installs the compiler/toolkit only. Free GitHub-hosted runners
      # have no GPU, so CUDA kernels are never executed in this workflow.
      - uses: jimver/cuda-toolkit@v0.2.36
        if: ${{ inputs.cuda != 'cpu' }}
        with:
          cuda: ${{ inputs.cuda_toolkit }}

      - name: Build wheel
        shell: bash
        env:
          SKBUILD_CMAKE_DEFINE: >-
            ${{ inputs.cuda != 'cpu' && 'USE_CUDA=ON' || 'USE_CUDA=OFF' }};USE_MPI=OFF
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install built wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl numpy PyYAML typing-extensions

      - name: Smoke test (CPU import plus tiny op)
        if: ${{ inputs.cuda == 'cpu' }}
        shell: bash
        # Run outside the checkout: the source tree carries the CMake-generated
        # version.py and the _C shared object, so a repo-root import would
        # shadow the wheel and hide packaging regressions.
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import tensorplay as tp
          x = tp.rand(4, 4)
          y = x @ x
          assert y.shape == (4, 4)
          print("CPU smoke test ok:", getattr(tp, "__version__", "ok"))
          PY

      - name: Smoke test (CUDA import only)
        if: ${{ inputs.cuda != 'cpu' }}
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import tensorplay as tp
          print("CUDA wheel import ok:", getattr(tp, "__version__", "ok"))
          PY

      - name: Run CPU operator, training, and Stax benchmarks
        if: ${{ inputs.run_cpu_benchmarks && inputs.cuda == 'cpu' }}
        shell: bash
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          suite="${{ inputs.cpu_benchmark_suite }}"
          if [[ "$suite" == "all" ]]; then
            suite=long
          fi
          python benchmark/host_probe.py --threads 2 \
            --json-out benchmark-results/host-probe.json \
            | tee benchmark-results/host-probe.log
          python benchmark/bench_cpu_operator.py --suite "$suite" --dtype f32 \
            --reps 3 --threads 2 --flops --json-out benchmark-results/cpu-operator.json \
            | tee benchmark-results/cpu-operator.log
          python benchmark/bench_cpu_operator.py --suite "$suite" --dtype f64 \
            --reps 3 --threads 2 --flops --json-out benchmark-results/cpu-operator-f64.json \
            | tee benchmark-results/cpu-operator-f64.log
          python benchmark/bench_train_cpu.py --reps 2 --threads 2 \
            --json-out benchmark-results/cpu-train.json \
            | tee benchmark-results/cpu-train.log
          python benchmark/bench_stax_cpu.py --reps 3 --warmup 2 --threads 2 \
            --json-out benchmark-results/stax-cpu.json \
            | tee benchmark-results/stax-cpu.log
          python benchmark/bench_scaling_curves.py --reps 3 --threads 2 \
            --json-out benchmark-results/scaling.json \
            | tee benchmark-results/scaling.log

      - name: Enforce CPU performance floor
        if: ${{ inputs.run_cpu_benchmarks && inputs.cuda == 'cpu' }}
        shell: bash
        run: |
          set -euo pipefail
          suite="${{ inputs.cpu_benchmark_suite }}"
          if [[ "$suite" == "all" ]]; then
            suite=long
          fi
          python benchmark/check_performance_regression.py \
            --operator-json benchmark-results/cpu-operator.json \
            --operator-baseline-json "benchmark/baselines/cpu-operator-$suite.json" \
            --operator-f64-json benchmark-results/cpu-operator-f64.json \
            --operator-f64-baseline-json "benchmark/baselines/cpu-operator-$suite-f64.json" \
            --train-json benchmark-results/cpu-train.json \
            --train-baseline-json benchmark/baselines/cpu-train.json \
            --stax-json benchmark-results/stax-cpu.json \
            --stax-baseline-json benchmark/baselines/stax-cpu.json \
            --operator-max-slowdown 0.30 \
            --train-max-slowdown 0.20 \
            --stax-max-slowdown 0.25 \
            --stax-compile-max-slowdown 0.50 \
            --summary-out benchmark-results/cpu-regression-summary.md

      - name: Publish CPU performance summary
        if: ${{ always() && inputs.run_cpu_benchmarks && inputs.cuda == 'cpu' }}
        shell: bash
        run: |
          if [[ -f benchmark-results/cpu-regression-summary.md ]]; then
            cat benchmark-results/cpu-regression-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload CPU performance logs
        if: ${{ always() && inputs.run_cpu_benchmarks && inputs.cuda == 'cpu' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.build_name }}-performance
          path: benchmark-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload tested wheel to GitHub Release
        if: ${{ inputs.upload_release && (startsWith(github.ref, 'refs/tags/v') || inputs.build_version != '') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.build_version }}" != "" ]]; then
            release="nightly"
            # The rolling channel may not exist yet on the first publish;
            # every later upload overwrites same-versioned assets. The notes
            # copy lives in docs/release-notes/nightly.md; nightly.yml's
            # create-nightly-release keeps an existing release synced.
            if ! gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$release" \
                --repo "$GITHUB_REPOSITORY" \
                --prerelease \
                --title "TensorPlay nightly" \
                --notes-file docs/release-notes/nightly.md
            fi
          else
            release="$GITHUB_REF_NAME"
          fi
          gh release upload "$release" dist/*.whl \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
