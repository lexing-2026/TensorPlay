name: nightly

# Nightly preview wheels are built on a daily schedule from the default
# branch head, following the X.Y.0.dev<UTC date>[+cuXXX|+cpu] version rule
# computed by tools/generate_tensorplay_version.py. Wheels land on the
# rolling "nightly" GitHub Release, and the wheel-index workflow
# republishes the whl/nightly/<variant>/ indexes on pypi-pages from
# release events. Only the newest dev version per variant is retained.
#
# workflow_dispatch stays available for manual retries of a failed matrix
# leg or off-schedule builds; the version/build_number/filters inputs
# shape such runs. Every run drops matrix legs whose wheel for the
# computed version is already on the nightly release, so retries only
# build the missing wheels (dispatch with build_number > 1 to rebuild a
# published wheel on purpose).

on:
  schedule:
    # 02:30 UTC daily, ahead of the index rescan window and off the
    # quarter-hour runner rush.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      version:
        required: false
        type: string
        default: ""
        description: >-
          Base version without variant local labels. Defaults to the nightly
          rule applied to version.txt, e.g. 1.0.0.dev20260828.
      build_number:
        required: false
        type: string
        default: "1"
        description: >-
          Values greater than 1 append .post<N> to the version, allowing a
          same-day republish.
      cpu_platforms:
        required: false
        type: string
        default: ""
        description: >-
          Space-separated CPU platform names from .github/wheel-platforms.json
          to build, for example "linux-x86_64 macos-arm64". Empty means all.
      cuda_variants:
        required: false
        type: string
        default: ""
        description: >-
          Space-separated CUDA variants from .github/cuda-variants.json to
          build, for example "cu124 cu126". Empty means all.

permissions: read-all

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  define-wheel-matrix:
    name: define-wheel-matrix
    needs:
      - prepare
    runs-on: ubuntu-latest
    outputs:
      cpu: ${{ steps.skip-published.outputs.cpu }}
      cuda: ${{ steps.skip-published.outputs.cuda }}
      variants: ${{ steps.read-matrix.outputs.variants }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          show-progress: false
      - id: read-matrix
        shell: bash
        env:
          CPU_PLATFORMS: ${{ inputs.cpu_platforms }}
          CUDA_VARIANTS: ${{ inputs.cuda_variants }}
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Turn the space-separated filters into JSON arrays; an empty array
          # means "no filter".
          cpu_list='[]'
          if [[ -n "$CPU_PLATFORMS" ]]; then
            cpu_list="$(printf '%s\n' $CPU_PLATFORMS | jq -R . | jq -s -c .)"
          fi
          cuda_list='[]'
          if [[ -n "$CUDA_VARIANTS" ]]; then
            cuda_list="$(printf '%s\n' $CUDA_VARIANTS | jq -R . | jq -s -c .)"
          fi
          cpu_matrix="$(jq -c --argjson cpu_list "$cpu_list" '
            [
              .cpu_platforms[] as $platform
              | select(($cpu_list | length == 0) or ($platform.name | IN($cpu_list[])))
              | .python_versions[] as $python
              | {
                  platform: $platform.name,
                  runner: $platform.runner,
                  python: $python,
                  build_name: ("tensorplay-" + $platform.name + "-py" + ($python | gsub("\\."; "_")) + "-cpu-nightly")
                }
            ]
          ' .github/wheel-platforms.json)"
          cuda_matrix="$(jq -c \
            --slurpfile variants .github/cuda-variants.json \
            --argjson cuda_list "$cuda_list" '
            [
              .cuda_platforms[] as $platform
              | .python_versions[] as $python
              | $variants[0][] as $cuda
              | select(($cuda_list | length == 0) or ($cuda.variant | IN($cuda_list[])))
              | {
                  platform: $platform.name,
                  runner: $platform.runner,
                  python: $python,
                  variant: $cuda.variant,
                  toolkit: $cuda.toolkit,
                  build_name: ("tensorplay-" + $platform.name + "-" + $cuda.variant + "-py" + ($python | gsub("\\."; "_")) + "-nightly")
                }
            ]
          ' .github/wheel-platforms.json)"
          active_variants="$(jq -c \
            --slurpfile variants .github/cuda-variants.json \
            --argjson cuda_list "$cuda_list" '
            [$variants[0][] | select(($cuda_list | length == 0) or (.variant | IN($cuda_list[])))]
          ' .github/wheel-platforms.json)"
          if [[ "$(jq 'length' <<< "$cpu_matrix")" == "0" && "$(jq 'length' <<< "$cuda_matrix")" == "0" ]]; then
            echo "The platform/variant filters selected no wheels" >&2
            exit 1
          fi
          echo "cpu=$cpu_matrix" >> "$GITHUB_OUTPUT"
          echo "cuda=$cuda_matrix" >> "$GITHUB_OUTPUT"
          echo "variants=$active_variants" >> "$GITHUB_OUTPUT"

      - id: skip-published
        name: Drop matrix legs whose wheel is already on the nightly release
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
          CPU_MATRIX: ${{ steps.read-matrix.outputs.cpu }}
          CUDA_MATRIX: ${{ steps.read-matrix.outputs.cuda }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A re-dispatch (retry after a partial failure) must not rebuild
          # legs whose wheel for this exact version is already published:
          # every existing asset is matched by name and its matrix leg is
          # dropped, so only the missing wheels get built. Re-releasing the
          # same wheel on purpose: dispatch with build_number > 1, which
          # changes the version and defeats the skip.
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq '.assets[].name' 2>/dev/null || true)"
          printf '%s' "$existing" > "$RUNNER_TEMP/nightly-assets.txt"
          python .github/scripts/filter_published_wheels.py \
            --version "$NIGHTLY_VERSION" \
            --cpu-matrix "$CPU_MATRIX" \
            --cuda-matrix "$CUDA_MATRIX" \
            --existing "$RUNNER_TEMP/nightly-assets.txt" \
            >> "$GITHUB_OUTPUT"


  prepare:
    name: prepare-nightly-version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-build.outputs.version }}
      build_number: ${{ steps.version-build.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          show-progress: false
          # The schedule guard needs the run's head SHA for the comparison.
          fetch-depth: 0
      - id: scheduled-unchanged
        name: Skip the scheduled run when main has not moved
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The trunk runs already publish each smoke-tested main push to the
          # nightly channel, so the scheduled run only fills gaps. When no
          # commit has landed on main since the last fully green nightly,
          # there is nothing new to fill: every wheel for this date is on the
          # release and the matrix would come back empty anyway.
          last="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow nightly \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // ""')"
          if [[ -n "$last" && "$last" == "${{ github.sha }}" ]]; then
            echo "main is at ${last#0}, already published by the last green nightly; skipping"
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          else
            echo "unchanged=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: ${{ steps.scheduled-unchanged.outputs.unchanged != 'true' }}
        with:
          python-version: "3.11"
      - name: Install packaging
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet packaging
      - name: Compute the nightly version
        id: version-build
        if: ${{ steps.scheduled-unchanged.outputs.unchanged != 'true' }}
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="$(python -c 'from tools.generate_tensorplay_version import compute_nightly_version; print(compute_nightly_version())')"
          fi
          # The dispatch default applies only to workflow_dispatch; on other
          # events the input context yields an empty string, which the
          # wheel build must never see (an empty build number is invalid).
          build_number="${INPUT_BUILD_NUMBER:-1}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "Nightly base version: ${version} (build number ${build_number})"

  create-nightly-release:
    name: create-nightly-release
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          show-progress: false
      - name: Ensure the rolling nightly release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The copy lives in docs/release-notes/nightly.md so it can be
          # edited like any other file; edit is idempotent when the body
          # already matches.
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit nightly \
              --repo "$GITHUB_REPOSITORY" \
              --title "TensorPlay nightly" \
              --notes-file docs/release-notes/nightly.md
          else
            gh release create nightly \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "TensorPlay nightly" \
              --notes-file docs/release-notes/nightly.md
          fi

  cpu-build:
    name: ${{ matrix.build_name }}-build-test
    needs:
      - define-wheel-matrix
      - prepare
      - create-nightly-release
    # An unchanged main (schedule guard) yields an empty version: every
    # wheel for today was already published by the trunk runs.
    if: needs.prepare.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.define-wheel-matrix.outputs.cpu) }}
    permissions:
      contents: write
    uses: ./.github/workflows/_binary-build-test.yml
    with:
      build_name: ${{ matrix.build_name }}
      build_environment: ${{ format('nightly-{0}-py{1}-cpu', matrix.platform, matrix.python) }}
      runs_on: ${{ matrix.runner }}
      python_version: ${{ matrix.python }}
      build_version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      upload_release: true

  cuda-build:
    name: ${{ matrix.build_name }}-build-test
    needs:
      - define-wheel-matrix
      - prepare
      - create-nightly-release
    # An unchanged main (schedule guard) yields an empty version: every
    # wheel for today was already published by the trunk runs.
    if: needs.prepare.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.define-wheel-matrix.outputs.cuda) }}
    permissions:
      contents: write
    uses: ./.github/workflows/_binary-build-test.yml
    with:
      build_name: ${{ matrix.build_name }}
      build_environment: ${{ format('nightly-{0}-py{1}-{2}', matrix.platform, matrix.python, matrix.variant) }}
      runs_on: ${{ matrix.runner }}
      python_version: ${{ matrix.python }}
      cuda: ${{ matrix.variant }}
      cuda_toolkit: ${{ matrix.toolkit }}
      build_version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      upload_release: true
