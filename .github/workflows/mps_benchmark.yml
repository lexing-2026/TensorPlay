name: mps_benchmark

on:
  push:
    tags:
      - "ciflow/mps-bench/*"
  workflow_dispatch:
    inputs:
      test_mode:
        description: MPS operator benchmark suite size
        required: false
        type: choice
        options:
          - short
          - long
          - all
        default: short
      chain_reps:
        description: >
          Invocations per timed sample. 1 is the per-call timing the recorded
          history uses; raise it to measure launch cost instead of wait cost.
        required: false
        type: choice
        options:
          - "1"
          - "4"
          - "16"
        default: "1"
      require_speedup_win:
        description: Fail when the benchmark is not faster than the reference runtime
        required: false
        type: boolean
        default: false
      reference_requirement:
        description: >
          Package requirement for the second benchmark pass. The default
          follows the latest release; every run records the version it
          actually compared against.
        required: false
        type: string
        default: "torch"
      reference_skip_cases:
        description: Cases left out of the second benchmark pass
        required: false
        type: string
        default: "layer_norm[64x1024],constant_pad_nd[64x64x64]"
      runs_on:
        description: Runner image used for the build and the measurements
        required: false
        type: choice
        options:
          - macos-14
          - macos-15
        default: macos-15
  schedule:
    - cron: "0 5 * * 1"
  pull_request:
    paths:
      - "benchmark/bench_mps_operator.py"
      - "benchmark/check_mps_performance_regression.py"
      - "benchmark/check_mps_reference_speedup.py"
      - "benchmark/test_mps_reference_speedup.py"
      - ".github/workflows/mps_benchmark.yml"
      - ".github/workflows/_binary-build-test.yml"
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

jobs:
  mps-operator-benchmark:
    name: mps-operator-benchmark
    # The permissions must cover the reusable workflow's release job
    # (contents/id-token/attestations write), even though that job is
    # disabled here via upload_release: false; GitHub rejects the whole
    # call with a startup failure when the caller grants less.
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_binary-build-test.yml
    with:
      build_name: tensorplay-mps-operator
      build_environment: mps-operator-benchmark
      runs_on: ${{ inputs.runs_on || 'macos-15' }}
      python_version: "3.12"
      run_mps_benchmarks: true
      mps_benchmark_suite: ${{ inputs.test_mode || 'short' }}
      mps_benchmark_chain_reps: ${{ inputs.chain_reps || '1' }}
      # Every run measures the reference runtime on the same runner, so a run
      # either proves the speedup or records what is still missing. The
      # scheduled run enforces the floor; dispatched runs do so on request.
      mps_compare_reference: true
      mps_require_speedup_win: ${{ github.event_name == 'schedule' || inputs.require_speedup_win }}
      mps_reference_requirement: ${{ inputs.reference_requirement || 'torch' }}
      mps_reference_skip_cases: ${{ inputs.reference_skip_cases || 'layer_norm[64x1024]' }}
      upload_release: false
    secrets: inherit

  publish-bench-data:
    name: publish-bench-data
    # Publishes the merged benchmark snapshot to the bench-data branch so the
    # website benchmark page can fetch it directly. Scheduled, tagged, and
    # dispatched runs from the default branch publish; pull requests and
    # branch experiments never do.
    needs: mps-operator-benchmark
    # Every completed benchmark run is recorded into the same-hardware
    # history, whether or not the performance gate passed, so new operators
    # and dtypes become part of the baseline from their first run onward.  A
    # chained run times something else entirely (mean of several calls per
    # sample), so it never joins that history.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.chain_reps == '1') && always() && needs.mps-operator-benchmark.result != 'skipped' && needs.mps-operator-benchmark.result != 'cancelled' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # The workflow defaults to read-all; the forced push to the orphan
    # bench-data branch needs contents write on the job's own token.
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download benchmark artifact
        uses: actions/download-artifact@v8
        with:
          name: tensorplay-mps-operator-mps-performance
          path: benchmark-results

      - name: Merge benchmark snapshot
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TP_BENCH_ARCH: mps
        run: |
          set -euo pipefail
          # Clone the existing branch snapshot so arches published by other
          # runs (cpu / cuda / hip / vk) survive this update.
          git clone --depth 1 --branch bench-data \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            bench-data-clone || true
          previous=""
          if [[ -f bench-data-clone/latest.json ]]; then
            previous="bench-data-clone/latest.json"
          fi
          python3 tools/publish_bench_data.py benchmark-results latest.json \
            --arch "$TP_BENCH_ARCH" --merge "$previous" \
            --baselines-dir benchmark/baselines \
            --host-probe benchmark-results/host-probe.json

      - name: Push to bench-data branch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Keep exactly one orphan commit on the branch so history never grows.
          git init -q bench-data-worktree
          cd bench-data-worktree
          git config user.name "TensorPlay CI"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan bench-data
          cp ../latest.json .
          git add latest.json
          git commit -m "bench data snapshot ${GITHUB_SHA::7} (${GITHUB_EVENT_NAME})"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin bench-data