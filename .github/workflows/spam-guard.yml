name: spam-guard

# First line of defense against unsolicited automated PRs (e.g. the "Vercel
# Speed Insights" bot drive-by). Runs on pull_request_target but only READS PR
# metadata and diff text via the GitHub API -- no code from the PR head is
# ever executed.
#
# Rules (all require the author to have no previously merged PR here):
#   1. Bot/app authors not on the allowlist -> close + "spam" label.
#   2. Title/body matches the spam signature list -> close + "spam" label.
#   3. Otherwise, first-time authors -> "needs triage" for human review.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  guard:
    name: spam-guard
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate the PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          meta="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json author,title,body,files)"
          author="$(jq -r '.author.login' <<< "$meta")"
          # gh dropped the isBot field; the author's account type comes from
          # the user endpoint (type is "Bot" for app identities).
          is_bot="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '.user.type == "Bot"')"
          title="$(jq -r '.title' <<< "$meta")"
          body="$(jq -r '.body // ""' <<< "$meta")"

          # Bots that are part of this repository's automation are allowed.
          allowlist='^(dependabot|github-actions)'
          if [[ "$is_bot" == "true" ]] && ! [[ "$author" =~ $allowlist ]]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label spam
            gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --comment "Automated PR from an integration this project does not use. Closing as spam (spam-guard rule 1)."
            echo "Closed bot PR #$PR_NUMBER (author: $author)"
            exit 0
          fi

          # Authors with a merged PR here are trusted enough to skip scoring.
          merged_before="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged \
            --author "$author" --limit 1 --json number --jq 'length')"
          if [[ "$merged_before" != "0" ]]; then
            echo "Author $author has merged PRs; skipping spam checks"
            exit 0
          fi

          # Spam signatures commonly seen in drive-by PRs (case-insensitive).
          spam_re='speed insights|vercel analytics|google analytics snippet|casino|crypto airdrop|buy now|promo code|url shortener|bit\.ly|t\.co/'
          if printf '%s\n%s' "$title" "$body" | grep -qiE "$spam_re"; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label spam
            gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --comment "This pull request matches known spam signatures and the author has no merged contributions here. Closing as spam (spam-guard rule 2). If this is a mistake, please open an issue first."
            echo "Closed spam PR #$PR_NUMBER"
            exit 0
          fi

          # First-time author without spam signals: route to human triage.
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "needs triage"
          echo "Flagged first-time PR #$PR_NUMBER for triage"
