name: trunk

# Main-branch CI matrix. Each job builds and smoke-tests its wheel on the same
# runner, so no wheel needs to cross jobs or be stored as an Actions artifact.

on:
  push:
    branches:
      - main
      - release/*
    # Docs and CI-meta pushes cannot change wheel contents (the build-skip
    # job covers the remaining cases); not starting the workflow also keeps
    # a running build from being cancelled by the branch-level concurrency
    # group, which is what kept killing the macOS lane mid-build. CI-only
    # edits belong to that set: they ship in the next code-bearing wheel.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  # Branch-level group: a new push to the same branch supersedes the run
  # for the previous head instead of racing it. Including the SHA would
  # let every intermediate commit of a rapid series run its own full
  # matrix, so only the tip of the branch gets machine time.
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: read-all

jobs:
  define-wheel-matrix:
    name: define-wheel-matrix
    runs-on: ubuntu-latest
    outputs:
      cpu: ${{ steps.read-matrix.outputs.cpu }}
      cuda: ${{ steps.read-matrix.outputs.cuda }}
      cuda_trunk: ${{ steps.read-matrix.outputs.cuda_trunk }}
      run_cuda: ${{ steps.lanes.outputs.run_cuda }}
      build_skip: ${{ steps.build-skip.outputs.skip }}
      nightly_version: ${{ steps.nightly-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          show-progress: false
          fetch-depth: 0
      - id: read-matrix
        shell: bash
        run: |
          set -euo pipefail
          # Trunk lane: newest toolkit only, one wheel per CUDA platform;
          # tags and release branches build every configured variant.
          cuda_trunk_matrix="$(jq -c --slurpfile variants .github/cuda-variants.json '
            [
              .cuda_platforms[] as $platform |
              {
                platform: $platform.name,
                runner: $platform.runner,
                python: "3.12",
                variant: ($variants[0][-1].variant),
                toolkit: ($variants[0][-1].toolkit),
                build_name: ("tensorplay-" + $platform.name + "-" + ($variants[0][-1].variant) + "-py3_12")
              }
            ]
          ' .github/wheel-platforms.json)"
          echo "cuda_trunk=$cuda_trunk_matrix" >> "$GITHUB_OUTPUT"
          # Trunk verifies one Python per platform (matching the CUDA
          # trunk lane): the four wheels of a platform compile identical
          # C/CUDA code and differ only in the Python ABI, so the full
          # version sweep adds no signal here. Nightly and release builds
          # still cover every configured version.
          cpu_matrix="$(jq -c '
            [
              .cpu_platforms[] as $platform |
              {
                platform: $platform.name,
                runner: $platform.runner,
                python: "3.12",
                build_name: ("tensorplay-" + $platform.name + "-py3_12-cpu")
              }
            ]
          ' .github/wheel-platforms.json)"
          cuda_matrix="$(jq -c --slurpfile variants .github/cuda-variants.json '
            [
              .cuda_platforms[] as $platform |
              .python_versions[] as $python |
              $variants[0][] as $cuda |
              {
                platform: $platform.name,
                runner: $platform.runner,
                python: $python,
                variant: $cuda.variant,
                toolkit: $cuda.toolkit,
                build_name: ("tensorplay-" + $platform.name + "-" + $cuda.variant + "-py" + ($python | gsub("\\."; "_")))
              }
            ]
          ' .github/wheel-platforms.json)"
          echo "cpu=$cpu_matrix" >> "$GITHUB_OUTPUT"
          echo "cuda=$cuda_matrix" >> "$GITHUB_OUTPUT"
      - id: nightly-version
        if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          # Branch pushes publish the wheels they just built to the rolling
          # nightly channel, so the smoke-tested artifacts are the nightly
          # release instead of being discarded. The version rule matches the
          # dedicated nightly workflow (X.Y.0.dev<UTC date>); same-day pushes
          # overwrite the same-versioned assets, keeping the channel on the
          # newest verified main.
          python3 -m pip install --disable-pip-version-check --quiet packaging
          version="$(python3 -c 'from tools.generate_tensorplay_version import compute_nightly_version; print(compute_nightly_version())')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Nightly version: ${version}"
      - id: lanes
        shell: bash
        env:
          GH_EVENT: ${{ github.event_name }}
          GH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # CUDA lanes are the most expensive slice of the matrix (GPU
          # toolkits download, fat .cu compiles). On plain pushes, skip
          # them when the change cannot touch device code: release and
          # tag builds, scheduled runs, and manual dispatches always
          # build the full matrix because their wheels get published.
          run_cuda=true
          if [[ "$GH_EVENT" == "push" ]] \
             && git rev-parse --verify -q "$GH_BEFORE^{commit}" >/dev/null; then
            if ! git diff --name-only "$GH_BEFORE"...HEAD \
                  | grep -qE '^p10/|^tpx/|^include/|^config/|^tools/|^cmake/|CMakeLists\.txt$|\.cu$|^(pyproject|setup)\.toml$|^version\.txt$|\.github/(workflows|scripts)/'; then
              echo "No CUDA-relevant paths in the pushed range; skipping CUDA lanes"
              run_cuda=false
            fi
          fi
          echo "run_cuda=$run_cuda" >> "$GITHUB_OUTPUT"

      - id: build-skip
        if: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == 'main' }}
        shell: bash
        env:
          GH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # CI/docs-only pushes cannot change wheel contents, so the whole
          # build matrix is skipped; the next code-bearing push publishes
          # fresh same-day nightly wheels and the scheduled nightly run
          # fills any gaps. Tags, release branches and manual dispatches
          # always build because their wheels get published.
          skip=false
          if git rev-parse --verify -q "$GH_BEFORE^{commit}" >/dev/null; then
            if [[ -z "$(git diff --name-only "$GH_BEFORE"...HEAD \
                    | grep -vE '^\.github/|^docs/|\.md$|^LICENSE|^\.gitignore' || true)" ]]; then
              echo "CI/docs-only push; skipping the build matrix"
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  cpu-build:
    name: ${{ matrix.build_name }}-build-test
    needs: define-wheel-matrix
    # CI/docs-only pushes publish no new wheel; skip the build matrix.
    if: needs.define-wheel-matrix.outputs.build_skip != 'true'
    permissions:
      # The called workflow's release job needs contents: write to upload
      # wheels to a GitHub Release on tag builds; the job-level grant
      # here keeps the top-level read-all default untouched.
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.define-wheel-matrix.outputs.cpu) }}
    uses: ./.github/workflows/_binary-build-test.yml
    with:
      build_name: ${{ matrix.build_name }}
      build_environment: ${{ format('trunk-{0}-py{1}-cpu', matrix.platform, matrix.python) }}
      runs_on: ${{ matrix.runner }}
      python_version: ${{ matrix.python }}
      test_matrix: >-
        [{"name":"native-sparse","test_files":"test/test_set_native.py test/test_compressed_sparse_constructors.py"},
        {"name":"nn-utils","test_files":"test/test_nn_utils_norm.py"},
        {"name":"tensor-api","test_files":"test/test_sequence_factories.py test/test_shape_funcs.py test/test_tensor_properties_native.py"},
        {"name":"native-ops","test_files":"test/test_missing_native_ops.py test/test_prev_kernel_less_ops.py test/test_native_vmap_indexing.py"},
        {"name":"autograd","test_files":"test/test_autograd_engine.py test/test_autograd_functional.py test/test_forward_ad.py test/test_view_rebase.py test/test_version_counter.py"},
        {"name":"nn-api","test_files":"test/test_init.py test/test_linear_init.py test/test_new_layers.py test/test_nn_repr.py test/test_parameter.py"}]
      # Main-branch pushes publish their smoke-tested wheels to the rolling
      # nightly release; tags and release branches publish to their own.
      build_version: ${{ needs.define-wheel-matrix.outputs.nightly_version }}
      upload_release: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}

  cuda-build:
    # Plain main pushes build one regression lane per platform (the newest
    # toolkit); tags and release branches expand to every configured
    # variant, where the wheels are actually published. Pure frontend,
    # docs, or test-only pushes skip these lanes entirely.
    if: needs.define-wheel-matrix.outputs.build_skip != 'true' && needs.define-wheel-matrix.outputs.run_cuda == 'true'
    name: ${{ matrix.build_name }}-build-test
    needs: define-wheel-matrix
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.ref_type == 'tag' || startsWith(github.ref_name, 'release/')) && needs.define-wheel-matrix.outputs.cuda || needs.define-wheel-matrix.outputs.cuda_trunk) }}
    uses: ./.github/workflows/_binary-build-test.yml
    with:
      build_name: ${{ matrix.build_name }}
      build_environment: ${{ format('trunk-{0}-py{1}-{2}', matrix.platform, matrix.python, matrix.variant) }}
      runs_on: ${{ matrix.runner }}
      python_version: ${{ matrix.python }}
      cuda: ${{ matrix.variant }}
      cuda_toolkit: ${{ matrix.toolkit }}
      build_version: ${{ needs.define-wheel-matrix.outputs.nightly_version }}
      upload_release: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
