name: trunk

# Main-branch CI matrix. Each job builds and smoke-tests its wheel on the same
# runner, so no wheel needs to cross jobs or be stored as an Actions artifact.

on:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:

concurrency:
  # Branch-level group: a new push to the same branch supersedes the run
  # for the previous head instead of racing it. Including the SHA would
  # let every intermediate commit of a rapid series run its own full
  # matrix, so only the tip of the branch gets machine time.
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: read-all

jobs:
  define-wheel-matrix:
    name: define-wheel-matrix
    runs-on: ubuntu-latest
    outputs:
      cpu: ${{ steps.read-matrix.outputs.cpu }}
      cuda: ${{ steps.read-matrix.outputs.cuda }}
      cuda_trunk: ${{ steps.read-matrix.outputs.cuda_trunk }}
      run_cuda: ${{ steps.lanes.outputs.run_cuda }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          show-progress: false
          fetch-depth: 0
      - id: read-matrix
        shell: bash
        run: |
          set -euo pipefail
          # Trunk lane: newest toolkit only, one wheel per CUDA platform;
          # tags and release branches build every configured variant.
          cuda_trunk_matrix="$(jq -c --slurpfile variants .github/cuda-variants.json '
            [
              .cuda_platforms[] as $platform |
              {
                platform: $platform.name,
                runner: $platform.runner,
                python: "3.12",
                variant: ($variants[0][-1].variant),
                toolkit: ($variants[0][-1].toolkit),
                build_name: ("tensorplay-" + $platform.name + "-" + ($variants[0][-1].variant) + "-py3_12")
              }
            ]
          ' .github/wheel-platforms.json)"
          echo "cuda_trunk=$cuda_trunk_matrix" >> "$GITHUB_OUTPUT"
          cpu_matrix="$(jq -c '
            [
              .cpu_platforms[] as $platform |
              .python_versions[] as $python |
              {
                platform: $platform.name,
                runner: $platform.runner,
                python: $python,
                build_name: ("tensorplay-" + $platform.name + "-py" + ($python | gsub("\\."; "_")) + "-cpu")
              }
            ]
          ' .github/wheel-platforms.json)"
          cuda_matrix="$(jq -c --slurpfile variants .github/cuda-variants.json '
            [
              .cuda_platforms[] as $platform |
              .python_versions[] as $python |
              $variants[0][] as $cuda |
              {
                platform: $platform.name,
                runner: $platform.runner,
                python: $python,
                variant: $cuda.variant,
                toolkit: $cuda.toolkit,
                build_name: ("tensorplay-" + $platform.name + "-" + $cuda.variant + "-py" + ($python | gsub("\\."; "_")))
              }
            ]
          ' .github/wheel-platforms.json)"
          echo "cpu=$cpu_matrix" >> "$GITHUB_OUTPUT"
          echo "cuda=$cuda_matrix" >> "$GITHUB_OUTPUT"
      - id: lanes
        shell: bash
        env:
          GH_EVENT: ${{ github.event_name }}
          GH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # CUDA lanes are the most expensive slice of the matrix (GPU
          # toolkits download, fat .cu compiles). On plain pushes, skip
          # them when the change cannot touch device code: release and
          # tag builds, scheduled runs, and manual dispatches always
          # build the full matrix because their wheels get published.
          run_cuda=true
          if [[ "$GH_EVENT" == "push" ]] \
             && git rev-parse --verify -q "$GH_BEFORE^{commit}" >/dev/null; then
            if ! git diff --name-only "$GH_BEFORE"...HEAD \
                  | grep -qE '^p10/|^tpx/|^include/|^config/|^tools/|^cmake/|CMakeLists\.txt$|\.cu$|^(pyproject|setup)\.toml$|^version\.txt$|\.github/(workflows|scripts)/'; then
              echo "No CUDA-relevant paths in the pushed range; skipping CUDA lanes"
              run_cuda=false
            fi
          fi
          echo "run_cuda=$run_cuda" >> "$GITHUB_OUTPUT"

  cpu-build:
    name: ${{ matrix.build_name }}-build-test
    needs: define-wheel-matrix
    permissions:
      # The called workflow's build-test job needs contents: write to
      # upload wheels to a GitHub Release on tag builds; the job-level grant
      # here keeps the top-level read-all default untouched.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.define-wheel-matrix.outputs.cpu) }}
    uses: ./.github/workflows/_binary-build-test.yml
    with:
      build_name: ${{ matrix.build_name }}
      build_environment: ${{ format('trunk-{0}-py{1}-cpu', matrix.platform, matrix.python) }}
      runs_on: ${{ matrix.runner }}
      python_version: ${{ matrix.python }}

  cuda-build:
    # Plain main pushes build one regression lane per platform (the newest
    # toolkit); tags and release branches expand to every configured
    # variant, where the wheels are actually published. Pure frontend,
    # docs, or test-only pushes skip these lanes entirely.
    if: needs.define-wheel-matrix.outputs.run_cuda == 'true'
    name: ${{ matrix.build_name }}-build-test
    needs: define-wheel-matrix
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.ref_type == 'tag' || startsWith(github.ref_name, 'release/')) && needs.define-wheel-matrix.outputs.cuda || needs.define-wheel-matrix.outputs.cuda_trunk) }}
    uses: ./.github/workflows/_binary-build-test.yml
    with:
      build_name: ${{ matrix.build_name }}
      build_environment: ${{ format('trunk-{0}-py{1}-{2}', matrix.platform, matrix.python, matrix.variant) }}
      runs_on: ${{ matrix.runner }}
      python_version: ${{ matrix.python }}
      cuda: ${{ matrix.variant }}
      cuda_toolkit: ${{ matrix.toolkit }}
