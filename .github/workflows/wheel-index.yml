name: wheel-index

# Hands the download site a rebuild signal after every wheel-publishing
# run. The site itself lives in lexing-2026/tensorplay-index: its
# refresh-manifest workflow re-reads every non-draft release of this
# repository and republishes the static index. This workflow keeps one
# piece of release hygiene local: the rolling nightly release keeps only
# the newest calendar day of wheels, so the site can never point at
# pruned downloads. Every wheel tag from that day is retained while the
# matrix finishes.
#
# The trigger listens on workflow_run rather than release events because
# every release write in this repository (trunk, nightly, publish, rocm)
# happens through the default GITHUB_TOKEN, and GitHub suppresses
# workflow-triggering for events created by it to prevent recursion.
# Workflow completion events are not affected, so a finished publisher
# run is a reliable rebuild signal.

on:
  workflow_run:
    workflows:
      - trunk
      - nightly
      - publish
      - rocm-wheel
    types: [completed]
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions: read-all

concurrency:
  # Coalesces bursts: rapid edited events (one per uploaded asset) cancel
  # the running rebuild, and only the last one completes.
  group: wheel-index
  cancel-in-progress: true

jobs:
  rebuild:
    name: prune-nightly-and-dispatch-site
    # Failed publisher runs upload no new wheels; skipping them keeps a
    # late failure from cancelling the rebuild a successful run queued.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      INDEX_REPO: lexing-2026/tensorplay-index
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: false
          show-progress: false
      - name: Enforce nightly rolling retention
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "No nightly release yet, nothing to retain"
            exit 0
          fi
          python .github/scripts/prune_superseded_wheels.py \
            --repo "$GITHUB_REPOSITORY" \
            --release nightly

      - name: Dispatch site rebuild
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          # Release events carry the tag; workflow_run carries the finished
          # run's head commit; manual dispatches fall back to this run's SHA.
          SOURCE_REF: ${{ github.event.release.tag_name || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${DISPATCH_TOKEN}" ]]; then
            echo "::warning::WEBSITE_DEPLOY_TOKEN secret is not set; skipping site rebuild dispatch."
            exit 0
          fi
          gh api \
            -X POST \
            "repos/${INDEX_REPO}/dispatches" \
            -f event_type="wheel-publish" \
            -f "client_payload[source_ref]=${SOURCE_REF}" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}"
          echo "Dispatched wheel-publish to ${INDEX_REPO}"
