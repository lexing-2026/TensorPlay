name: wheel-index

# Reacts to release changes and hands the download site a rebuild signal.
# The site itself lives in lexing-2026/tensorplay-index: its refresh-manifest
# workflow re-reads every non-draft release of this repository and republishes
# the static index. This workflow keeps one piece of release hygiene local:
# the rolling nightly release keeps only the newest dev version per wheel
# variant, so the site can never point at pruned downloads. Retention is per
# variant, so a partially failed nightly never removes the last installable
# build of the variant that failed.

on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions: read-all

concurrency:
  # Coalesces bursts: rapid edited events (one per uploaded asset) cancel
  # the running rebuild, and only the last one completes.
  group: wheel-index
  cancel-in-progress: true

jobs:
  rebuild:
    name: prune-nightly-and-dispatch-site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      INDEX_REPO: lexing-2026/tensorplay-index
    steps:
      - name: Enforce nightly rolling retention
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "No nightly release yet, nothing to retain"
            exit 0
          fi
          # Keep, per wheel variant (+cpu, +cuXXX, no-label macOS), only the
          # assets of that variant's newest dev version; delete the rest.
          python -m pip install --disable-pip-version-check --quiet packaging
          python - <<'PY'
          import os
          import subprocess

          from packaging.version import Version

          repo = os.environ["GITHUB_REPOSITORY"]
          assets = subprocess.run(
              ["gh", "api", "repos/{0}/releases/tags/nightly".format(repo),
               "--jq", r'.assets[] | "\(.id) \(.name)"'],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()
          def variant_of(name: str) -> str:
              version = name.split("-")[1] if name.count("-") >= 2 else ""
              label = version.partition("+")[2]
              return label if label else "cpu"
          by_variant: dict[str, list[tuple[str, str, str]]] = {}
          for line in assets:
              asset_id, _, name = line.partition(" ")
              version = name.split("-")[1] if name.count("-") >= 2 else ""
              by_variant.setdefault(variant_of(name), []).append((asset_id, name, version.partition("+")[0]))
          for variant, entries in sorted(by_variant.items()):
              keep = max((base for _, _, base in entries), key=Version)
              for asset_id, name, base in entries:
                  if base != keep:
                      print(f"Deleting stale nightly asset {name} (variant {variant}, version {base})")
                      subprocess.run(
                          ["gh", "api", "-X", "DELETE",
                           f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{asset_id}"],
                          check=True,
                      )
          PY

      - name: Dispatch site rebuild
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.INDEX_REPO_TOKEN }}
          SOURCE_REF: ${{ github.event.release.tag_name || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${DISPATCH_TOKEN}" ]]; then
            echo "::warning::INDEX_REPO_TOKEN secret is not set; skipping site rebuild dispatch."
            exit 0
          fi
          gh api \
            -X POST \
            "repos/${INDEX_REPO}/dispatches" \
            -f event_type="wheel-publish" \
            -f "client_payload[source_ref]=${SOURCE_REF}" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}"
          echo "Dispatched wheel-publish to ${INDEX_REPO}"
