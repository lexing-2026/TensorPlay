name: cache-sync

# Synchronize the trusted runner's compiler cache with the object-storage
# bucket. The runner is the authentication boundary: its operator stores
# the endpoint and the bucket credentials in a machine-local environment
# file that this workflow sources; nothing provider-specific lives here.

on:
  workflow_dispatch:
    inputs:
      direction:
        description: push uploads the local cache to the bucket, pull restores it
        type: choice
        default: push
        options:
          - push
          - pull
      dry_run:
        description: log the transfer without executing it
        type: choice
        default: disabled
        options:
          - enabled
          - disabled

# One synchronization at a time; concurrent pushes would race the same
# bucket prefix.
concurrency:
  group: cache-sync
  cancel-in-progress: false

permissions: read-all

jobs:
  sync:
    name: cache-sync
    runs-on: tensorplay-runner-1
    timeout-minutes: 120
    steps:
      - name: Load machine-local object-store configuration
        shell: bash
        run: |
          set -euo pipefail
          # The credentials live beside the runner identity: RUNNER_WORKSPACE
          # is <runner-dir>/_work, so the file sits one level above it.
          if [[ -f "$RUNNER_WORKSPACE/../s3.env" ]]; then
            # shellcheck disable=SC1091
            source "$RUNNER_WORKSPACE/../s3.env"
          else
            echo "machine-local object-store configuration is missing" >&2
            exit 1
          fi
          {
            echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            echo "S3_BUCKET=${S3_BUCKET}"
            echo "S3_ENDPOINT=${S3_ENDPOINT}"
            echo "S3_REGION=${S3_REGION:-us-east-1}"
          } >> "$GITHUB_ENV"
          # The gateway may only be reachable through the machine's own
          # egress configuration; pass it through when present.
          for v in https_proxy HTTPS_PROXY no_proxy NO_PROXY; do
            if [[ -n "${!v:-}" ]]; then
              echo "${v}=${!v}" >> "$GITHUB_ENV"
            fi
          done

      - uses: actions/checkout@v7
        with:
          submodules: false
          show-progress: false

      - name: Synchronize the compiler cache
        shell: bash
        env:
          SYNC_DIRECTION: ${{ inputs.direction }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 .github/scripts/sync_object_cache.py
