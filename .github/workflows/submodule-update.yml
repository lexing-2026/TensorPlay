name: submodule-update

# Weekly bot that compares every third_party submodule against its upstream
# default branch and opens one Conventional-Commit PR per outdated submodule
# (see tools/submodule_updater.py).
#
# Two separate things stand between this bot and a green bump PR, and they
# are fixed in different places.
#
# Creating the PR at all needs the repository setting "Allow GitHub Actions
# to create and approve pull requests" (Settings -> Actions -> General ->
# Workflow permissions).  With it off the workflow token is refused before
# it reaches the API, whatever secrets this workflow carries.
#
# Running the gates on the PR is a different problem: a pull request opened
# by the workflow token does not trigger repository workflows, so lint and
# smoke-build stay unscheduled on it.  To have them run, provide a GitHub App
# installation token or a personal access token with pull-request write
# access as the SUBMODULE_UPDATE_PAT secret; it is used instead of the
# workflow token when present.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      submodule:
        description: "Only bump this submodule path, e.g. third_party/cutlass"
        required: false
        type: string
      dry_run:
        description: "Report drift without opening branches or PRs"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: submodule-update
  cancel-in-progress: false

jobs:
  update-submodules:
    name: update-submodules
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
          show-progress: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run submodule updater
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_UPDATE_PAT || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          args=()
          if [[ -n "${{ github.event.inputs.submodule }}" ]]; then
            args+=(--submodule "${{ github.event.inputs.submodule }}")
          fi
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python tools/submodule_updater.py "${args[@]}" | tee -a "${GITHUB_STEP_SUMMARY}"
