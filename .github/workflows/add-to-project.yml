name: add-to-project

# Adds every new issue and PR to the TensorPlay Roadmap project board
# (https://github.com/users/lexing-2026/projects/3, public).
#
# The default GITHUB_TOKEN cannot write to Projects, so this workflow uses a
# classic PAT with only the `project` scope, stored as the PROJECT_TOKEN
# repository secret. Fine-grained PATs are not usable here: their permission
# catalog has no Projects entry, so they cannot address ProjectsV2 via GraphQL.
# Without the secret the job no-ops.

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  add-to-project:
    name: add-to-project
    runs-on: ubuntu-latest
    steps:
      # Secrets cannot be referenced in job/step `if` directly, so probe it
      # through an env var first; the job no-ops until PROJECT_TOKEN exists.
      - name: Check the PROJECT_TOKEN secret
        id: check
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$PROJECT_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "PROJECT_TOKEN secret is not set; skipping project routing"
          fi

      - uses: actions/add-to-project@v1.0.2
        if: ${{ steps.check.outputs.enabled == 'true' }}
        with:
          project-url: https://github.com/users/lexing-2026/projects/3
          github-token: ${{ secrets.PROJECT_TOKEN }}
