name: lint

# Lint checks for Python sources (mirrors pytorch's lint.yml trigger shape;
# the lint rules live in [tool.ruff] in pyproject.toml).

on:
  pull_request:
    branches-ignore:
      - nightly
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions: read-all

jobs:
  lint:
    name: ruff-lint
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff lint
        run: ruff check tensorplay tpx tools test
