name: pull

# PR CI: lint plus one CPU smoke build. The full platform/variant wheel
# matrix runs on trunk (main pushes) and release tags, not on every PR.
#
# The build lane's test shards cover the suites that a hosted runner can run
# without a device: the compiler's guard and code-generation bookkeeping, the
# autograd engine, and the frontend areas whose defects were found by import
# or signature rather than by numerics. Suites that compare against an
# installed third-party framework, or that need a CUDA device, are not here:
# no hosted runner has a device, so device acceptance is dispatched by hand
# (cuda_acceptance) and run on the development host before a device change is
# merged.

on:
  pull_request:
    branches-ignore:
      - nightly
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions: read-all

jobs:
  smoke-build:
    name: pull-smoke-build
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_binary-build-test.yml
    with:
      build_name: tensorplay-linux-x86_64-py3_12-cpu
      build_environment: pull-smoke-linux-x86_64-py3_12
      runs_on: ubuntu-22.04
      python_version: "3.12"
      test_matrix: >-
        [{"name":"native-sparse","test_files":"test/test_set_native.py test/test_compressed_sparse_constructors.py"},
        {"name":"nn-utils","test_files":"test/nn/test_nn_utils_norm.py"},
        {"name":"autograd-engine","test_files":"test/autograd/test_autograd_engine.py"},
        {"name":"compiler-guards","test_files":"test/stax/test_guards.py test/stax/test_compiler_backends.py test/stax/test_codecache.py"},
        {"name":"frontend-coverage","test_files":"test/ao/test_ao_completeness.py test/audio/test_datasets.py test/distributed/test_fsdp_e2e.py"}]
    secrets: inherit
