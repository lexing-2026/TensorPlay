name: publish

# Release orchestrator: on a v*.*.0 tag, build and validate the cu130 wheel
# matrix, publish the tested wheels through GitHub Releases, and let the
# wheel-index workflow trigger the download-site rebuild.
#
# Release candidates (v*.*.0-rc*) run the same matrix and create a GitHub
# *prerelease*, but never touch PyPI or the stable wheel indexes (see
# RELEASE.md for the full process).

on:
  push:
    # Publish only major/minor releases and their release candidates:
    # v1.0.0, v1.2.0, v2.0.0, v1.0.0-rc1, ...
    # Patch tags such as v1.2.1 do not start this workflow.
    tags: ['v*.*.0', 'v*.*.0-rc*']
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Release tag to (re)build, e.g. v1.0.0. The matrix, release notes
          and wheel version all come from this tag, so a repair run builds
          exactly what a fresh tag push would build. Leave empty for a plain
          CI dispatch of the current ref.
        required: false
        type: string
        default: ""
      build_ref:
        description: >
          Source ref for the wheel build. Set this to a verified branch or
          commit when repairing a release without moving the release tag.
          Empty uses the release tag on repair dispatches.
        required: false
        type: string
        default: ""
      lanes:
        description: >
          Comma-separated substrings of the cu130 build_name to rebuild, e.g.
          "linux-x86_64-cu130-py3_10". Only cu130 CUDA lanes are published;
          CPU and older CUDA variants are never part of this matrix. Empty
          means the full cu130 matrix.
        required: false
        type: string
        default: ""
      linux_cuda_runner:
        description: >
          Optional runner override for the linux-x86_64 CUDA lanes, e.g.
          "ubuntu-22.04" or "self-hosted". Empty keeps the value from
          .github/wheel-platforms.json.
        required: false
        type: string
        default: ""
      windows_cuda_runner:
        description: >
          Optional runner override for the windows-x86_64 CUDA lanes, e.g.
          a larger-runner label. Empty keeps the value from
          .github/wheel-platforms.json.
        required: false
        type: string
        default: ""
      max_parallel:
        description: >
          Upper bound on build lanes executing at the same time. Hosted
          CUDA lanes show more stable behavior at small values (2-4);
          empty runs every matrix lane concurrently.
        required: false
        type: string
        default: ""
      max_jobs:
        description: >
          Pin for the per-machine compile parallelism (MAX_JOBS) inside
          every lane. The default is 2 because the CUDA build is stable at
          that level on both hosted operating systems.
        required: false
        type: string
        default: "2"
      s3_cache:
        description: >
          Set to "0" to keep the compiler cache on each runner's local
          disk; empty uses the object-storage backend when the repository
          secrets are present.
        required: false
        type: string
        default: ""

concurrency:
  # Repair dispatches name the tag so they land next to the original tag
  # run, and the lane filter is part of the group so complementary repairs
  # do not cancel each other -- only a dispatch with the same lane filter
  # supersedes its predecessor.
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}-${{ inputs.lanes }}
  cancel-in-progress: true

permissions: read-all

jobs:
  define-wheel-matrix:
    name: define-wheel-matrix
    runs-on: ubuntu-latest
    outputs:
      cuda: ${{ steps.read-matrix.outputs.cuda }}
      release_tag: ${{ steps.read-matrix.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Matrix metadata comes from the requested source ref; the release
          # tag remains an explicit version/upload destination.
          ref: ${{ inputs.build_ref != '' && inputs.build_ref || (inputs.tag != '' && inputs.tag || github.ref) }}
          submodules: false
          show-progress: false
      - id: read-matrix
        shell: bash
        run: |
          set -euo pipefail
          # Tag shape flags, evaluated once here because workflow expressions
          # have no regex helper. release_tag covers full semver tags and
          # their release candidates (vX.Y.Z or vX.Y.Z-rcN).
          # A repair dispatch derives them from the requested tag instead of
          # GITHUB_REF_NAME, which carries the branch name on dispatches.
          tag_name="${{ inputs.tag }}"
          ref_type="branch"
          if [[ -n "$tag_name" ]]; then
            ref_type="tag"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag_name="${GITHUB_REF_NAME:-}"
            ref_type="tag"
          fi
          release_tag=false
          if [[ "$ref_type" == "tag" && "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            release_tag=true
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          # The linux_cuda_runner input re-points the linux-x86_64 CUDA
          # lanes at dispatch time (hosted pool or a registered runner)
          # without touching the checked-in default.
          cuda_matrix="$(jq -c --slurpfile variants .github/cuda-variants.json --arg lcr "${{ inputs.linux_cuda_runner }}" --arg wcr "${{ inputs.windows_cuda_runner }}" '
            [
              .cuda_platforms[] as $platform |
              (if $lcr != "" and $platform.name == "linux-x86_64"
               then $platform + {runner: $lcr}
               else $platform
               end) as $platform |
              (if $wcr != "" and $platform.name == "windows-x86_64"
               then $platform + {runner: $wcr}
               else $platform
              end) as $platform |
              .python_versions[] as $python |
              $variants[0][] as $cuda |
              select($cuda.variant == "cu130") |
              {
                platform: $platform.name,
                runner: $platform.runner,
                python: $python,
                variant: $cuda.variant,
                toolkit: $cuda.toolkit,
                build_name: ("tensorplay-" + $platform.name + "-" + $cuda.variant + "-py" + ($python | gsub("\\."; "_")))
              }
            ]
          ' .github/wheel-platforms.json)"
          # A repair dispatch narrows the CUDA matrix to build names whose
          # text matches any comma-separated substring; an empty filter
          # keeps every cu130 lane.
          lanes="${{ inputs.lanes }}"
          if [[ -n "$lanes" ]]; then
            lane_pattern="$(printf '%s' "$lanes" | tr ',' '\n' | sed 's/[][\.*^$()+?{}|]/\\&/g' | paste -sd'|' -)"
            cuda_matrix="$(jq -c --arg re "$lane_pattern" 'map(select(.build_name | test($re)))' <<<"$cuda_matrix")"
          fi
          echo "cuda=$cuda_matrix" >> "$GITHUB_OUTPUT"

  # The release exists before any matrix job uploads its tested wheel. A
  # manual dispatch from a branch simply skips this step and runs CI locally.
  create-release:
    name: create-release
    needs: define-wheel-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.build_ref != '' && inputs.build_ref || github.ref }}
          submodules: false
          show-progress: false
      - name: Create release for an eligible tag
        if: ${{ needs.define-wheel-matrix.outputs.release_tag == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            # Curated notes live in docs/release-notes/<tag>.md, compiled from
            # (see docs/release-notes/TEMPLATE.md). Fall back to GitHub's
            # auto-generated notes when the file is missing.
            notes_args=(--generate-notes)
            notes_file="docs/release-notes/${RELEASE_TAG}.md"
            if [[ -f "$notes_file" ]]; then
              notes_args=(--notes-file "$notes_file")
            fi
            # Release candidates ship as prereleases and never reach PyPI or
            # the stable indexes.
            release_args=()
            if [[ "$RELEASE_TAG" == *-rc* ]]; then
              release_args=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "TensorPlay $RELEASE_TAG" \
              "${release_args[@]}" \
              "${notes_args[@]}"
          fi

  cuda-build:
    name: ${{ matrix.build_name }}-build-test
    needs:
      - define-wheel-matrix
      - create-release
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel == '' && 20 || fromJSON(inputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.define-wheel-matrix.outputs.cuda) }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_binary-build-test.yml
    with:
      build_name: ${{ matrix.build_name }}
      build_environment: ${{ format('release-{0}-py{1}-{2}', matrix.platform, matrix.python, matrix.variant) }}
      runs_on: ${{ matrix.runner }}
      python_version: ${{ matrix.python }}
      cuda: ${{ matrix.variant }}
      cuda_toolkit: ${{ matrix.toolkit }}
      upload_release: ${{ needs.define-wheel-matrix.outputs.release_tag == 'true' }}
      save_cache: false
      checkout_ref: ${{ inputs.build_ref != '' && inputs.build_ref || inputs.tag }}
      release_tag_name: ${{ inputs.tag }}
      max_jobs: ${{ inputs.max_jobs }}
      s3_cache: ${{ inputs.s3_cache }}
    secrets: inherit
