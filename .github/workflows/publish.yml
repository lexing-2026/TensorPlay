name: publish

# Release orchestrator: on a v*.*.0 tag, build the configured wheel matrix,
# validate every wheel, publish CPU wheels to PyPI via trusted publishing, and
# publish every configured CUDA variant through GitHub Releases; the
# wheel-index workflow then triggers the download-site rebuild.
#
# Release candidates (v*.*.0-rc*) run the same matrix and create a GitHub
# *prerelease*, but never touch PyPI or the stable wheel indexes (see
# RELEASE.md for the full process).

on:
  push:
    # Publish only major/minor releases and their release candidates:
    # v1.0.0, v1.2.0, v2.0.0, v1.0.0-rc1, ...
    # Patch tags such as v1.2.1 do not start this workflow.
    tags: ['v*.*.0', 'v*.*.0-rc*']
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Release tag to (re)build, e.g. v1.0.0. The matrix, release notes
          and wheel version all come from this tag, so a repair run builds
          exactly what a fresh tag push would build. Leave empty for a plain
          CI dispatch of the current ref.
        required: false
        type: string
        default: ""
      lanes:
        description: >
          Comma-separated substrings of build_name to rebuild, e.g.
          "cu124,cu126". Only lanes whose build_name contains any of the
          substrings run, which is how a failed release is repaired without
          rebuilding the lanes that already shipped. Empty means the full
          matrix.
        required: false
        type: string
        default: ""
      pypi_only:
        description: >
          Republish the CPU wheels already sitting on the release to PyPI
          without running any build lane: the wheels are downloaded,
          normalized (the local version segment is stripped and stale bare
          linux_* assets are dropped) and uploaded. Set to the string
          "true"; a string input keeps the equality checks in the job
          conditions free of boolean-to-string coercion surprises.
        required: false
        type: string
        default: ""

concurrency:
  # Repair dispatches name the tag so they land next to the original tag
  # run, and the lane filter is part of the group so complementary repairs
  # (a CPU one while a CUDA one is still running) do not cancel each other
  # -- only a dispatch with the same lane filter supersedes its predecessor.
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}-${{ inputs.lanes }}
  cancel-in-progress: true

permissions: read-all

jobs:
  define-wheel-matrix:
    name: define-wheel-matrix
    runs-on: ubuntu-latest
    outputs:
      cpu: ${{ steps.read-matrix.outputs.cpu }}
      cuda: ${{ steps.read-matrix.outputs.cuda }}
      variants: ${{ steps.read-matrix.outputs.variants }}
      release_tag: ${{ steps.read-matrix.outputs.release_tag }}
      stable_tag: ${{ steps.read-matrix.outputs.stable_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A repair dispatch reads the matrix, notes and tag shape from the
          # release tag itself, so the run behaves exactly like a fresh tag
          # push.
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}
          submodules: false
          show-progress: false
      - id: read-matrix
        shell: bash
        run: |
          set -euo pipefail
          # Tag shape flags, evaluated once here because workflow expressions
          # have no regex helper. release_tag covers full semver tags and
          # their release candidates (vX.Y.Z or vX.Y.Z-rcN); stable_tag only
          # matches the X.Y.0 tags that publish to PyPI and the index branch.
          # A repair dispatch derives them from the requested tag instead of
          # GITHUB_REF_NAME, which carries the branch name on dispatches.
          tag_name="${{ inputs.tag }}"
          ref_type="branch"
          if [[ -n "$tag_name" ]]; then
            ref_type="tag"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag_name="${GITHUB_REF_NAME:-}"
            ref_type="tag"
          fi
          release_tag=false
          stable_tag=false
          if [[ "$ref_type" == "tag" && "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            release_tag=true
          fi
          if [[ "$ref_type" == "tag" && "$tag_name" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            stable_tag=true
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "stable_tag=$stable_tag" >> "$GITHUB_OUTPUT"
          cpu_matrix="$(jq -c '
            [
              .cpu_platforms[] as $platform |
              .python_versions[] as $python |
              {
                platform: $platform.name,
                runner: $platform.runner,
                python: $python,
                build_name: ("tensorplay-" + $platform.name + "-py" + ($python | gsub("\\."; "_")) + "-cpu")
              }
            ]
          ' .github/wheel-platforms.json)"
          cuda_matrix="$(jq -c --slurpfile variants .github/cuda-variants.json '
            [
              .cuda_platforms[] as $platform |
              .python_versions[] as $python |
              $variants[0][] as $cuda |
              {
                platform: $platform.name,
                runner: $platform.runner,
                python: $python,
                variant: $cuda.variant,
                toolkit: $cuda.toolkit,
                build_name: ("tensorplay-" + $platform.name + "-" + $cuda.variant + "-py" + ($python | gsub("\\."; "_")))
              }
            ]
          ' .github/wheel-platforms.json)"
          # A repair dispatch narrows both matrices to the lanes whose
          # build_name matches any of the comma-separated substrings; an
          # empty filter keeps every lane.
          lanes="${{ inputs.lanes }}"
          if [[ -n "$lanes" ]]; then
            lane_pattern="$(printf '%s' "$lanes" | tr ',' '\n' | sed 's/[][\.*^$()+?{}|]/\\&/g' | paste -sd'|' -)"
            cpu_matrix="$(jq -c --arg re "$lane_pattern" 'map(select(.build_name | test($re)))' <<<"$cpu_matrix")"
            cuda_matrix="$(jq -c --arg re "$lane_pattern" 'map(select(.build_name | test($re)))' <<<"$cuda_matrix")"
          fi
          echo "cpu=$cpu_matrix" >> "$GITHUB_OUTPUT"
          echo "cuda=$cuda_matrix" >> "$GITHUB_OUTPUT"
          echo "variants=$(jq -c . .github/cuda-variants.json)" >> "$GITHUB_OUTPUT"

  # The release exists before any matrix job uploads its tested wheel. A
  # manual dispatch from a branch simply skips this step and runs CI locally.
  create-release:
    name: create-release
    needs: define-wheel-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          show-progress: false
      - name: Create release for an eligible tag
        if: ${{ needs.define-wheel-matrix.outputs.release_tag == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            # Curated notes live in docs/release-notes/<tag>.md, compiled from
            # (see docs/release-notes/TEMPLATE.md). Fall back to GitHub's
            # auto-generated notes when the file is missing.
            notes_args=(--generate-notes)
            notes_file="docs/release-notes/${RELEASE_TAG}.md"
            if [[ -f "$notes_file" ]]; then
              notes_args=(--notes-file "$notes_file")
            fi
            # Release candidates ship as prereleases and never reach PyPI or
            # the stable indexes.
            release_args=()
            if [[ "$RELEASE_TAG" == *-rc* ]]; then
              release_args=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "TensorPlay $RELEASE_TAG" \
              "${release_args[@]}" \
              "${notes_args[@]}"
          fi

  cpu-build:
    name: ${{ matrix.build_name }}-build-test
    if: inputs.pypi_only != 'true'
    needs:
      - define-wheel-matrix
      - create-release
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.define-wheel-matrix.outputs.cpu) }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_binary-build-test.yml
    with:
      build_name: ${{ matrix.build_name }}
      build_environment: ${{ format('release-{0}-py{1}-cpu', matrix.platform, matrix.python) }}
      runs_on: ${{ matrix.runner }}
      python_version: ${{ matrix.python }}
      test_matrix: >-
        [{"name":"native-sparse","test_files":"test/test_set_native.py test/test_compressed_sparse_constructors.py"},
        {"name":"nn-utils","test_files":"test/test_nn_utils_norm.py"},
        {"name":"tensor-api","test_files":"test/test_sequence_factories.py test/test_shape_funcs.py test/test_tensor_properties_native.py"},
        {"name":"native-ops","test_files":"test/test_missing_native_ops.py test/test_prev_kernel_less_ops.py test/test_native_vmap_indexing.py"},
        {"name":"autograd","test_files":"test/test_autograd_engine.py test/test_autograd_functional.py test/test_forward_ad.py test/test_view_rebase.py test/test_version_counter.py test/test_zero_stride_pointwise.py"},
        {"name":"nn-api","test_files":"test/test_init.py test/test_linear_init.py test/test_new_layers.py test/test_nn_repr.py test/test_parameter.py"}]
      upload_release: ${{ needs.define-wheel-matrix.outputs.release_tag == 'true' }}
      save_cache: false
      checkout_ref: ${{ inputs.tag }}
      release_tag_name: ${{ inputs.tag }}

  cuda-build:
    name: ${{ matrix.build_name }}-build-test
    if: inputs.pypi_only != 'true'
    needs:
      - define-wheel-matrix
      - create-release
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.define-wheel-matrix.outputs.cuda) }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_binary-build-test.yml
    with:
      build_name: ${{ matrix.build_name }}
      build_environment: ${{ format('release-{0}-py{1}-{2}', matrix.platform, matrix.python, matrix.variant) }}
      runs_on: ${{ matrix.runner }}
      python_version: ${{ matrix.python }}
      cuda: ${{ matrix.variant }}
      cuda_toolkit: ${{ matrix.toolkit }}
      upload_release: ${{ needs.define-wheel-matrix.outputs.release_tag == 'true' }}
      save_cache: false
      checkout_ref: ${{ inputs.tag }}
      release_tag_name: ${{ inputs.tag }}

  pypi-upload:
    # CPU wheels remain on PyPI -- stable releases only, never release
    # candidates. Release assets are downloaded after every CPU build has
    # tested and uploaded its own wheel.
    # always() is required: a skipped cpu-build would otherwise short-
    # circuit the whole condition before the result check gets evaluated.
    if: >-
      always() &&
      needs.define-wheel-matrix.outputs.stable_tag == 'true' &&
      (needs.cpu-build.result == 'success' ||
       (inputs.pypi_only == 'true' && needs.cpu-build.result == 'skipped'))
    needs:
      - define-wheel-matrix
      - cpu-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tensorplay
    permissions:
      id-token: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download CPU wheels from GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets dist
          gh release download "${{ inputs.tag || github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets

          shopt -s nullglob
          for wheel in release-assets/*.whl; do
            case "$wheel" in
              *+cu*.whl) ;;
              *) cp "$wheel" dist/ ;;
            esac
          done
          cpu_wheels=(dist/*.whl)
          if (("${#cpu_wheels[@]}" == 0)); then
            echo "No CPU wheels found in release assets" >&2
            exit 1
          fi
          printf 'CPU wheels:\n%s\n' "${cpu_wheels[@]}"

      - name: Normalize wheel versions for PyPI
        shell: bash
        run: |
          set -euo pipefail
          # A repair dispatch builds from the release tag but on the default
          # branch, so the wheels carry a PEP 440 local version segment that
          # PyPI rejects outright. Strip it from the filename, the
          # dist-info directory and the metadata in one pass; bare linux_*
          # assets from an earlier upload attempt stay on the release but
          # are never republished.
          release_tag="${{ inputs.tag || github.ref_name }}"
          target_version="${release_tag#v}"
          target_version="${target_version/-rc/rc}"
          python3 - "$target_version" <<'PY'
          import re
          import sys
          import zipfile
          from pathlib import Path

          target = sys.argv[1]
          kept = 0
          for wheel in sorted(Path("dist").glob("*.whl")):
              stem = wheel.stem
              platform_tag = stem.rsplit("-", 1)[-1]
              if platform_tag.startswith("linux_"):
                  wheel.unlink()
                  print(f"dropped bare-linux wheel: {wheel.name}")
                  continue
              if wheel.stat().st_size > 100 * 1024 * 1024:
                  wheel.unlink()
                  print(f"skipped oversize wheel (PyPI per-file limit): {wheel.name}")
                  continue
              version = stem.split("-")[1]
              base = version.split("+")[0]
              if base == target and "+" not in version:
                  kept += 1
                  continue
              assert base == target, f"{wheel.name}: version {version} does not start with {target}"
              replacement = stem.replace(version, base)
              with zipfile.ZipFile(wheel) as archive:
                  entries = {name: archive.read(name) for name in archive.namelist()}
              rewritten = {}
              for name, payload in entries.items():
                  new_name = name.replace(version, base)
                  if name.endswith(("METADATA", "RECORD")):
                      payload = payload.replace(version.encode(), base.encode())
                  rewritten[new_name] = payload
              wheel.unlink()
              with zipfile.ZipFile(Path("dist") / f"{replacement}.whl", "w", zipfile.ZIP_DEFLATED) as archive:
                  for name, payload in rewritten.items():
                      archive.writestr(name, payload)
              print(f"normalized: {stem}.whl -> {replacement}.whl")
              kept += 1
          assert kept > 0, "no CPU wheels left to publish"
          PY

      - name: Publish CPU wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
