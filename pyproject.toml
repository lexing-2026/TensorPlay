[build-system]
requires = [
    # 1.0 is required for [tool.scikit-build.env] and [[tool.dynamic-metadata]]
    # used below (MAX_JOBS forwarding, version.txt as the version source).
    "scikit-build-core>=1.0",
    "pybind11",
    "PyYAML",
    "ninja",
    "numpy",
    "cmake<4.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "tensorplay"
dynamic = ["version"]
description = "A simple deep learning framework designed for educational purposes and small-scale experiments."
readme = "README.md"
authors = [{ name = "zlx", email = "2095774200@shu.edu.cn" }]
maintainers = [{ name = "lexing-2026", email = "2095774200@shu.edu.cn" }]
license = { text = "Apache License 2.0" }
keywords = ["deep learning", "neural network", "tensor", "framework", "education", "CUDA", "CPU"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=2.0.0",
    "sympy>=1.13.3",
    "typing-extensions>=4.16.0",
    "PyYAML"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Typing :: Typed"
]

[project.optional-dependencies]
all = [
    "matplotlib",
    "tqdm",
    "onnx",
    "scipy",
    "soundfile",
    "tensorboard>=2.11",
    "pillow>=9.0",
    "megatensors>=0.0.5; platform_system != 'Darwin'"
]
mega = [
    "megatensors>=0.0.5; platform_system != 'Darwin'"
]
tensorboard = [
    "tensorboard>=2.11",
    "pillow>=9.0"
]

[project.urls]
Homepage = "https://tensorplay.cn"
Repository = "https://github.com/lexing-2026/TensorPlay.git"
Issues = "https://github.com/lexing-2026/TensorPlay/issues"
PyPI = "https://pypi.org/project/tensorplay/"
Socket = "https://socket.dev/pypi/package/tensorplay"
Changelog = "https://github.com/lexing-2026/TensorPlay/blob/main/CHANGELOG.md"
Documentation = "https://tensorplay.cn"
Contributing = "https://github.com/lexing-2026/TensorPlay/blob/main/CONTRIBUTING.md"

[[tool.dynamic-metadata]]
# Delegates to tools/metadata/version.py which resolves the version from
# TENSORPLAY_BUILD_VERSION / TENSORPLAY_BUILD_NUMBER (release), PKG-INFO
# tools/metadata provider chain.
provider = { path = "tools/metadata", module = "version" }

[tool.scikit-build]
# Track the build-system.requires floor (scikit-build-core>=1.0) so the schema
# and defaults are pinned to the version we build against.
minimum-version = "build-system.requires"
build-dir = "build"
# cmake.build-type is deliberately not set: it defaults to Release, and
# leaving it unconfigured lets scikit-build-core honor a CMAKE_BUILD_TYPE

[tool.scikit-build.env]
# CMake natively honors for `cmake --build`. setdefault semantics: a
# user-set CMAKE_BUILD_PARALLEL_LEVEL always wins.
CMAKE_BUILD_PARALLEL_LEVEL = { env = "MAX_JOBS" }

[tool.scikit-build.editable]
# Editable installs use redirect mode: Python files come from the source
# tree, CMake-built artifacts from the build tree. Rebuild-on-import is OFF
# (a rebuild on every import stalls `import tensorplay`); rebuild explicitly
# instead.
mode = "redirect"
rebuild = false

[tool.scikit-build.install]
# Disable stripping to avoid potential issues with DLLs on Windows.
strip = false

[tool.scikit-build.sdist]
# Ship the buildable sources, not repo/CI plumbing or the reference-only
# work, never consumed by the build).
exclude = [
    "**/.github/**",
    "build/**",
]

[[tool.scikit-build.overrides]]
# Force the Ninja generator on Windows. The Visual Studio (multi-config)
# generator marshals nvcc's host-compiler flag groups differently: the
# quoted -Xcompiler block arrives split, so nvcc reads the group's tokens
# as input files and aborts with "A single input file is required". Ninja
# passes the command line the way CMake wrote it. Generator resolution
# honors cmake.define.CMAKE_GENERATOR, so this is the single source of
# truth (and covers plain non-CI editable builds too) instead of a
# CI-exported env var. Under Ninja, CMake does not default to MSVC, so
# CC/CXX are pinned to cl to keep the host build on MSVC; setdefault
# semantics respect an explicitly set CC/CXX (e.g. clang-cl).
if.platform-system = "win32"
cmake.define.CMAKE_GENERATOR = "Ninja"
env.CC = "cl"
env.CXX = "cl"

[tool.scikit-build.wheel]
# Python packages to include in the wheel; CMake installs the built
# libraries/stubs under tensorplay/ relative to the wheel root.
packages = ["tensorplay"]

# Ensure we include everything installed by CMake, but exclude unwanted artifacts if they slip through
# scikit-build-core automatically includes files in wheel.packages
# We can use exclude to be safe
exclude = [
    "tensorplay/include",
    "tensorplay/share",
    "tensorplay/lib/cmake",
    "tensorplay/lib/*.lib",
    "include",
    "share",
    "lib/cmake",
    "lib/*.lib" 
]

[dependency-groups]
# requirements-build.txt in sync with [dependency-groups] dev).
dev = [
    "scikit-build-core>=1.0",
    "cmake<4.0",
    "ninja",
    "pybind11",
    "PyYAML",
    "packaging>=26.3",
    "build",
    "pytest",
    # Rerun flaky tests locally: pytest --reruns 2 (see CONTRIBUTING.md).
    "pytest-rerunfailures",
    "numpy>=2.0.0",
    "sympy>=1.13.3",
    "typing-extensions>=4.16.0",
    # Conventional Commits tooling: cz changelog drafts only; versions follow
    "commitizen",
    "pre-commit",
]

# Linter tools #################################################################

[tool.ruff]
line-length = 120
src = ["tensorplay", "tpx", "tools", "test"]
extend-exclude = ["third_party", "build", "alpha", "stax", "p10", "tensorplay/_C"]

[tool.ruff.lint]
select = [
    "F",              # pyflakes
    "E4", "E7", "E9", # subset of pycodestyle errors
]
ignore = [
    # Pre-existing debt across the codebase; tighten over time
    "E402",                 # module level import not at top of file
    "E701", "E702", "E731", # colon/semicolon compound statements, lambda assign
    "E741",                 # ambiguous variable name `l`; used in math-heavy code
    "F401", "F403", "F405", # unused/star imports
    "F811", "F821", "F822", "F841", # redefinition, undefined name, unused variable
    "F541",                 # f-string without placeholders
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",  # re-exports
]

# Conventional Commits (commitizen) ############################################
# Used ONLY for changelog drafting (`cz changelog --dry-run`, see RELEASE.md).
# (version.txt + tools/generate_tensorplay_version.py). Commit message
# enforcement lives in tools/commit_schema.py (commit-msg hook + pr-title
# workflow); its scope-enum maps 1:1 to the "release notes: *" labels.
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
# Read the current version from git tags instead of duplicating version.txt.
version_provider = "scm"
changelog_merge_pr_sections = true

[tool.commitizen.change_type_map]
feat = "New Features"
fix = "Bug fixes"
perf = "Performance"
refactor = "Improvements"
